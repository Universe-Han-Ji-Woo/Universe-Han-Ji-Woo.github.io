<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERSE | 기록 스테이션</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* 🌌 기본 우주 배경 설정 */
        body { 
            margin: 0; 
            background-color: #0b111e; 
            color: white; 
            font-family: 'Noto Sans KR', sans-serif; 
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
        }

        /* ✨ 배경 별무리 효과 (컨트롤 타워와 동일) */
        .universe-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1a253a 0%, #0b111e 80%);
            z-index: -1;
        }
        .star {
            position: absolute; background: #fff; border-radius: 50%; opacity: 0;
            animation: twinkle var(--duration) infinite ease-in-out;
        }
        @keyframes twinkle {
            0%, 100% { opacity: var(--min-opacity); transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 🛸 글쓰기 컨테이너 (유리창 효과) */
        .write-container { 
            width: 90%; max-width: 850px; 
            background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(15px);
            padding: 40px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 20px; 
            box-shadow: 0 0 50px rgba(0,0,0,0.5);
            margin: 40px 0;
        }

        .header { 
            display: flex; justify-content: space-between; align-items: center; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
            padding-bottom: 20px; margin-bottom: 25px; 
        }
        .header h2 { margin: 0; font-weight: 700; letter-spacing: 2px; color: #fff; }

        .info-row { 
            margin-bottom: 25px; font-size: 14px; color: #8ea8c9; 
            display: flex; gap: 20px; align-items: center; 
        }
        
        /* ♎ 말머리 드롭다운 우주 스타일 */
        .category-select {
            padding: 8px 15px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            font-size: 13px;
            outline: none;
            background-color: rgba(0, 0, 0, 0.3);
            color: #fff;
            cursor: pointer;
            transition: 0.3s;
        }
        .category-select:hover { border-color: #ff2d55; }
        .category-select option { background-color: #1a253a; color: white; }

        /* ✍️ 입력창 스타일 */
        input[type="text"] { 
            width: 100%; padding: 15px 0; 
            border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.1); 
            font-size: 26px; font-weight: bold; outline: none; 
            background: transparent; color: #fff;
            margin-bottom: 25px; transition: 0.3s;
        }
        input[type="text"]:focus { border-bottom: 1px solid #ff2d55; }
        input[type="text"]::placeholder { color: rgba(255, 255, 255, 0.2); }

        textarea { 
            width: 100%; min-height: 400px; border: none; 
            font-size: 17px; line-height: 1.8; outline: none; resize: none; 
            background: transparent; color: rgba(255, 255, 255, 0.8);
        }
        textarea::placeholder { color: rgba(255, 255, 255, 0.2); }

        /* 🚀 버튼 스타일 */
        .btn-submit { 
            background-color: #ff2d55; color: white; border: none; 
            padding: 12px 35px; border-radius: 25px; font-weight: bold;
            cursor: pointer; transition: 0.4s;
            box-shadow: 0 0 15px rgba(255, 45, 85, 0.3);
        }
        .btn-submit:hover { 
            background-color: #fff; color: #ff2d55; 
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="universe-bg" id="starContainer"></div>

    <div class="write-container">
        <div class="header">
            <h2>기록 스테이션</h2>
            <button class="btn-submit" id="saveBtn">임무 완료 (등록)</button>
        </div>

        <div class="info-row">
            <div>
                말머리: 
                <select id="category" class="category-select">
                    <option value="수다">수다</option>
                    <option value="지우">지우</option>
                </select>
            </div>
            <div>기록관: <span id="writerName" style="font-weight: bold; color: #fff;">로드 중...</span></div>
        </div>

        <input type="text" id="title" placeholder="무엇을 기록하시겠습니까?">
        <textarea id="content" placeholder="우주 깊은 곳의 이야기를 남겨주세요..."></textarea>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://jiwoo-fanpage-default-rtdb.firebaseio.com",
            projectId: "jiwoo-fanpage"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const user = urlParams.get('user') || "익명";
        document.getElementById('writerName').innerText = user;

        // 🛡️ 관리자 권한 체크 및 별 생성
        const isAdmin = (user === "관리자" || user === "한지우");
        const categorySelect = document.getElementById('category');

        if (isAdmin) {
            const adminOption = document.createElement('option');
            adminOption.value = "공지";
            adminOption.innerText = "공지";
            categorySelect.appendChild(adminOption);
        }

        // ✨ 배경 별 생성 함수
        function createStars() {
            const container = document.getElementById('starContainer');
            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 1.5 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                star.style.setProperty('--min-opacity', Math.random() * 0.3);
                star.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(star);
            }
        }
        createStars();

        document.getElementById('saveBtn').onclick = async () => {
            const category = categorySelect.value;
            const title = document.getElementById('title').value;
            const content = document.getElementById('content').value;

            if(!title || !content) return alert("제목과 내용을 입력해주세요.");
            if (category === "공지" && !isAdmin) return alert("공지 말머리는 관리자 전용입니다.");

            const postsRef = ref(db, 'posts_v2');
            const newPostRef = push(postsRef);
            
            await set(newPostRef, {
                category: category,
                title: title,
                content: content,
                writer: user,
                date: new Date().toLocaleDateString(),
                timestamp: Date.now(),
                views: 0,
                likes: 0
            });

            alert("기록이 유니버스에 성공적으로 저장되었습니다.");
            location.href = `board.html?user=${encodeURIComponent(user)}`;
        };
    </script>
</body>
</html>
