<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNIVERSE | 기록 스테이션</title>
    
    <script src="config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* 🌌 기존 우주 디자인 스타일 유지 */
        body { 
            margin: 0; background-color: #0b111e; color: white; 
            font-family: 'Noto Sans KR', sans-serif; min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            position: relative; overflow-x: hidden;
        }

        .universe-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1a253a 0%, #0b111e 80%); z-index: -1; }
        .star { position: absolute; background: #fff; border-radius: 50%; opacity: 0; animation: twinkle var(--duration) infinite ease-in-out; }
        @keyframes twinkle {
            0%, 100% { opacity: var(--min-opacity); transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        .write-container { 
            width: 92%; max-width: 850px; background: rgba(255, 255, 255, 0.03); 
            backdrop-filter: blur(20px); padding: 40px; border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 24px; box-shadow: 0 25px 50px rgba(0,0,0,0.6);
            margin: 20px 0; box-sizing: border-box;
        }

        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 20px; margin-bottom: 25px; }
        .header h2 { margin: 0; font-weight: 700; letter-spacing: 1px; color: #fff; font-size: 1.5rem; }

        .info-row { margin-bottom: 25px; font-size: 14px; color: #8ea8c9; display: flex; gap: 15px; align-items: center; flex-wrap: wrap; }
        .category-select { padding: 8px 12px; border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; font-size: 13px; outline: none; background-color: rgba(0, 0, 0, 0.4); color: #fff; cursor: pointer; transition: 0.3s; }
        .category-select:hover { border-color: #ff2d55; }

        input[type="text"] { width: 100%; padding: 15px 0; border: none; border-bottom: 1px solid rgba(255, 255, 255, 0.1); font-size: 24px; font-weight: bold; outline: none; background: transparent; color: #fff; margin-bottom: 25px; box-sizing: border-box; }
        input[type="text"]:focus { border-bottom: 1px solid #ff2d55; }
        textarea { width: 100%; min-height: 350px; border: none; font-size: 16px; line-height: 1.8; outline: none; resize: none; background: transparent; color: rgba(255, 255, 255, 0.8); box-sizing: border-box; }

        .btn-submit { background-color: #ff2d55; color: white; border: none; padding: 10px 30px; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.4s; box-shadow: 0 5px 15px rgba(255, 45, 85, 0.3); white-space: nowrap; }
        .btn-submit:hover { background-color: #fff; color: #ff2d55; box-shadow: 0 0 20px rgba(255, 255, 255, 0.4); transform: translateY(-2px); }

        @media (max-width: 768px) {
            body { align-items: flex-start; }
            .write-container { width: 100%; margin: 0; padding: 30px 20px; border-radius: 0; border: none; min-height: 100vh; }
            .header h2 { font-size: 1.2rem; }
            input[type="text"] { font-size: 20px; }
            textarea { min-height: 300px; font-size: 15px; }
        }
    </style>
</head>
<body>
    <div class="universe-bg" id="starContainer"></div>

    <div class="write-container">
        <div class="header">
            <h2 onclick="Universe.navigateTo('board')" style="cursor:pointer">기록 스테이션</h2>
            <button class="btn-submit" id="saveBtn">등록</button>
        </div>

        <div class="info-row">
            <div>
                말머리: 
                <select id="category" class="category-select">
                    <option value="수다">수다</option>
                    <option value="지우">지우</option>
                </select>
            </div>
            <div>기록관: <span id="writerName" style="font-weight: bold; color: #fff;">---</span></div>
        </div>

        <input type="text" id="title" placeholder="제목을 입력하세요" autocomplete="off">
        <textarea id="content" placeholder="오늘의 우주를 기록해보세요..."></textarea>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // config.js의 설정값 사용
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Universe 객체로 유저 정보 가져오기
        const currentUser = Universe.getUser();
        document.getElementById('writerName').innerText = currentUser;

        // 관리자 권한 확인 (공지 카테고리 추가)
        const isAdmin = (currentUser === "관리자" || currentUser === "한지우");
        if (isAdmin) {
            const categorySelect = document.getElementById('category');
            const adminOption = document.createElement('option');
            adminOption.value = "공지";
            adminOption.innerText = "공지";
            categorySelect.prepend(adminOption); // 공지를 맨 앞으로
            categorySelect.value = "공지";
        }

        // 별무리 배경 생성 (기존 로직 유지)
        function createStars() {
            const container = document.getElementById('starContainer');
            const starCount = window.innerWidth < 768 ? 50 : 100;
            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 1.5 + 1;
                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${Math.random() * 100}%`;
                star.style.top = `${Math.random() * 100}%`;
                star.style.setProperty('--duration', `${Math.random() * 3 + 2}s`);
                star.style.setProperty('--min-opacity', Math.random() * 0.3);
                star.style.animationDelay = `${Math.random() * 5}s`;
                container.appendChild(star);
            }
        }
        createStars();

        // 게시글 저장 로직
        document.getElementById('saveBtn').onclick = async () => {
            const category = document.getElementById('category').value;
            const title = document.getElementById('title').value.trim();
            const content = document.getElementById('content').value.trim();

            if(!title || !content) return alert("제목과 내용을 입력해주세요.");
            
            const saveBtn = document.getElementById('saveBtn');
            saveBtn.disabled = true;
            saveBtn.innerText = "전송 중...";

            try {
                const postsRef = ref(db, 'posts_v2');
                const newPostRef = push(postsRef);
                
                await set(newPostRef, {
                    category: category,
                    title: title,
                    content: content,
                    writer: currentUser,
                    date: new Date().toLocaleDateString(),
                    timestamp: Date.now(),
                    views: 0,
                    likes: 0
                });

                alert("성공적으로 기록되었습니다.");
                // Universe 표준 함수로 게시판으로 이동
                Universe.navigateTo('board');
            } catch (e) {
                console.error(e);
                alert("오류가 발생했습니다. 다시 시도해주세요.");
                saveBtn.disabled = false;
                saveBtn.innerText = "등록";
            }
        };
    </script>
</body>
</html>
