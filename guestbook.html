<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universe | Guest Book</title>
    
    <script src="config.js"></script>

    <style>
        :root {
            --main-red: #ff2d55;
            --bg-dark: #050a10;
            --box-bg: rgba(255, 255, 255, 0.03);
            --border-light: rgba(255, 255, 255, 0.08);
            --vh: 1vh;
        }

        body { 
            background: var(--bg-dark); 
            color: #fff; 
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            margin: 0; padding: 0;
            overflow: hidden;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        
        h2 { 
            text-align: center; 
            font-size: clamp(1.5rem, 6vw, 2.2rem);
            letter-spacing: 5px; 
            font-weight: 900;
            margin: 20px 0 5px 0;
            text-shadow: 0 0 20px rgba(255, 45, 85, 0.3);
        }

        .user-info { 
            text-align: center; 
            font-size: 0.8rem; 
            color: #8ea8c9; 
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--box-bg);
            padding: 15px;
            border-radius: 18px;
            border: 1px solid var(--border-light);
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input { 
            padding: 12px 15px; 
            border-radius: 12px; 
            border: none; 
            background: rgba(255,255,255,0.06); 
            color: white; 
            outline: none;
            font-size: 16px;
        }

        #nameInput { width: 100px; }
        #msgInput { flex: 1; }

        button { 
            padding: 0 20px; 
            background: var(--main-red); 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: bold; 
            color: #fff; 
            transition: 0.3s ease;
        }
        button:active { transform: scale(0.95); }

        .msg-list { 
            flex: 1;
            overflow-y: auto; 
            padding-right: 5px;
            /* 리스트 상하단 부드러운 페이드 효과 */
            mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
        }
        
        .msg-list::-webkit-scrollbar { width: 4px; }
        .msg-list::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }

        .msg-item { 
            background: var(--box-bg);
            margin-bottom: 12px;
            padding: 16px; 
            border-radius: 18px;
            border: 1px solid var(--border-light);
            border-left: 4px solid var(--main-red);
            animation: slideUp 0.4s ease-out forwards;
        }
        
        .user-name { 
            display: block;
            color: var(--main-red); 
            font-weight: 900; 
            font-size: 0.75rem; 
            margin-bottom: 6px;
        }
        .user-text { font-size: 0.95rem; line-height: 1.6; color: #eee; word-break: break-all; }

        .back-btn { text-align: center; padding: 15px 0; color: #555; text-decoration: none; font-size: 0.8rem; cursor: pointer; letter-spacing: 2px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h2>GUEST BOOK</h2>
        <p class="user-info">SYSTEM CONNECTED: <span id="displayUser">---</span></p>
        
        <div class="input-area">
            <div class="input-row">
                <input type="text" id="nameInput" placeholder="닉네임" autocomplete="off">
                <input type="text" id="msgInput" placeholder="우주 정거장에 메시지 기록..." autocomplete="off">
                <button id="saveBtn">SEND</button>
            </div>
        </div>

        <div class="msg-list" id="msgList">
            <p style="text-align:center; padding-top:100px; color:#333; letter-spacing: 2px;">SYNCING UNIVERSE...</p>
        </div>

        <div class="back-btn" onclick="Universe.navigateTo('MENU')">[ RETURN TO TOWER ]</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // 기기 높이 최적화
        function setVh() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        window.addEventListener('resize', setVh);
        setVh();

        // 파이어베이스 초기화 (config.js의 firebaseConfig 사용)
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const guestbookRef = ref(db, 'guestbook');

        // 사용자 정보 설정
        const currentUser = (typeof Universe !== 'undefined' && Universe.getUser) ? Universe.getUser() : "VISITOR";
        document.getElementById('displayUser').innerText = currentUser;
        document.getElementById('nameInput').value = currentUser;

        // 메시지 저장 로직 (window 객체에 바인딩하여 버튼 클릭 대응)
        window.saveMessage = function() {
            const nameInput = document.getElementById('nameInput');
            const msgInput = document.getElementById('msgInput');
            
            const name = nameInput.value.trim();
            const msg = msgInput.value.trim();

            if (!name) return alert("닉네임을 입력해주세요.");
            if (!msg) return alert("메시지를 입력해주세요.");

            push(guestbookRef, {
                name: name,
                message: msg,
                timestamp: Date.now()
            }).then(() => {
                msgInput.value = ''; 
                msgInput.focus();
            }).catch((err) => {
                console.error("기록 실패:", err);
            });
        };

        // 이벤트 리스너 등록
        document.getElementById('msgInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') saveMessage();
        });
        document.getElementById('saveBtn').onclick = saveMessage;

        // 3. 실시간 데이터 불러오기 (갤러리와 연동되지 않도록 고유 쿼리 유지)
        const recentMessagesQuery = query(guestbookRef, orderByChild('timestamp'), limitToLast(50));
        
        onValue(recentMessagesQuery, (snapshot) => {
            const list = document.getElementById('msgList');
            list.innerHTML = '';
            const data = snapshot.val();
            
            if (data) {
                // 데이터를 배열로 변환 후 최신순 정렬
                const items = Object.keys(data).map(key => data[key]);
                items.sort((a, b) => b.timestamp - a.timestamp);
                
                items.forEach((item) => {
                    const userName = item.name || "VISITOR";
                    const div = document.createElement('div');
                    div.className = 'msg-item';
                    div.innerHTML = `
                        <span class="user-name">${userName}</span>
                        <div class="user-text">${item.message}</div>
                    `;
                    list.appendChild(div);
                });
            } else {
                list.innerHTML = "<p style='text-align:center; padding-top:100px; color:#222;'>NO DATA</p>";
            }
        });
    </script>
</body>
</html>
