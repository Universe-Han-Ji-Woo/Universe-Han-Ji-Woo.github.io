<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook - Han Ji Woo Universe</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* 관리자님의 원래 디자인 스타일로 복구 */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* 📍 이 버튼만 딱 추가했습니다 */
        .back-link {
            margin-top: 40px;
            text-align: center;
        }
        .back-link a {
            text-decoration: none;
            color: #8a8a8a;
            font-size: 14px;
            letter-spacing: 2px;
            border-bottom: 1px solid #eee;
            padding-bottom: 5px;
            transition: 0.3s;
        }
        .back-link a:hover {
            color: #000;
            border-bottom: 1px solid #000;
        }

        header {
            text-align: center;
            padding: 40px 0;
        }
        h1 {
            font-weight: 300;
            letter-spacing: 5px;
        }
        .container {
            width: 90%;
            max-width: 600px;
        }
        /* 기존 게시판 입력창 스타일 유지 */
        .guestbook-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 40px;
        }
        input, textarea {
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        button {
            padding: 12px;
            background-color: #000;
            color: #fff;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="back-link">
        <a href="index.html">— Back to Universe</a>
    </div>

    <header>
        <h1>GUESTBOOK</h1>
        <p>지우 유니버스의 기록을 남겨주세요.</p>
    </header>

    <div class="container">
        <div class="guestbook-form">
            <input type="text" id="nameInput" placeholder="이름">
            <textarea id="messageInput" rows="4" placeholder="지우에게 전할 메시지"></textarea>
            <button onclick="writeMessage()">지우에게 보내기</button>
        </div>
        <div id="messagesList"></div>
    </div>

    <script>
        // 여기에 관리자님의 Firebase 설정 코드를 그대로 붙여넣으시면 됩니다.
        function writeMessage() {
            console.log("메시지 전송 기능");
        }
    </script>
</body>
</html>
