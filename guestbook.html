<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universe | Gallery</title>
    
    <script src="config.js"></script>

    <style>
        :root {
            --main-red: #ff2d55;
            --bg-dark: #050a10;
            --box-bg: rgba(255, 255, 255, 0.03);
            --border-light: rgba(255, 255, 255, 0.08);
            --vh: 1vh;
        }

        body { 
            background: var(--bg-dark); 
            color: #fff; 
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            margin: 0; padding: 0;
            overflow: hidden;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%;
            max-width: 800px; /* 갤러리는 조금 더 넓게 */
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        
        h2 { 
            text-align: center; 
            font-size: clamp(1.5rem, 6vw, 2.2rem);
            letter-spacing: 5px; 
            font-weight: 900;
            margin: 20px 0 15px 0;
            text-shadow: 0 0 20px rgba(255, 45, 85, 0.3);
        }

        /* 📸 사진 그리드 영역 */
        .gallery-grid { 
            flex: 1;
            overflow-y: auto; 
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 기본 2열 */
            gap: 15px;
            padding-bottom: 20px;
            mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
        }

        /* 태블릿/PC에서는 3열로 */
        @media (min-width: 600px) {
            .gallery-grid { grid-template-columns: repeat(3, 1fr); }
        }

        .gallery-item { 
            background: var(--box-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--border-light);
            aspect-ratio: 1 / 1; /* 정정사각형 유지 */
            position: relative;
            animation: fadeIn 0.5s ease-out forwards;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .gallery-item:hover img {
            transform: scale(1.05);
        }

        .img-info {
            position: absolute;
            bottom: 0;
            width: 100%;
            padding: 10px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            font-size: 0.7rem;
            color: #eee;
        }

        /* 스크롤바 */
        .gallery-grid::-webkit-scrollbar { width: 4px; }
        .gallery-grid::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }

        .back-btn { text-align: center; padding: 15px 0; color: #555; text-decoration: none; font-size: 0.8rem; cursor: pointer; letter-spacing: 2px; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container">
        <h2>GALLERY</h2>
        
        <div class="gallery-grid" id="galleryGrid">
            <p style="text-align:center; grid-column: 1/-1; padding-top:100px; color:#333;">LOADING UNIVERSE...</p>
        </div>

        <div class="back-btn" onclick="Universe.navigateTo('MENU')">[ RETURN TO TOWER ]</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, query, orderByChild } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // 기기별 높이 최적화
        function setVh() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        window.addEventListener('resize', setVh);
        setVh();

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const galleryRef = ref(db, 'gallery'); // 갤러리 전용 경로

        // 📸 갤러리 데이터 실시간 로드
        onValue(galleryRef, (snapshot) => {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '';
            
            const data = snapshot.val();
            if (data) {
                const items = Object.keys(data).map(key => data[key]);
                // 최신순 정렬 (timestamp가 있다면)
                items.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                items.forEach((item) => {
                    const div = document.createElement('div');
                    div.className = 'gallery-item';
                    
                    // 이미지 경로(url)가 있는지 확인 후 출력
                    const imgUrl = item.url || item.image || "";
                    const title = item.title || "Universe Art";

                    div.innerHTML = `
                        <img src="${imgUrl}" alt="Gallery Image" onerror="this.src='https://via.placeholder.com/300?text=No+Image'">
                        <div class="img-info">${title}</div>
                    `;
                    grid.appendChild(div);
                });
            } else {
                grid.innerHTML = "<p style='text-align:center; grid-column: 1/-1; padding-top:100px; color:#222;'>NO PHOTOS YET</p>";
            }
        });
    </script>
</body>
</html>
