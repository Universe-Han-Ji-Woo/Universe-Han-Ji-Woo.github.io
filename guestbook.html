<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universe | Guest Book</title>
    
    <script src="config.js"></script>

    <style>
        :root {
            --main-red: #ff2d55;
            --bg-dark: #050a10;
            --box-bg: rgba(255, 255, 255, 0.03);
            --border-light: rgba(255, 255, 255, 0.08);
            --vh: 1vh;
        }

        body { 
            background: var(--bg-dark); 
            color: #fff; 
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            margin: 0; padding: 0;
            overflow: hidden;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        
        h2 { 
            text-align: center; 
            font-size: clamp(1.5rem, 6vw, 2.2rem);
            letter-spacing: 5px; 
            font-weight: 900;
            margin: 20px 0 5px 0;
            text-shadow: 0 0 20px rgba(255, 45, 85, 0.3);
        }

        .user-info { 
            text-align: center; 
            font-size: 0.8rem; 
            color: #8ea8c9; 
            margin-bottom: 15px;
            opacity: 0.8;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: var(--box-bg);
            padding: 15px;
            border-radius: 18px;
            border: 1px solid var(--border-light);
            margin-bottom: 20px;
        }

        .input-row {
            display: flex;
            gap: 10px;
        }

        input { 
            padding: 12px 15px; 
            border-radius: 12px; 
            border: none; 
            background: rgba(255,255,255,0.06); 
            color: white; 
            outline: none;
            font-size: 16px;
        }

        #nameInput { width: 100px; }
        #msgInput { flex: 1; }

        button { 
            padding: 0 20px; 
            background: var(--main-red); 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: bold; 
            color: #fff; 
            transition: 0.3s ease;
        }
        button:active { transform: scale(0.95); }

        .msg-list { 
            flex: 1;
            overflow-y: auto; 
            padding-right: 5px;
            mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
        }
        
        .msg-list::-webkit-scrollbar { width: 4px; }
        .msg-list::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }

        .msg-item { 
            background: var(--box-bg);
            margin-bottom: 12px;
            padding: 16px; 
            border-radius: 18px;
            border: 1px solid var(--border-light);
            border-left: 4px solid var(--main-red);
            animation: slideUp 0.4s ease-out forwards;
            position: relative;
        }
        
        .user-name { 
            display: block;
            color: var(--main-red); 
            font-weight: 900; 
            font-size: 0.75rem; 
            margin-bottom: 6px;
        }
        .user-text { font-size: 0.95rem; line-height: 1.6; color: #eee; word-break: break-all; padding-right: 25px; }

        /* 관리자 전용 삭제 버튼 (X) */
        .del-btn {
            position: absolute;
            top: 10px;
            right: 12px;
            color: rgba(255, 255, 255, 0.2);
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            padding: 5px;
            display: none; /* 기본 숨김 */
            transition: color 0.2s;
            z-index: 10;
        }
        .del-btn:hover { color: var(--main-red); }

        .back-btn { text-align: center; padding: 15px 0; color: #555; text-decoration: none; font-size: 0.8rem; cursor: pointer; letter-spacing: 2px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

        /* 모바일 반응형 조정 */
        @media (max-width: 600px) {
            .container { padding: 15px; }
            input { font-size: 14px; }
            #nameInput { width: 80px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>GUEST BOOK</h2>
        <p class="user-info">SYSTEM CONNECTED: <span id="displayUser">---</span></p>
        
        <div class="input-area">
            <div class="input-row">
                <input type="text" id="nameInput" placeholder="닉네임" autocomplete="off">
                <input type="text" id="msgInput" placeholder="우주 정거장에 메시지 기록..." autocomplete="off">
                <button id="saveBtn">SEND</button>
            </div>
        </div>

        <div class="msg-list" id="msgList">
            <p style="text-align:center; padding-top:100px; color:#333; letter-spacing: 2px;">SYNCING UNIVERSE...</p>
        </div>

        <div class="back-btn" onclick="Universe.navigateTo('MENU')">[ RETURN TO TOWER ]</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast, remove } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 모바일 브라우저 100vh 대응
        function setVh() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        window.addEventListener('resize', setVh);
        setVh();

        // 파이어베이스 초기화
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const guestbookRef = ref(db, 'guestbook');

        const ADMIN_EMAIL = "joar6563@naver.com";
        let isAdmin = false;

        // 관리자 확인 및 데이터 로드 연동
        onAuthStateChanged(auth, (user) => {
            isAdmin = (user && user.email === ADMIN_EMAIL);
            loadMessages(); 
        });

        // 현재 사용자 표시
        const currentUser = (typeof Universe !== 'undefined' && Universe.getUser) ? Universe.getUser() : "VISITOR";
        document.getElementById('displayUser').innerText = currentUser;
        document.getElementById('nameInput').value = currentUser;

        // 메시지 전송 함수
        window.saveMessage = function() {
            const nameInput = document.getElementById('nameInput');
            const msgInput = document.getElementById('msgInput');
            const name = nameInput.value.trim();
            const msg = msgInput.value.trim();

            if (!name || !msg) return;

            push(guestbookRef, {
                name: name,
                message: msg,
                timestamp: Date.now()
            }).then(() => {
                msgInput.value = ''; 
                msgInput.focus();
            });
        };

        // 메시지 삭제 함수 (오직 이 페이지의 guestbook 경로만 타겟팅)
        window.deleteMsg = function(key) {
            if (!isAdmin) return;
            if (confirm("기록을 소멸시키겠습니까?")) {
                const targetRef = ref(db, `guestbook/${key}`);
                remove(targetRef).catch(err => console.error("삭제 실패", err));
            }
        };

        document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') saveMessage(); });
        document.getElementById('saveBtn').onclick = saveMessage;

        // 실시간 메시지 렌더링
        function loadMessages() {
            const q = query(guestbookRef, orderByChild('timestamp'), limitToLast(50));
            onValue(q, (snapshot) => {
                const list = document.getElementById('msgList');
                list.innerHTML = '';
                const data = snapshot.val();
                
                if (data) {
                    const sortedKeys = Object.keys(data).sort((a, b) => data[b].timestamp - data[a].timestamp);
                    
                    sortedKeys.forEach((key) => {
                        const item = data[key];
                        const div = document.createElement('div');
                        div.className = 'msg-item';
                        
                        // 관리자 버튼 생성 여부
                        const deleteBtn = isAdmin ? `<span class="del-btn" style="display:block" onclick="deleteMsg('${key}')">✕</span>` : '';
                        
                        div.innerHTML = `
                            <span class="user-name">${item.name || "VISITOR"}</span>
                            <div class="user-text">${item.message}</div>
                            ${deleteBtn}
                        `;
                        list.appendChild(div);
                    });
                } else {
                    list.innerHTML = "<p style='text-align:center; padding-top:100px; color:#222; font-size:12px;'>NO MESSAGES</p>";
                }
            });
        }
    </script>
</body>
</html>
