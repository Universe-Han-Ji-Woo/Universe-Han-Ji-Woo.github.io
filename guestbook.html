<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guestbook - Han Ji Woo Universe</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #ffffff;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* [핵심] 중간 타워로 가는 길 - Back to Universe */
        .back-to-universe {
            margin-top: 50px;
            margin-bottom: 20px;
            text-align: center;
        }

        .back-to-universe a {
            text-decoration: none;
            color: #999;
            font-size: 13px;
            letter-spacing: 3px;
            text-transform: uppercase;
            transition: all 0.4s ease;
            border-bottom: 1px solid #eee;
            padding-bottom: 8px;
        }

        .back-to-universe a:hover {
            color: #000;
            border-bottom: 1px solid #000;
            letter-spacing: 5px; /* 호버 시 우주가 확장되는 느낌 */
        }

        header {
            text-align: center;
            padding: 40px 0;
        }

        h1 {
            font-weight: 300;
            letter-spacing: 5px;
            margin-bottom: 10px;
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin-bottom: 100px;
        }

        /* 방명록 입력 및 리스트 스타일은 기존 설정을 그대로 유지합니다 */
        .guestbook-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 40px;
        }

        input, textarea {
            padding: 12px;
            border: 1px solid #eee;
            border-radius: 4px;
            font-family: inherit;
        }

        button {
            padding: 12px;
            background-color: #000;
            color: #fff;
            border: none;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #444;
        }

        .messages-list {
            list-style: none;
            padding: 0;
        }

        .message-item {
            border-bottom: 1px solid #f9f9f9;
            padding: 20px 0;
        }

        .message-header {
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .message-content {
            font-size: 15px;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <nav class="back-to-universe">
        <a href="index.html">— Back to Universe</a>
    </nav>

    <header>
        <h1>GUESTBOOK</h1>
        <p>지우 유니버스의 기록을 남겨주세요.</p>
    </header>

    <div class="container">
        <div class="guestbook-form">
            <input type="text" id="nameInput" placeholder="이름">
            <textarea id="messageInput" rows="4" placeholder="지우에게 전할 메시지"></textarea>
            <button onclick="writeMessage()">지우에게 보내기</button>
        </div>

        <div id="messagesList" class="messages-list">
            </div>
    </div>

    <script>
        // 여기에 관리자님의 Firebase 설정 및 writeMessage 함수가 들어갑니다.
        // 아까 보안 설정한 그 API Key가 들어있는 스크립트 부분을 그대로 쓰시면 됩니다.
    </script>

</body>
</html>
