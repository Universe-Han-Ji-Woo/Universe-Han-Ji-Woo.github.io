<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universe | Guestbook</title>
    
    <script src="config.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCD0OaaN1E5uT950X5hkzCBdqT87JQRXrg",
            authDomain: "jiwoo-fanpage.firebaseapp.com",
            databaseURL: "https://jiwoo-fanpage-default-rtdb.firebaseio.com", 
            projectId: "jiwoo-fanpage",
            storageBucket: "jiwoo-fanpage.firebasestorage.app",
            messagingSenderId: "928634858988",
            appId: "1:928634858988:web:34ae1adf6bab3ad654e4c9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let currentUser = "";

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            currentUser = urlParams.get('user');
            
            // 로그인 정보가 없으면 입구로 튕겨내기
            if(!currentUser) {
                UniverseNav.goToIndex();
                return;
            }
            
            document.getElementById('userBadge').innerText = currentUser;
            loadMessages();
        };

        // 메시지 저장
        function postMessage() {
            const msgInput = document.getElementById('msgInput');
            const message = msgInput.value.trim();
            if(!message) return;

            db.ref('guestbook').push({
                user: currentUser,
                text: message,
                timestamp: Date.now()
            });

            msgInput.value = "";
        }

        // 메시지 불러오기 (실시간)
        function loadMessages() {
            db.ref('guestbook').limitToLast(50).on('value', (snapshot) => {
                const list = document.getElementById('msgList');
                list.innerHTML = "";
                const data = snapshot.val();
                if(!data) return;

                Object.values(data).reverse().forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'msg-card';
                    div.innerHTML = `
                        <div class="msg-user">${item.user}</div>
                        <div class="msg-text">${item.text}</div>
                    `;
                    list.appendChild(div);
                });
            });
        }
    </script>

    <style>
        body { 
            margin: 0; padding: 0; background: #050a10; color: #fff;
            font-family: 'Apple SD Gothic Neo', sans-serif; height: 100vh;
            display: flex; flex-direction: column;
        }
        /* 상단 네비게이션 */
        .nav-bar {
            padding: 20px; display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.02);
            backdrop-filter: blur(10px);
        }
        .btn-back { 
            background: none; border: 1px solid #8ea8c9; color: #8ea8c9; 
            padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold;
        }
        .user-info { font-size: 0.8rem; color: #8ea8c9; }

        /* 입력 구역 */
        .input-zone { padding: 20px; background: rgba(255,255,255,0.05); }
        .input-box {
            display: flex; gap: 10px; max-width: 600px; margin: 0 auto;
        }
        input {
            flex: 1; padding: 12px; border-radius: 10px; border: none;
            background: rgba(255,255,255,0.1); color: #fff; outline: none;
        }
        .btn-send {
            background: #8ea8c9; color: #050a10; border: none; padding: 0 20px;
            border-radius: 10px; font-weight: 900; cursor: pointer;
        }

        /* 메시지 리스트 */
        .msg-list {
            flex: 1; overflow-y: auto; padding: 20px;
            display: flex; flex-direction: column; gap: 15px;
        }
        .msg-card {
            background: rgba(255,255,255,0.03); padding: 15px; border-radius: 15px;
            max-width: 500px; border-left: 3px solid #8ea8c9;
        }
        .msg-user { font-size: 0.75rem; color: #8ea8c9; font-weight: bold; margin-bottom: 5px; }
        .msg-text { font-size: 0.95rem; line-height: 1.5; }

        /* 스크롤바 디자인 */
        .msg-list::-webkit-scrollbar { width: 5px; }
        .msg-list::-webkit-scrollbar-thumb { background: rgba(142, 168, 204, 0.3); border-radius: 10px; }
    </style>
</head>
<body>

    <div class="nav-bar">
        <button class="btn-back" onclick="UniverseNav.goToMenu()">← BACK TO MENU</button>
        <div class="user-info">대원: <span id="userBadge">---</span></div>
    </div>

    <div class="msg-list" id="msgList">
        </div>

    <div class="input-zone">
        <div class="input-box">
            <input type="text" id="msgInput" placeholder="지우 유니버스에 메시지를 남기세요..." onkeypress="if(event.key==='Enter') postMessage()">
            <button class="btn-send" onclick="postMessage()">전송</button>
        </div>
    </div>

</body>
</html>
