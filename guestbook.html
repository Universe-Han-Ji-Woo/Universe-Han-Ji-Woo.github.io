<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>UNIVERSE | GUESTBOOK</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* 🌌 우주 테마 기본 스타일 */
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0b111e;
            color: white;
            margin: 0; padding: 0;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1a253a 0%, #0b111e 80%);
        }

        /* 🔙 상단 복귀 링크 (menu.html로 경로 수정) */
        .back-link { margin-top: 30px; text-align: center; z-index: 10; }
        .back-link a {
            text-decoration: none; color: #8ea8c9; font-size: 13px;
            letter-spacing: 2px; transition: 0.3s; padding: 8px 18px;
            border: 1px solid rgba(255,255,255,0.1); border-radius: 20px;
            background: rgba(255,255,255,0.05);
        }
        .back-link a:hover { 
            color: #fff; 
            background: rgba(255,255,255,0.15); 
            box-shadow: 0 0 15px rgba(255,255,255,0.2); 
            border-color: rgba(255,255,255,0.3);
        }

        header { text-align: center; padding: 50px 20px 30px; }
        header h1 { font-weight: 700; letter-spacing: 8px; margin: 0; font-size: 2.2rem; color: #fff; }
        header p { color: #8ea8c9; font-size: 0.9rem; margin-top: 10px; opacity: 0.8; }

        .container { width: 90%; max-width: 650px; margin-bottom: 50px; }

        /* ✍️ 방명록 입력 폼 (글래스모피즘) */
        .guestbook-form {
            display: flex; flex-direction: column; gap: 15px;
            background: rgba(255, 255, 255, 0.05);
            padding: 25px; border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            margin-bottom: 40px;
        }
        input, textarea {
            padding: 15px; background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px; color: white; outline: none;
            font-family: inherit; transition: 0.3s;
        }
        input:focus, textarea:focus { border-color: #ff2d55; background: rgba(0, 0, 0, 0.5); }
        input::placeholder, textarea::placeholder { color: rgba(255,255,255,0.3); }

        button {
            padding: 15px; background-color: #ff2d55;
            color: #fff; border: none; border-radius: 12px;
            cursor: pointer; font-weight: bold; font-size: 16px;
            transition: 0.3s; box-shadow: 0 5px 15px rgba(255, 45, 85, 0.3);
        }
        button:hover { background-color: #fff; color: #ff2d55; transform: translateY(-2px); }

        /* 💬 메시지 리스트 스타일 */
        .message-item {
            background: rgba(255, 255, 255, 0.03);
            padding: 20px; border-radius: 15px;
            border-left: 4px solid #ff2d55;
            margin-bottom: 15px; animation: fadeIn 0.5s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .msg-header { display: flex; justify-content: space-between; margin-bottom: 10px; font-size: 13px; color: #8ea8c9; }
        .msg-name { font-weight: bold; color: #fff; font-size: 15px; }
        .msg-content { line-height: 1.6; font-size: 15px; color: #cbd5e0; white-space: pre-wrap; }

        /* 🔢 페이지네이션 */
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
        .page-btn {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
            color: #fff; padding: 8px 15px; border-radius: 8px; cursor: pointer; transition: 0.3s;
        }
        .page-btn.active { background: #ff2d55; border-color: #ff2d55; }
        .page-btn:hover:not(.active) { background: rgba(255,255,255,0.2); }

        /* 📱 반응형 최적화 (전기종 대응) */
        @media (max-width: 768px) {
            header h1 { font-size: 1.8rem; letter-spacing: 5px; }
            .container { width: 95%; }
            .guestbook-form { padding: 20px; }
            input, textarea, button { font-size: 15px; }
        }
    </style>
</head>
<body>

    <div class="back-link">
        <a href="menu.html">← BACK TO UNIVERSE</a>
    </div>

    <header>
        <h1>GUESTBOOK</h1>
        <p>지우 유니버스에 오신 것을 환영합니다.</p>
    </header>

    <div class="container">
        <div class="guestbook-form">
            <input type="text" id="nameInput" placeholder="닉네임을 입력하세요">
            <textarea id="messageInput" rows="3" placeholder="지우님에게 따듯한 인사말을 남겨주세요"></textarea>
            <button id="submitBtn">지우에게 메시지 전송</button>
        </div>

        <div id="messagesList"></div>

        <div class="pagination" id="pagination"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, query, orderByChild } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://jiwoo-fanpage-default-rtdb.firebaseio.com",
            projectId: "jiwoo-fanpage"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const guestbookRef = ref(db, 'guestbook');

        const ITEMS_PER_PAGE = 5; 
        let currentPage = 1;
        let allMessages = [];

        // ✍️ 메시지 작성
        document.getElementById('submitBtn').onclick = async () => {
            const name = document.getElementById('nameInput').value;
            const message = document.getElementById('messageInput').value;

            if(!name || !message) return alert("이름과 인사말을 모두 입력해주세요!");

            const newMessageRef = push(guestbookRef);
            await set(newMessageRef, {
                name: name,
                message: message,
                timestamp: Date.now(),
                date: new Date().toLocaleString()
            });

            document.getElementById('nameInput').value = "";
            document.getElementById('messageInput').value = "";
            alert("지우님에게 마음이 전달되었습니다!");
        };

        // 🔄 실시간 데이터 로드
        onValue(query(guestbookRef), (snapshot) => {
            const data = snapshot.val();
            allMessages = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    allMessages.push(data[key]);
                });
                allMessages.sort((a, b) => b.timestamp - a.timestamp);
            }
            renderMessages();
            renderPagination();
        });

        function renderMessages() {
            const listDiv = document.getElementById('messagesList');
            listDiv.innerHTML = "";
            const start = (currentPage - 1) * ITEMS_PER_PAGE;
            const end = start + ITEMS_PER_PAGE;
            const paginatedItems = allMessages.slice(start, end);

            if (paginatedItems.length === 0) {
                listDiv.innerHTML = "<p style='text-align:center; color:#8ea8c9;'>첫 번째 기록을 남겨보세요.</p>";
                return;
            }

            paginatedItems.forEach(msg => {
                const item = document.createElement('div');
                item.className = 'message-item';
                item.innerHTML = `
                    <div class="msg-header">
                        <span class="msg-name">${msg.name}</span>
                        <span>${msg.date}</span>
                    </div>
                    <div class="msg-content">${msg.message}</div>
                `;
                listDiv.appendChild(item);
            });
        }

        function renderPagination() {
            const pagDiv = document.getElementById('pagination');
            pagDiv.innerHTML = "";
            const totalPages = Math.ceil(allMessages.length / ITEMS_PER_PAGE);
            if (totalPages <= 1) return;

            for (let i = 1; i <= totalPages; i++) {
                const btn = document.createElement('button');
                btn.className = `page-btn ${i === currentPage ? 'active' : ''}`;
                btn.innerText = i;
                btn.onclick = () => {
                    currentPage = i;
                    renderMessages();
                    renderPagination();
                    window.scrollTo({ top: 400, behavior: 'smooth' });
                };
                pagDiv.appendChild(btn);
            }
        }
    </script>
</body>
</html>
