<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universe | Guest Book</title>
    
    <script src="config.js"></script>

    <style>
        :root {
            --main-red: #ff2d55;
            --bg-dark: #050a10;
            --box-bg: rgba(255, 255, 255, 0.03);
            --border-light: rgba(255, 255, 255, 0.08);
            --vh: 1vh;
        }

        body { 
            background: var(--bg-dark); 
            color: #fff; 
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            margin: 0; padding: 0;
            overflow: hidden;
            height: calc(var(--vh, 1vh) * 100);
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%; max-width: 600px; height: 100%;
            display: flex; flex-direction: column; padding: 20px; box-sizing: border-box;
        }
        
        h2 { 
            text-align: center; font-size: clamp(1.5rem, 6vw, 2.2rem);
            letter-spacing: 5px; font-weight: 900; margin: 20px 0 5px 0;
            text-shadow: 0 0 20px rgba(255, 45, 85, 0.3);
        }

        .user-info { text-align: center; font-size: 0.8rem; color: #8ea8c9; margin-bottom: 15px; opacity: 0.8; }

        .input-area {
            display: flex; flex-direction: column; gap: 10px; background: var(--box-bg);
            padding: 15px; border-radius: 18px; border: 1px solid var(--border-light); margin-bottom: 20px;
        }

        .input-row { display: flex; gap: 10px; }

        input { 
            padding: 12px 15px; border-radius: 12px; border: none; 
            background: rgba(255,255,255,0.06); color: white; outline: none; font-size: 16px;
        }

        #nameInput { width: 100px; }
        #msgInput { flex: 1; }

        button { 
            padding: 0 20px; background: var(--main-red); border: none; 
            border-radius: 12px; cursor: pointer; font-weight: bold; color: #fff; 
        }

        .msg-list { 
            flex: 1; overflow-y: auto; padding-right: 5px;
            mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
            -webkit-mask-image: linear-gradient(to bottom, transparent, black 5%, black 95%, transparent);
        }
        
        .msg-item { 
            background: var(--box-bg); margin-bottom: 12px; padding: 16px; 
            border-radius: 18px; border: 1px solid var(--border-light);
            border-left: 4px solid var(--main-red); animation: slideUp 0.4s ease-out forwards;
            position: relative; /* 삭제 버튼의 기준 */
        }
        
        .user-name { display: block; color: var(--main-red); font-weight: 900; font-size: 0.75rem; margin-bottom: 6px; }
        .user-text { font-size: 0.95rem; line-height: 1.6; color: #eee; word-break: break-all; padding-right: 35px; }

        /* [수정부] 삭제 버튼의 가시성 대폭 강화 */
        .del-btn {
            position: absolute !important;
            top: 10px !important;
            right: 10px !important;
            width: 24px !important;
            height: 24px !important;
            background-color: rgba(255, 45, 85, 0.2) !important; /* 연한 빨강 배경 */
            border: 1px solid #ff2d55 !important; /* 선명한 빨강 테두리 */
            border-radius: 50% !important;
            color: #ff2d55 !important; /* 선명한 빨강 X */
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 12px !important;
            font-weight: bold !important;
            cursor: pointer !important;
            z-index: 999 !important; /* 가장 위로 */
            transition: all 0.2s;
        }
        .del-btn:hover { background-color: #ff2d55 !important; color: white !important; }

        .back-btn { text-align: center; padding: 15px 0; color: #555; text-decoration: none; font-size: 0.8rem; cursor: pointer; letter-spacing: 2px; }

        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h2>GUEST BOOK</h2>
        <p class="user-info">SYSTEM CONNECTED: <span id="displayUser">---</span></p>
        
        <div class="input-area">
            <div class="input-row">
                <input type="text" id="nameInput" placeholder="닉네임" autocomplete="off">
                <input type="text" id="msgInput" placeholder="우주 정거장에 메시지 기록..." autocomplete="off">
                <button id="saveBtn">SEND</button>
            </div>
        </div>

        <div class="msg-list" id="msgList">
            <p style="text-align:center; padding-top:100px; color:#333; letter-spacing: 2px;">SYNCING UNIVERSE...</p>
        </div>

        <div class="back-btn" onclick="Universe.navigateTo('MENU')">[ RETURN TO TOWER ]</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast, remove } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        function setVh() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        window.addEventListener('resize', setVh);
        setVh();

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const guestbookRef = ref(db, 'guestbook');

        const ADMIN_EMAIL = "joar6563@naver.com";
        let isAdminNow = false;

        // 관리자 확인 후 즉시 리스트 로드
        onAuthStateChanged(auth, (user) => {
            isAdminNow = (user && user.email === ADMIN_EMAIL);
            loadMessages(); 
        });

        const currentUser = (typeof Universe !== 'undefined' && Universe.getUser) ? Universe.getUser() : "VISITOR";
        document.getElementById('displayUser').innerText = currentUser;
        document.getElementById('nameInput').value = currentUser;

        window.saveMessage = function() {
            const nameInput = document.getElementById('nameInput');
            const msgInput = document.getElementById('msgInput');
            const name = nameInput.value.trim();
            const msg = msgInput.value.trim();
            if (!name || !msg) return;
            push(guestbookRef, { name: name, message: msg, timestamp: Date.now() })
            .then(() => { msgInput.value = ''; msgInput.focus(); });
        };

        window.deleteMsg = function(key) {
            if (!isAdminNow) return;
            if (confirm("정말 삭제하시겠습니까?")) {
                remove(ref(db, `guestbook/${key}`)).catch(err => alert("삭제 실패: " + err));
            }
        };

        document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') saveMessage(); });
        document.getElementById('saveBtn').onclick = saveMessage;

        function loadMessages() {
            const q = query(guestbookRef, orderByChild('timestamp'), limitToLast(50));
            onValue(q, (snapshot) => {
                const list = document.getElementById('msgList');
                list.innerHTML = '';
                const data = snapshot.val();
                if (data) {
                    const sortedKeys = Object.keys(data).sort((a, b) => data[b].timestamp - data[a].timestamp);
                    sortedKeys.forEach((key) => {
                        const item = data[key];
                        const div = document.createElement('div');
                        div.className = 'msg-item';
                        
                        // 관리자 권한 확인 로그 (디버깅용으로 남겨두셔도 됩니다)
                        const deleteBtnHtml = isAdminNow ? `<div class="del-btn" onclick="deleteMsg('${key}')">✕</div>` : '';
                        
                        div.innerHTML = `
                            <span class="user-name">${item.name || "VISITOR"}</span>
                            <div class="user-text">${item.message}</div>
                            ${deleteBtnHtml}
                        `;
                        list.appendChild(div);
                    });
                } else {
                    list.innerHTML = "<p style='text-align:center; padding-top:100px; color:#222; font-size:12px;'>NO MESSAGES</p>";
                }
            });
        }
    </script>
</body>
</html>
