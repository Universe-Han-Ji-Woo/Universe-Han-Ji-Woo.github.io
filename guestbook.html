<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universe | Guest Book</title>
    <script src="config.js"></script>
    <style>
        :root {
            --main-red: #ff2d55;
            --bg-dark: #050a10;
            --box-bg: rgba(255, 255, 255, 0.03);
            --border-light: rgba(255, 255, 255, 0.08);
            --vh: 1vh;
        }
        html, body { background: var(--bg-dark); color: #fff; font-family: 'Apple SD Gothic Neo', sans-serif; margin: 0; padding: 0; overflow: hidden !important; height: calc(var(--vh, 1vh) * 100); }
        body { display: flex; justify-content: center; align-items: flex-start; }
        .container { width: 100%; max-width: 600px; height: 100%; display: flex; flex-direction: column; padding: 20px; box-sizing: border-box; position: relative; }
        h2 { text-align: center; font-size: 1.8rem; letter-spacing: 5px; font-weight: 900; margin: 15px 0 5px 0; text-shadow: 0 0 20px rgba(255, 45, 85, 0.3); }
        .user-info { text-align: center; font-size: 0.75rem; color: #8ea8c9; margin-bottom: 10px; }
        .input-area { display: flex; flex-direction: column; gap: 10px; background: var(--box-bg); padding: 12px; border-radius: 18px; border: 1px solid var(--border-light); margin-bottom: 15px; flex-shrink: 0; }
        .input-row { display: flex; gap: 8px; }
        input { padding: 12px; border-radius: 12px; border: none; background: rgba(255,255,255,0.08); color: white; outline: none; font-size: 16px; }
        #nameInput { width: 80px; flex-shrink: 0; }
        #msgInput { flex: 1; min-width: 0; }
        button#saveBtn { padding: 0 15px; background: var(--main-red); border: none; border-radius: 12px; cursor: pointer; font-weight: bold; color: #fff; }

        /* 스크롤바 완전 제거 및 리스트 스타일 */
        .msg-list { flex: 1; overflow-y: auto; padding-right: 5px; -webkit-overflow-scrolling: touch; }
        .msg-list::-webkit-scrollbar { display: none; }
        .msg-item { background: var(--box-bg); margin-bottom: 12px; padding: 15px; border-radius: 16px; border: 1px solid var(--border-light); border-left: 3px solid var(--main-red); position: relative; animation: slideUp 0.4s ease-out forwards; }
        .user-name { display: block; color: var(--main-red); font-weight: 900; font-size: 0.7rem; margin-bottom: 4px; }
        .user-text { font-size: 0.9rem; line-height: 1.5; color: #eee; word-break: break-all; padding-right: 35px; }

        /* 삭제 버튼: 강제 노출 설정 */
        .del-btn {
            position: absolute !important;
            top: 10px !important;
            right: 10px !important;
            width: 26px !important;
            height: 26px !important;
            background-color: rgba(255, 45, 85, 0.25) !important;
            border: 1px solid var(--main-red) !important;
            color: var(--main-red) !important;
            border-radius: 6px !important;
            display: flex !important; /* JS 조건 충족 시 flex로 작동 */
            align-items: center !important;
            justify-content: center !important;
            font-size: 12px !important;
            cursor: pointer !important;
            z-index: 100 !important;
        }
        .del-btn:active { background: var(--main-red) !important; color: white !important; }
        .back-btn { text-align: center; padding: 15px 0; color: #444; text-decoration: none; font-size: 0.75rem; cursor: pointer; letter-spacing: 2px; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(15px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <div class="container">
        <h2>GUEST BOOK</h2>
        <p class="user-info">CONNECTED: <span id="displayUser">---</span></p>
        <div class="input-area">
            <div class="input-row">
                <input type="text" id="nameInput" placeholder="닉네임">
                <input type="text" id="msgInput" placeholder="메시지 기록..." autocomplete="off">
                <button id="saveBtn">SEND</button>
            </div>
        </div>
        <div class="msg-list" id="msgList"></div>
        <div class="back-btn" onclick="Universe.navigateTo('MENU')">[ RETURN TO TOWER ]</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast, remove } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";

        // 1. 초기화
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);
        const guestbookRef = ref(db, 'guestbook');

        function setVh() { document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`); }
        window.addEventListener('resize', setVh); setVh();

        // 2. 고유 식별자 설정 (수정된 부분: 더 확실한 ID 생성)
        if (!localStorage.getItem('guest_id')) {
            localStorage.setItem('guest_id', 'id_' + Math.random().toString(36).substr(2, 9));
        }
        const myGuestId = localStorage.getItem('guest_id');

        let isAdminNow = false;
        const ADMIN_EMAIL = "joar6563@naver.com";

        // 3. 관리자 상태 및 리스너 통합 관리
        onAuthStateChanged(auth, (user) => {
            isAdminNow = (user && user.email === ADMIN_EMAIL);
            console.log("Admin Logged In:", isAdminNow);
            renderList(); // 인증 상태 확인 후 목록 다시 그리기
        });

        const currentUser = (typeof Universe !== 'undefined' && Universe.getUser) ? Universe.getUser() : "VISITOR";
        document.getElementById('displayUser').innerText = currentUser;
        document.getElementById('nameInput').value = currentUser;

        // 4. 메시지 저장 (UID 포함 필수)
        window.saveMessage = function() {
            const name = document.getElementById('nameInput').value.trim();
            const msg = document.getElementById('msgInput').value.trim();
            if (!name || !msg) return;
            
            push(guestbookRef, { 
                name: name, 
                message: msg, 
                timestamp: Date.now(),
                uid: myGuestId // 글 작성 시 ID를 명시적으로 저장
            }).then(() => {
                document.getElementById('msgInput').value = '';
            });
        };

        window.deleteMsg = function(key) {
            remove(ref(db, `guestbook/${key}`));
        };

        document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') saveMessage(); });
        document.getElementById('saveBtn').onclick = saveMessage;

        // 5. 렌더링 함수
        function renderList() {
            const q = query(guestbookRef, orderByChild('timestamp'), limitToLast(50));
            onValue(q, (snapshot) => {
                const list = document.getElementById('msgList');
                list.innerHTML = '';
                const data = snapshot.val();
                if (data) {
                    const sortedKeys = Object.keys(data).sort((a, b) => data[b].timestamp - data[a].timestamp);
                    sortedKeys.forEach((key) => {
                        const item = data[key];
                        // 삭제 권한 판단 (관리자이거나 작성 ID가 일치하거나)
                        const canDelete = isAdminNow || (item.uid && item.uid === myGuestId);
                        
                        const div = document.createElement('div');
                        div.className = 'msg-item';
                        div.innerHTML = `
                            <span class="user-name">${item.name || "VISITOR"}</span>
                            <div class="user-text">${item.message}</div>
                            ${canDelete ? `<div class="del-btn" onclick="deleteMsg('${key}')">✕</div>` : ''}
                        `;
                        list.appendChild(div);
                    });
                } else {
                    list.innerHTML = "<p style='text-align:center; padding-top:100px; color:#444;'>NO DATA</p>";
                }
            });
        }
    </script>
</body>
</html>
