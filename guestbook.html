<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universe | Guest Book</title>
    
    <script src="config.js"></script>

    <style>
        :root {
            --main-red: #ff2d55;
            --bg-dark: #050a10;
            --box-bg: rgba(255, 255, 255, 0.03);
            --border-light: rgba(255, 255, 255, 0.08);
            --vh: 1vh;
        }

        body { 
            background: var(--bg-dark); 
            color: #fff; 
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; 
            margin: 0; padding: 0;
            overflow: hidden;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%;
            max-width: 600px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        
        h2 { 
            text-align: center; 
            font-size: clamp(1.2rem, 5vw, 1.8rem);
            letter-spacing: 5px; 
            font-weight: 900;
            margin: 15px 0 5px 0;
            text-shadow: 0 0 20px rgba(255, 45, 85, 0.3);
        }

        .user-info { 
            text-align: center; 
            font-size: 0.75rem; 
            color: #8ea8c9; 
            margin-bottom: 15px;
            opacity: 0.6;
        }

        /* ✍️ 입력 영역 */
        .input-area {
            background: var(--box-bg);
            padding: 15px;
            border-radius: 18px;
            border: 1px solid var(--border-light);
            margin-bottom: 15px;
        }

        .input-row {
            display: flex;
            gap: 8px;
        }

        input { 
            padding: 10px 15px; 
            border-radius: 10px; 
            border: none; 
            background: rgba(255,255,255,0.06); 
            color: white; 
            outline: none;
            font-size: 14px;
        }

        #nameInput { width: 80px; }
        #msgInput { flex: 1; }

        button { 
            padding: 0 15px; 
            background: var(--main-red); 
            border: none; 
            border-radius: 10px; 
            cursor: pointer; 
            font-weight: bold; 
            color: #fff; 
            font-size: 13px;
        }

        /* 📋 게시판 리스트 영역 */
        .board-header {
            display: grid;
            grid-template-columns: 1.5fr 1fr 0.6fr; /* 비율 조정 */
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border-radius: 12px 12px 0 0;
            font-size: 0.8rem;
            color: #888;
            text-align: center;
            border-bottom: 1px solid var(--border-light);
        }

        .msg-list { 
            flex: 1;
            overflow-y: auto; 
            background: rgba(255,255,255,0.02);
            border-radius: 0 0 12px 12px;
            border: 1px solid var(--border-light);
            border-top: none;
        }
        
        .msg-list::-webkit-scrollbar { width: 2px; }
        .msg-list::-webkit-scrollbar-thumb { background: var(--main-red); }

        .msg-item { 
            display: grid;
            grid-template-columns: 1.5fr 1fr 0.6fr;
            padding: 15px 10px;
            border-bottom: 1px solid var(--border-light);
            align-items: center;
            text-align: center;
            transition: 0.3s;
        }

        /* 🚩 공지사항 스타일 (위로 독립) */
        .notice-item {
            background: rgba(255, 45, 85, 0.03);
        }

        .badge-notice {
            display: block; /* 줄바꿈 처리로 제목과 겹침 방지 */
            color: var(--main-red);
            font-size: 0.7rem;
            font-weight: bold;
            margin-bottom: 4px;
        }

        .user-text { 
            font-size: 0.85rem; 
            color: #eee; 
            text-align: left; 
            padding-left: 10px;
            word-break: break-all;
            line-height: 1.4;
        }

        .user-name { font-size: 0.8rem; color: #aaa; }
        .view-count { font-size: 0.8rem; color: #666; }

        .back-btn { text-align: center; padding: 15px 0; color: #444; font-size: 0.75rem; cursor: pointer; letter-spacing: 2px; }

    </style>
</head>
<body>
    <div class="container">
        <h2>GUEST BOOK</h2>
        <p class="user-info">STATION: <span id="displayUser">---</span></p>
        
        <div class="input-area">
            <div class="input-row">
                <input type="text" id="nameInput" placeholder="닉네임" autocomplete="off">
                <input type="text" id="msgInput" placeholder="메시지 기록..." autocomplete="off">
                <button id="saveBtn">SEND</button>
            </div>
        </div>

        <div class="board-header">
            <div>제목</div>
            <div>작성자</div>
            <div>조회수</div>
        </div>

        <div class="msg-list" id="msgList">
            <p style="text-align:center; padding-top:50px; color:#444; font-size:0.8rem;">CONNECTING...</p>
        </div>

        <div class="back-btn" onclick="Universe.navigateTo('MENU')">[ RETURN TO TOWER ]</div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, push, onValue, query, orderByChild, limitToLast } 
        from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        function setVh() {
            document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
        }
        window.addEventListener('resize', setVh);
        setVh();

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const guestbookRef = ref(db, 'guestbook');

        const currentUser = (typeof Universe !== 'undefined' && Universe.getUser) ? Universe.getUser() : "VISITOR";
        document.getElementById('displayUser').innerText = currentUser;
        document.getElementById('nameInput').value = currentUser;

        window.saveMessage = function() {
            const name = document.getElementById('nameInput').value.trim();
            const msg = document.getElementById('msgInput').value.trim();

            if (!name || !msg) return;

            push(guestbookRef, {
                name: name,
                message: msg,
                views: 0, // 조회수 초기값
                timestamp: Date.now(),
                isNotice: false
            }).then(() => {
                document.getElementById('msgInput').value = ''; 
            });
        };

        document.getElementById('msgInput').addEventListener('keypress', (e) => { if (e.key === 'Enter') saveMessage(); });
        document.getElementById('saveBtn').onclick = saveMessage;

        const recentMessagesQuery = query(guestbookRef, orderByChild('timestamp'), limitToLast(50));
        
        onValue(recentMessagesQuery, (snapshot) => {
            const list = document.getElementById('msgList');
            list.innerHTML = '';
            const data = snapshot.val();
            
            if (data) {
                const items = Object.keys(data).map(key => ({...data[key], id: key}));
                items.sort((a, b) => b.timestamp - a.timestamp);
                
                items.forEach((item) => {
                    const div = document.createElement('div');
                    // 공지사항일 경우 전용 클래스 추가
                    div.className = item.isNotice ? 'msg-item notice-item' : 'msg-item';
                    
                    div.innerHTML = `
                        <div class="user-text">
                            ${item.isNotice ? '<span class="badge-notice">공지</span>' : ''}
                            ${item.message}
                        </div>
                        <div class="user-name">${item.name}</div>
                        <div class="view-count">${item.views || 0}</div>
                    `;
                    list.appendChild(div);
                });
            } else {
                list.innerHTML = "<p style='text-align:center; padding-top:50px; color:#222;'>NO DATA</p>";
            }
        });
    </script>
</body>
</html>
