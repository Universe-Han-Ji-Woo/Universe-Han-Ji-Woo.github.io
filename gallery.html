<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universe | Gallery</title>
    
    <script src="config.js"></script>

    <style>
        :root {
            --main-red: #ff2d55;
            --bg-dark: #050a10;
            --box-bg: rgba(255, 255, 255, 0.03);
            --border-light: rgba(255, 255, 255, 0.08);
            --vh: 1vh;
        }

        body { 
            background: var(--bg-dark); 
            color: #fff; 
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            margin: 0; padding: 0;
            overflow: hidden;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%;
            max-width: 800px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        
        h2 { 
            text-align: center; 
            font-size: clamp(1.5rem, 6vw, 2.2rem);
            letter-spacing: 5px; 
            font-weight: 900;
            margin: 20px 0 15px 0;
            text-shadow: 0 0 20px rgba(255, 45, 85, 0.3);
        }

        /* 📸 사진 그리드 영역 */
        .gallery-grid { 
            flex: 1;
            overflow-y: auto; 
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* 모바일 2열 */
            gap: 12px;
            padding-bottom: 30px;
        }

        /* 태블릿/PC 3열 */
        @media (min-width: 600px) {
            .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 20px; }
        }

        .gallery-item { 
            background: var(--box-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-light);
            aspect-ratio: 1 / 1;
            position: relative;
            cursor: pointer;
            transition: 0.3s;
        }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.5s ease;
        }

        .gallery-item:hover img { transform: scale(1.1); }

        .img-info {
            position: absolute;
            bottom: 0; width: 100%;
            padding: 8px;
            background: linear-gradient(transparent, rgba(0,0,0,0.7));
            font-size: 0.65rem;
            color: #ccc;
            text-align: center;
        }

        .gallery-grid::-webkit-scrollbar { width: 4px; }
        .gallery-grid::-webkit-scrollbar-thumb { background: var(--border-light); border-radius: 10px; }

        .back-btn { text-align: center; padding: 20px 0; color: #555; text-decoration: none; font-size: 0.8rem; cursor: pointer; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>GALLERY</h2>
        
        <div class="gallery-grid" id="galleryGrid">
            <div class="gallery-item"><img src="gallery_img/photo1.jpg"><div class="img-info">NEBULA SEED 01</div></div>
            <div class="gallery-item"><img src="gallery_img/photo2.jpg"><div class="img-info">NEBULA SEED 02</div></div>
            <div class="gallery-item"><img src="gallery_img/photo3.jpg"><div class="img-info">NEBULA SEED 03</div></div>
            <div class="gallery-item"><img src="gallery_img/photo4.jpg"><div class="img-info">NEBULA SEED 04</div></div>
            <div class="gallery-item"><img src="gallery_img/photo5.jpg"><div class="img-info">NEBULA SEED 05</div></div>
            <div class="gallery-item"><img src="gallery_img/photo6.jpg"><div class="img-info">NEBULA SEED 06</div></div>
            <div class="gallery-item"><img src="gallery_img/photo7.jpg"><div class="img-info">NEBULA SEED 07</div></div>
            <div class="gallery-item"><img src="gallery_img/photo8.jpg"><div class="img-info">NEBULA SEED 08</div></div>
            <div class="gallery-item"><img src="gallery_img/photo9.jpg"><div class="img-info">NEBULA SEED 09</div></div>
            <div class="gallery-item"><img src="gallery_img/photo10.jpg"><div class="img-info">NEBULA SEED 10</div></div>
            </div>

        <div class="back-btn" onclick="Universe.navigateTo('MENU')">[ RETURN TO TOWER ]</div>
    </div>

    <script>
        // 기기별 높이 대응
        function setVh() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        window.addEventListener('resize', setVh);
        setVh();
    </script>
</body>
</html>
