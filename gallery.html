<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe | Galaxy Gallery</title>
    <style>
        /* 기존 스타일 유지 (생략 가능하지만 전체 코드로 제공합니다) */
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #050a10; color: #fff;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow-x: hidden;
        }

        .gallery-bg {
            position: fixed; width: 100%; height: 100%;
            background: radial-gradient(circle at 20% 30%, #1a1a2e 0%, #050a10 70%),
                        radial-gradient(circle at 80% 70%, #16213e 0%, #050a10 70%);
            z-index: -1;
        }

        .header {
            padding: 40px; text-align: center;
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .header h1 { font-family: 'Arial Black', sans-serif; letter-spacing: 10px; margin: 0; font-size: 1.5rem; }
        .header p { color: #8ea8c9; font-size: 0.7rem; margin-top: 8px; letter-spacing: 2px; }

        .back-btn {
            position: fixed; top: 30px; left: 30px;
            padding: 8px 16px; border: 1px solid rgba(255,255,255,0.2);
            border-radius: 20px; cursor: pointer; color: #fff; font-size: 0.7rem;
            background: rgba(0,0,0,0.3); z-index: 100; transition: 0.3s;
        }
        .back-btn:hover { background: #fff; color: #000; box-shadow: 0 0 15px #fff; }

        .nebula-container {
            position: relative; width: 100%; min-height: 80vh;
            padding: 50px; box-sizing: border-box;
            display: flex; flex-wrap: wrap; justify-content: center;
        }

        .photo-star {
            position: relative; width: 250px; 
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 10px; border-radius: 5px;
            margin: 30px;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(2deg); }
        }

        .photo-star img { width: 100%; border-radius: 3px; display: block; filter: grayscale(20%); transition: 0.5s; }

        .photo-star:hover {
            z-index: 50;
            background: rgba(255,255,255,0.15);
            border-color: #fff;
            box-shadow: 0 0 40px rgba(255,255,255,0.4);
            animation-play-state: paused;
            transform: scale(1.1); 
        }
        .photo-star:hover img { filter: grayscale(0%); }

        .photo-caption {
            font-size: 0.7rem; margin-top: 10px; text-align: center;
            color: #8ea8c9; letter-spacing: 1px;
        }
    </style>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const user = urlParams.get('user');

        function goBack() {
            location.href = `menu.html?user=${encodeURIComponent(user)}`;
        }

        window.onload = () => {
            if (!user) { location.href = "index.html"; }
        };
    </script>
</head>
<body>
    <div class="gallery-bg"></div>
    <div class="back-btn" onclick="goBack()">← HUB로 복귀</div>

    <div class="header">
        <h1>GALAXY GALLERY</h1>
        <p>성운 속에 흩어진 찬란한 순간들</p>
    </div>

    <div class="nebula-container">
        <div class="photo-star">
            <img src="gallery_img/photo1.jpg" alt="지우 배우님">
            <div class="photo-caption">NEBULA SEED 01</div>
        </div>

        <div class="photo-star">
            <img src="gallery_img/photo2.jpg" alt="지우 배우님">
            <div class="photo-caption">NEBULA SEED 02</div>
        </div>

        </div>
</body>
</html>
