<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universe | Free Floating Gallery</title>
    
    <script src="config.js"></script>

    <style>
        :root {
            --main-red: #ff2d55;
            --bg-dark: #050a10;
            --vh: 1vh;
        }

        body { 
            background: var(--bg-dark); 
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(255, 45, 85, 0.05) 0%, transparent 80%),
                url('https://www.transparenttextures.com/patterns/stardust.png'); /* 미세한 별가루 효과 */
            color: #fff; 
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            margin: 0; padding: 0;
            overflow: hidden; /* 우주는 끝이 없지만 화면 밖으로 넘치지 않게 */
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
        }

        h2 { 
            position: fixed;
            top: 30px; left: 0; width: 100%;
            text-align: center; 
            font-size: clamp(1.5rem, 6vw, 2.2rem);
            letter-spacing: 10px; 
            font-weight: 900;
            text-shadow: 0 0 30px rgba(255, 45, 85, 0.5);
            z-index: 100;
            pointer-events: none; /* 제목이 사진 클릭을 방해하지 않도록 */
        }

        /* 🪐 우주 공간 (사진들이 노닐 곳) */
        #universe-space {
            position: relative;
            width: 100vw;
            height: 100vh;
            perspective: 1000px;
        }

        .gallery-item { 
            position: absolute;
            width: 120px; /* 모바일 기준 적당한 크기 */
            height: 120px;
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.03);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: transform 0.3s ease, border-color 0.3s ease;
            z-index: 10;
        }

        @media (min-width: 768px) {
            .gallery-item { width: 180px; height: 180px; }
        }

        .gallery-item img {
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.8;
            transition: 0.5s;
        }

        .gallery-item:hover {
            border-color: var(--main-red);
            z-index: 50;
        }
        .gallery-item:hover img {
            opacity: 1;
            transform: scale(1.1);
        }

        /* 🔍 클릭 확대 모달 */
        #photoModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none; justify-content: center; align-items: center;
            z-index: 2000; backdrop-filter: blur(15px);
        }
        #modalImg {
            max-width: 90%; max-height: 85%; border-radius: 10px;
            transform: scale(0.8); transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        #photoModal.active { display: flex; }
        #photoModal.active #modalImg { transform: scale(1); }

        .back-btn { 
            position: fixed; bottom: 30px; left: 0; width: 100%;
            text-align: center; color: #444; font-size: 0.8rem; 
            cursor: pointer; letter-spacing: 3px; z-index: 100;
        }
    </style>
</head>
<body>

    <h2>GALLERY</h2>
    
    <div id="universe-space">
        </div>

    <div class="back-btn" onclick="Universe.navigateTo('MENU')">[ RETURN TO TOWER ]</div>

    <div id="photoModal" onclick="closeModal()">
        <img id="modalImg" src="">
    </div>

    <script>
        function setVh() {
            document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
        }
        window.addEventListener('resize', setVh);
        setVh();

        const totalPhotos = 21;
        const space = document.getElementById('universe-space');

        for (let i = 1; i <= totalPhotos; i++) {
            const item = document.createElement('div');
            item.className = 'gallery-item';
            
            // 1. 랜덤 위치 계산 (너무 가장자리에 치우치지 않게)
            const posX = Math.random() * 70 + 5; // 5% ~ 75% 사이
            const posY = Math.random() * 70 + 10; // 10% ~ 80% 사이
            
            // 2. 랜덤 애니메이션 설정
            const duration = Math.random() * 5 + 5; // 5초 ~ 10초 사이 속도
            const delay = Math.random() * -10; // 시작 시점 분산
            const rotate = Math.random() * 20 - 10; // 초기 회전값 (-10deg ~ 10deg)

            item.style.left = `${posX}%`;
            item.style.top = `${posY}%`;
            item.style.transform = `rotate(${rotate}deg)`;
            
            // 개별 유영 애니메이션 부여
            item.animate([
                { transform: `translate(0, 0) rotate(${rotate}deg)` },
                { transform: `translate(${Math.random()*40-20}px, ${Math.random()*40-20}px) rotate(${rotate + 5}deg)` },
                { transform: `translate(0, 0) rotate(${rotate}deg)` }
            ], {
                duration: duration * 1000,
                iterations: Infinity,
                easing: 'ease-in-out',
                delay: delay * 1000
            });

            item.onclick = function() { openModal(this); };
            
            const img = document.createElement('img');
            img.src = `gallery_img/photo${i}.jpg`;
            
            img.onerror = function() {
                item.style.display = 'none';
            };

            item.appendChild(img);
            space.appendChild(item);
        }

        function openModal(el) {
            const modal = document.getElementById('photoModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = el.querySelector('img').src;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('photoModal').classList.remove('active');
        }
    </script>
</body>
</html>
