<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Universe | Gallery</title>
    
    <script src="config.js"></script>

    <style>
        :root {
            --main-red: #ff2d55;
            --bg-dark: #050a10;
            --box-bg: rgba(255, 255, 255, 0.03);
            --border-light: rgba(255, 255, 255, 0.08);
            --vh: 1vh;
        }

        body { 
            background: var(--bg-dark); 
            color: #fff; 
            font-family: 'Apple SD Gothic Neo', sans-serif; 
            margin: 0; padding: 0;
            overflow: hidden;
            height: 100vh;
            height: calc(var(--vh, 1vh) * 100);
            display: flex;
            justify-content: center;
        }

        .container { 
            width: 100%;
            max-width: 800px;
            height: 100%;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
        }
        
        h2 { 
            text-align: center; 
            font-size: clamp(1.5rem, 6vw, 2.2rem);
            letter-spacing: 5px; 
            font-weight: 900;
            margin: 20px 0 15px 0;
            text-shadow: 0 0 20px rgba(255, 45, 85, 0.3);
            z-index: 10;
        }

        .gallery-grid { 
            flex: 1;
            overflow-y: auto; 
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 25px;
            padding: 30px 15px 100px 15px;
        }

        @media (min-width: 600px) {
            .gallery-grid { grid-template-columns: repeat(3, 1fr); gap: 40px; }
        }

        /* 🪐 독립 유영 애니메이션 */
        .gallery-item { 
            background: var(--box-bg);
            border-radius: 15px;
            overflow: hidden;
            border: 1px solid var(--border-light);
            aspect-ratio: 1 / 1;
            position: relative;
            cursor: pointer;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            animation: floatIndividual 6s ease-in-out infinite;
        }

        .gallery-item:nth-child(3n) { animation-duration: 7s; animation-delay: -1s; }
        .gallery-item:nth-child(3n+1) { animation-duration: 5s; animation-delay: -2s; }
        .gallery-item:nth-child(3n+2) { animation-duration: 8s; animation-delay: -3s; }

        .gallery-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: 0.4s ease;
        }

        .gallery-item:hover { border-color: var(--main-red); z-index: 5; }
        .gallery-item:hover img { transform: scale(1.1); }

        @keyframes floatIndividual {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
        }

        /* 🔍 클릭 확대 모달 */
        #photoModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(10px);
        }

        #modalImg {
            max-width: 90%;
            max-height: 80%;
            border-radius: 10px;
            transform: scale(0.8);
            transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #photoModal.active { display: flex; }
        #photoModal.active #modalImg { transform: scale(1); }

        .back-btn { text-align: center; padding: 20px 0; color: #555; text-decoration: none; font-size: 0.8rem; cursor: pointer; letter-spacing: 2px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>GALLERY</h2>
        
        <div class="gallery-grid">
            <div class="gallery-item" onclick="openModal(this)"><img src="gallery_img/photo1.jpg"></div>
            <div class="gallery-item" onclick="openModal(this)"><img src="gallery_img/photo2.jpg"></div>
            <div class="gallery-item" onclick="openModal(this)"><img src="gallery_img/photo3.jpg"></div>
            <div class="gallery-item" onclick="openModal(this)"><img src="gallery_img/photo4.jpg"></div>
            <div class="gallery-item" onclick="openModal(this)"><img src="gallery_img/photo5.jpg"></div>
            <div class="gallery-item" onclick="openModal(this)"><img src="gallery_img/photo6.jpg"></div>
            <div class="gallery-item" onclick="openModal(this)"><img src="gallery_img/photo7.jpg"></div>
            <div class="gallery-item" onclick="openModal(this)"><img src="gallery_img/photo8.jpg"></div>
            <div class="gallery-item" onclick="openModal(this)"><img src="gallery_img/photo9.jpg"></div>
            <div class="gallery-item" onclick="openModal(this)"><img src="gallery_img/photo10.jpg"></div>
        </div>

        <div class="back-btn" onclick="Universe.navigateTo('MENU')">[ RETURN TO TOWER ]</div>
    </div>

    <div id="photoModal" onclick="closeModal()">
        <img id="modalImg" src="">
    </div>

    <script>
        // 화면 높이 설정
        function setVh() {
            document.documentElement.style.setProperty('--vh', `${window.innerHeight * 0.01}px`);
        }
        window.addEventListener('resize', setVh);
        setVh();

        // 사진 확대/축소
        function openModal(el) {
            const modal = document.getElementById('photoModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = el.querySelector('img').src;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('photoModal').classList.remove('active');
        }
    </script>
</body>
</html>
