<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* 1. 배경색을 사진의 배경과 똑같은 색으로 맞춥니다 */
            background: #eef2f6; 
            min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            font-family: 'Apple SD Gothic Neo', sans-serif;
        }

        .profile-stage {
            margin-top: 50px;
            margin-bottom: 30px;
        }

        .main-image-container {
            width: 300px;
            height: 300px;
            /* 2. 테두리(Border)와 그림자(Shadow)를 완전히 제거합니다 */
            border: none;
            box-shadow: none;
            border-radius: 50%;
            overflow: hidden;
            background: transparent; /* 배경을 투명하게 */
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 3. 혹시나 남을지 모를 미세한 테두리 잔상을 가려줍니다 */
            border: none; 
        }

        .main-title {
            font-size: 2rem; font-weight: 200; color: #8ea8c9;
            letter-spacing: 10px; margin-bottom: 30px;
            text-transform: uppercase; text-align: center;
        }

        .bgm-player { text-align: center; margin-bottom: 40px; }
        .enter-btn { 
            text-decoration: none; width: 200px; height: 65px; 
            background: #eef2f6; border-radius: 40px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; color: #8ea8c9; letter-spacing: 5px;
            /* 버튼은 눌리는 느낌을 위해 최소한의 그림자만 남겼습니다 */
            box-shadow: 10px 10px 20px #d1d9e6, -10px -10px 20px #ffffff; 
        }
    </style>
</head>
<body>
    
    <div class="profile-stage">
        <div class="main-image-container">
            <img src="jiwoo_profile.png" alt="한지우" class="main-image">
        </div>
    </div>

    <h1 class="main-title">UNIVERSE<br><span style="font-size: 1rem; letter-spacing: 6px;">HAN JI WOO</span></h1>

    <div class="bgm-player">
        <iframe width="280" height="157" src="https://www.youtube.com/embed/RuRT3B4u5bk" frameborder="0" style="border-radius: 20px;"></iframe>
    </div>
    
    <a href="menu.html" class="enter-btn">ENTER</a>

</body>
</html>
