<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* ✨ 배경: 깨끗한 아이스 화이트에 미세한 그레인(먼지) 효과 */
            background: #f4f7f9; 
            min-height: 100vh;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        /* 🎬 효과 1: 배경에 흐르는 디지털 데이터 (데이터 스트림) */
        body::after {
            content: "0103 0718 1125 0311 ARCHIVE_SYSTEM_LOADING...";
            position: absolute; top: 5%; left: 0; width: 100%;
            font-size: 0.8rem; color: rgba(142, 168, 201, 0.3);
            letter-spacing: 15px; text-align: center;
            animation: dataScroll 10s infinite linear;
        }

        @keyframes dataScroll {
            from { transform: translateX(50%); }
            to { transform: translateX(-50%); }
        }

        .archive-wrapper {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex; align-items: center;
        }

        /* 🎬 비주얼: 중앙에 배치하되 '타겟 포커스' 프레임을 씌움 */
        .photo-target-box {
            position: absolute;
            right: 8%;
            width: 800px;
            z-index: 5;
            padding: 20px;
            /* ✨ 효과 2: 사진 모서리에 'ㄴ, ㄱ' 모양의 사이버틱한 프레임 */
            border-right: 2px solid #8ea8c9;
            border-bottom: 2px solid #8ea8c9;
        }

        .main-img {
            width: 100%; height: auto; display: block;
            filter: contrast(1.1) brightness(1.05);
            /* ✨ 얼굴 보존: 사진은 선명하게, 아래쪽만 살짝 날림 */
            -webkit-mask-image: linear-gradient(to bottom, black 85%, transparent 100%);
            animation: focusPulse 4s infinite ease-in-out;
        }

        @keyframes focusPulse {
            0%, 100% { opacity: 0.9; transform: scale(1); }
            50% { opacity: 1; transform: scale(1.01); }
        }

        /* ✍️ 타이포그래피: 좌측에 수직으로 꽉 차게 */
        .text-side-info {
            position: relative;
            z-index: 10;
            margin-left: 5%;
        }

        .vertical-number {
            position: absolute;
            top: -150px; left: -20px;
            font-size: 20rem; color: rgba(142, 168, 201, 0.07);
            z-index: -1;
        }

        .main-bold-txt {
            font-size: 13rem; font-weight: 900; color: #1a1a1a;
            letter-spacing: -10px; line-height: 0.8;
            text-transform: uppercase; margin: 0;
            /* ✨ 효과 3: 텍스트에 미세한 가로줄 노이즈 삽입 */
            background: linear-gradient(transparent 50%, rgba(142, 168, 201, 0.1) 50%);
            background-size: 100% 4px;
        }

        .sub-desc-label {
            font-size: 4rem; font-weight: 900; color: #8ea8c9;
            letter-spacing: 12px; text-transform: uppercase;
            margin-top: 10px;
            display: flex; align-items: center;
        }

        .sub-desc-label::before {
            content: ""; width: 80px; height: 10px; background: #1a1a1a; margin-right: 20px;
        }
        
        .enter-btn-archive { 
            display: flex;
            text-decoration: none; width: 450px; height: 70px; 
            background: #1a1a1a; color: #fff;
            align-items: center; justify-content: center; 
            font-weight: 900; font-size: 1.2rem; letter-spacing: 10px;
            margin-top: 100px; transition: 0.3s;
            position: relative;
        }
        
        .enter-btn-archive:hover { 
            background: #8ea8c9;
            transform: translateX(20px);
        }

        .enter-btn-archive::after {
            content: ">>"; position: absolute; right: 30px;
        }

        @media (max-width: 1200px) {
            .main-bold-txt { font-size: 7rem; }
            .sub-desc-label { font-size: 2rem; }
            .photo-target-box { width: 100%; opacity: 0.4; }
        }
    </style>
</head>
<body>
    
    <div class="archive-wrapper">
        <div class="text-side-info">
            <span class="vertical-number">02</span>
            <h1 class="main-bold-txt">SYSTEM<br>CORE</h1>
            <h2 class="sub-desc-label">HAN JI WOO</h2>
            <a href="menu.html" class="enter-btn-archive">BOOT ARCHIVE</a>
        </div>

        <div class="photo-target-box">
            <img src="jiwoo_profile2.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
