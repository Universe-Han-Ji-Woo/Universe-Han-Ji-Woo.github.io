<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* ✨ 배경색: 청량함의 끝판왕, 에어리 블루 */
            background: #f0f7ff; 
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .sky-wrapper {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        /* 🎬 비주얼 영역: 부드럽게 떠다니는 모션 */
        .floating-visual {
            position: absolute;
            right: -2%;
            bottom: -5%;
            width: 850px;
            z-index: 2;
            animation: gentleFloat 6s infinite alternate ease-in-out;
            
            /* ✨ 화이트/블루 배경에 녹아드는 부드러운 마스크 */
            -webkit-mask-image: radial-gradient(circle at bottom right, black 20%, transparent 90%);
            mask-image: radial-gradient(circle at bottom right, black 20%, transparent 90%);
        }

        .main-img {
            width: 100%;
            height: auto;
            opacity: 0.9;
            filter: saturate(1.2) contrast(1.05) brightness(1.05);
        }

        /* ✨ 효과 1: 사진 위를 지나가는 몽환적인 비눗방울(Bubble) 파티클 */
        .bubble-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 3;
        }

        .bubble-overlay::after {
            content: '';
            position: absolute;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, transparent 10%);
            background-size: 150px 150px;
            animation: bubbleMove 15s infinite linear;
            opacity: 0.6;
        }

        @keyframes gentleFloat {
            from { transform: translateY(0) rotate(0deg); }
            to { transform: translateY(-30px) rotate(1deg); }
        }

        @keyframes bubbleMove {
            from { transform: translate(-10%, -10%); }
            to { transform: translate(10%, 10%); }
        }

        /* ✍️ 타이포그래피: 좌측에 압도적 크기 + 부드러운 그림자 */
        .text-island {
            position: relative;
            z-index: 10;
            margin-left: 6%;
        }

        .huge-soft-text {
            font-size: 11rem; font-weight: 900; 
            color: #ffffff;
            /* ✨ 화이트 배경에서 글자를 돋보이게 하는 파스텔 그림자 */
            text-shadow: 20px 20px 0px rgba(142, 168, 201, 0.15);
            letter-spacing: -5px; line-height: 0.85;
            text-transform: uppercase; margin: 0;
        }

        .sub-caption {
            font-size: 3.5rem; font-weight: 200; color: #8ea8c9;
            letter-spacing: 20px; text-transform: uppercase;
            margin-top: -10px;
            animation: slideIn 1.5s ease-out;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        .enter-btn-sky { 
            display: inline-flex;
            text-decoration: none; width: 300px; height: 65px; 
            background: #ffffff;
            border-radius: 50px; /* 둥근 버튼으로 청량함 강조 */
            align-items: center; justify-content: center; 
            font-weight: 800; color: #8ea8c9; letter-spacing: 8px;
            margin-top: 80px; transition: 0.5s;
            box-shadow: 0 15px 35px rgba(142, 168, 201, 0.2);
        }
        
        .enter-btn-sky:hover { 
            background: #8ea8c9; color: #ffffff; 
            transform: scale(1.05);
            box-shadow: 0 20px 50px rgba(142, 168, 201, 0.4);
        }

        @media (max-width: 1200px) {
            .huge-soft-text { font-size: 6rem; }
            .sub-caption { font-size: 2rem; letter-spacing: 12px; }
            .floating-visual { width: 550px; }
        }
    </style>
</head>
<body>
    
    <div class="sky-wrapper">
        <div class="text-island">
            <h1 class="huge-soft-text">PURE<br>AZURE</h1>
            <h2 class="sub-caption">HAN JI WOO</h2>
            <a href="menu.html" class="enter-btn-sky">LET'S GO</a>
        </div>

        <div class="floating-visual">
            <div class="bubble-overlay"></div>
            <img src="jiwoo_profile.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
