<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universe | 배우 한지우 팬페이지</title>
    
    <script src="config.js"></script>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCD0OaaN1E5uT950X5hkzCBdqT87JQRXrg",
            authDomain: "jiwoo-fanpage.firebaseapp.com",
            databaseURL: "https://jiwoo-fanpage-default-rtdb.firebaseio.com", 
            projectId: "jiwoo-fanpage",
            storageBucket: "jiwoo-fanpage.firebasestorage.app",
            messagingSenderId: "928634858988",
            appId: "1:928634858988:web:34ae1adf6bab3ad654e4c9"
        };
        firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.database();

        function trackOnlineUsers() {
            const connectedRef = db.ref(".info/connected");
            const onlineRef = db.ref("online_users").push();
            connectedRef.on("value", (snap) => {
                if (snap.val() === true) {
                    onlineRef.set(true);
                    onlineRef.onDisconnect().remove();
                }
            });
            db.ref("online_users").on("value", (snap) => {
                const count = snap.numChildren() || 0;
                document.getElementById('onlineCount').innerText = `${count}명 실시간 탐사 중`;
            });
        }

        function updateTotalFans() {
            db.ref('total_fan_count').on('value', (snapshot) => {
                const count = snapshot.val() || 0;
                document.getElementById('userCount').innerText = `${count.toLocaleString()}명 지우 유니버스 입성`;
            });
        }

        function setupEnterKey() {
            const loginInputs = ['lEmail', 'lPw'];
            loginInputs.forEach(id => {
                document.getElementById(id).addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') handleLogin();
                });
            });

            const signupInputs = ['sEmail', 'sPw'];
            signupInputs.forEach(id => {
                document.getElementById(id).addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') handleSignup();
                });
            });
        }

        window.onload = () => {
            trackOnlineUsers();
            updateTotalFans();
            setupEnterKey();
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            if(user) document.getElementById('nickBadge').innerText = user;
        };

        // 🎯 [핵심 수정] UniverseNav 시스템 적용
        function handleLogin() {
            const email = document.getElementById('lEmail').value;
            const pw = document.getElementById('lPw').value;

            // 관리자 로그인
            if (email === "joar6563@naver.com" && pw === "jqhty836ud@%") {
                alert("관리자님, 유니버스 컨트롤 타워로 이동합니다!");
                UniverseNav.replaceToMenu("관리자");
                return;
            }

            // 일반 회원 로그인
            auth.signInWithEmailAndPassword(email, pw).then((userCredential) => {
                const userEmail = userCredential.user.email.split('@')[0];
                alert("지우 유니버스에 오신 것을 환영합니다!");
                
                // 🎯 config.js에 정의된 함수를 사용하여 메뉴로 이동
                UniverseNav.replaceToMenu(userEmail);
            }).catch(() => alert("가입 정보가 없거나 비밀번호가 틀렸습니다."));
        }

        function handleSignup() {
            const email = document.getElementById('sEmail').value;
            const pw = document.getElementById('sPw').value;
            auth.createUserWithEmailAndPassword(email, pw).then(() => {
                db.ref('total_fan_count').transaction((currentCount) => (currentCount || 0) + 1);
                alert("입성을 환영합니다! 로그인을 진행해 주세요."); 
                location.reload();
            }).catch((err) => alert(err.message));
        }

        function openAuth() { 
            const modal = document.getElementById('authModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }
        function closeAuth() { 
            const modal = document.getElementById('authModal');
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 400); 
        }
    </script>

    <style>
        body { 
            margin: 0; padding: 0; background: #ffffff; height: 100vh; 
            font-family: 'Apple SD Gothic Neo', sans-serif; overflow: hidden; 
        }
        .liquid-bg { 
            position: absolute; width: 100%; height: 100%; 
            background: radial-gradient(circle at 50% 50%, rgba(142, 168, 204, 0.15) 0%, #ffffff 85%); 
            z-index: 1; 
        }
        .main-container { 
            position: relative; width: 100%; height: 100vh; 
            display: flex; flex-direction: column; align-items: center; z-index: 10; 
        }
        .header-text { padding-top: 8vh; text-align: center; }
        .univ-title { 
            font-family: 'Arial Black', sans-serif; font-size: clamp(2.5rem, 10vw, 3.8rem); 
            font-weight: 900; color: #1a1a1a; line-height: 0.95; 
            letter-spacing: -2px; text-transform: uppercase; margin: 0; 
        }
        .coming-soon-label { 
            font-size: clamp(0.9rem, 4vw, 1.2rem); 
            color: #ff2d55; letter-spacing: 5px; margin-top: 15px; font-weight: 900; 
        }
        .hero-photo-zone { 
            flex: 1; display: flex; justify-content: center; align-items: center; 
            overflow: hidden; width: 100%;
        }
        .main-img { 
            max-height: 75vh; width: auto; max-width: 90%; 
            object-fit: contain;
            animation: softPulse 6s infinite alternate ease-in-out; 
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%); 
        }
        .footer-btn-zone { height: 15vh; width: 100%; display: flex; justify-content: center; align-items: center; }
        .btn-stay { 
            cursor: pointer; border: none; width: 85%; max-width: 320px; height: 60px; 
            background: #1a1a1a; color: #fff; font-weight: 900; letter-spacing: 5px; 
            border-radius: 30px; text-transform: uppercase; transition: 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }
        .btn-stay:hover { transform: translateY(-3px); background: #000; box-shadow: 0 15px 30px rgba(0,0,0,0.2); }

        #statusZone { 
            position: fixed; right: 25px; top: 25px; 
            display: flex; flex-direction: column; align-items: flex-end; z-index: 100;
        }
        .nick-box { font-size: 0.65rem; border: 1px solid #1a1a1a; padding: 3px 8px; font-weight: bold; background: #fff; margin-bottom: 6px; }
        .status-msg { font-size: 0.8rem; font-weight: bold; color: #1a1a1a; margin-bottom: 4px; border-bottom: 2px solid #ff2d55; }
        .count-info { font-size: 0.7rem; color: #888; text-align: right; line-height: 1.5; }

        @media screen and (max-width: 600px) {
            #statusZone { right: 15px; top: 15px; }
            .main-img { max-height: 60vh; }
            .btn-stay { height: 55px; font-size: 0.9rem; }
            .univ-title { line-height: 1.1; }
        }

        .modal-overlay { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.7); backdrop-filter: blur(20px); 
            display: none; align-items: center; justify-content: center; z-index: 500; 
            opacity: 0; transition: 0.4s; 
        }
        .modal-overlay.active { opacity: 1; }
        .auth-card { 
            width: 90%; max-width: 400px; padding: 40px 20px; 
            background: #fff; border-radius: 30px; text-align: center; 
            box-shadow: 0 30px 60px rgba(0,0,0,0.15); border: 1px solid #eee;
        }
        .auth-input { 
            width: 100%; padding: 15px; margin-bottom: 12px; 
            border: 1px solid #eee; border-radius: 12px; font-size: 1rem; 
            box-sizing: border-box; background: #f9f9f9;
        }
        .btn-submit { 
            width: 100%; padding: 16px; background: #1a1a1a; color: #fff; 
            border: none; border-radius: 12px; font-weight: 900; cursor: pointer; 
        }
        @keyframes softPulse { from { transform: scale(1); } to { transform: scale(1.03); } }
    </style>
</head>
<body>
    <div class="liquid-bg"></div>
    <div class="main-container">
        <div class="header-text">
            <h1 class="univ-title">UNIVERSE<br>ARCHIVE</h1>
            <h2 class="coming-soon-label">OFFICIAL OPEN</h2>
        </div>
        
        <div class="hero-photo-zone">
            <img src="jiwoo_profile3.png" alt="Han Ji Woo" class="main-img">
        </div>
        
        <div class="footer-btn-zone">
            <button class="btn-stay" onclick="openAuth()">ENTER UNIVERSE</button>
        </div>
    </div>

    <div id="statusZone">
        <div class="nick-box" id="nickBadge">VISITOR</div>
        <div class="status-msg">중심 타워 가동 중</div>
        <div class="count-info" id="userCount">연결 중...</div>
        <div class="count-info" id="onlineCount">실시간 탐사 준비 중...</div>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="auth-card">
            <div id="loginBox">
                <h3 style="letter-spacing: 3px; margin-bottom: 25px;">LOGIN</h3>
                <input type="email" id="lEmail" class="auth-input" placeholder="이메일 주소">
                <input type="password" id="lPw" class="auth-input" placeholder="비밀번호">
                <button class="btn-submit" onclick="handleLogin()">유니버스 접속</button>
                <p style="margin-top:25px; font-size:0.85rem; color:#666;">
                    처음이신가요? <span onclick="document.getElementById('loginBox').style.display='none'; document.getElementById('signBox').style.display='block';" style="color:#ff2d55; cursor:pointer; font-weight:bold; text-decoration: underline;">멤버십 가입</span>
                </p>
            </div>
            
            <div id="signBox" style="display:none;">
                <h3 style="letter-spacing: 3px; margin-bottom: 25px;">JOIN US</h3>
                <input type="email" id="sEmail" class="auth-input" placeholder="이메일 주소">
                <input type="password" id="sPw" class="auth-input" placeholder="비밀번호">
                <button class="btn-submit" onclick="handleSignup()">멤버십 승인</button>
                <p style="margin-top:25px; font-size:0.85rem; color:#666;">
                    이미 계정이 있나요? <span onclick="document.getElementById('loginBox').style.display='block'; document.getElementById('signBox').style.display='none';" style="color:#ff2d55; cursor:pointer; font-weight:bold; text-decoration: underline;">로그인으로 이동</span>
                </p>
            </div>
            
            <button style="margin-top:25px; border:none; background:none; cursor:pointer; color:#bbb; font-size: 0.8rem;" onclick="closeAuth()">[ 닫기 ]</button>
        </div>
    </div>
</body>
</html>
