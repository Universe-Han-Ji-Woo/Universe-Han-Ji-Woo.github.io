<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #eef2f6; 
            min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            font-family: 'Apple SD Gothic Neo', sans-serif;
        }

        /* 🎬 사진과 안개를 하나로 묶는 무대 */
        .stage-box {
            position: relative;
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        /* ✨ 필살기 1: 사진 위쪽을 배경색으로 덮는 안개 */
        .stage-box::before {
            content: '';
            position: absolute;
            top: -5px; left: 0; right: 0;
            height: 120px; /* 안개 두께 */
            background: linear-gradient(to bottom, #eef2f6 15%, transparent 100%);
            z-index: 5;
            pointer-events: none;
        }

        /* ✨ 필살기 2: 사진 아래쪽을 배경색으로 덮는 안개 */
        .stage-box::after {
            content: '';
            position: absolute;
            bottom: -5px; left: 0; right: 0;
            height: 120px;
            background: linear-gradient(to top, #eef2f6 15%, transparent 100%);
            z-index: 5;
            pointer-events: none;
        }

        .main-image {
            width: 550px; /* 쫌좀님 맞춤 PC 크기 */
            height: auto;
            display: block;
            position: relative;
            z-index: 1; /* 안개보다 아래에 배치 */
            
            /* 사진 자체의 경계선도 1차로 흐릿하게 깎아줍니다 */
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        .main-title {
            font-size: 2.2rem; font-weight: 200; color: #8ea8c9;
            letter-spacing: 12px; margin-top: 40px;
            text-transform: uppercase; text-align: center;
        }
        
        .enter-btn { 
            text-decoration: none; width: 220px; height: 75px; 
            background: white; border-radius: 50px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; color: #8ea8c9; letter-spacing: 5px;
            box-shadow: 15px 15px 30px #d1d9e6, -15px -15px 30px #ffffff; 
            margin-top: 50px; transition: 0.3s;
        }

        @media (max-width: 768px) {
            .main-image { width: 320px; }
            .stage-box::before, .stage-box::after { height: 70px; }
        }
    </style>
</head>
<body>
    
    <div class="stage-box">
        <img src="jiwoo_profile.png" alt="한지우" class="main-image">
    </div>

    <h1 class="main-title">UNIVERSE<br><span style="font-size: 1rem; letter-spacing: 8px; font-weight: 600;">HAN JI WOO</span></h1>

    <a href="menu.html" class="enter-btn">ENTER</a>

</body>
</html>
