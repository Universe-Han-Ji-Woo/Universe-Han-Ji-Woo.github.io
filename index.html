<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; background: #ffffff; 
            height: 100vh; font-family: 'Arial Black', sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* ✨ 효과: 배경 은은한 후광 */
        .liquid-bg {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(142, 168, 201, 0.1) 0%, #ffffff 80%);
            z-index: 1;
        }

        .main-container {
            position: relative; width: 100%; height: 100vh;
            display: flex; flex-direction: column; align-items: center; z-index: 10;
        }

        /* 🎬 1. 상단: 타이포그래피 (깔끔하게 상단 배치) */
        .header-text {
            flex: 0 0 auto; width: 100%; padding-top: 8vh;
            text-align: center; z-index: 30;
        }
        .mega-txt {
            font-size: 4rem; font-weight: 900; color: #1a1a1a;
            line-height: 0.9; letter-spacing: -2px; text-transform: uppercase; margin: 0;
        }
        .sub-txt {
            font-size: 1.2rem; color: #8ea8c9; letter-spacing: 6px;
            margin-top: 10px; text-transform: uppercase;
        }

        /* 🎬 2. 중앙: 배우님 비주얼 (주인공 - 화면 꽉 차게) */
        .hero-photo-zone {
            flex: 1; width: 100%; display: flex; 
            justify-content: center; align-items: center;
            overflow: hidden; z-index: 20;
        }
        .main-img {
            height: 85%; width: auto; /* 배우님 전신/상반신이 프레임에 꽉 차게 */
            object-fit: contain;
            animation: softPulse 6s infinite alternate ease-in-out;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        @keyframes softPulse {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.05); filter: brightness(1.08); }
        }

        /* 🎬 3. 최하단: 버튼 고정 (배우님 발밑 아래) */
        .footer-btn-zone {
            flex: 0 0 auto; width: 100%; height: 12vh;
            display: flex; justify-content: center; align-items: center;
            background: rgba(255,255,255,0.8); backdrop-filter: blur(10px);
            z-index: 40; border-top: 1px solid rgba(0,0,0,0.05);
        }
        .btn-stay {
            text-decoration: none; width: 85%; height: 55px;
            background: #1a1a1a; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; letter-spacing: 10px; font-size: 1rem;
            border-radius: 5px; transition: 0.3s;
        }
        .btn-stay:active { background: #8ea8c9; transform: scale(0.98); }

        /* 💻 PC 레이아웃 (가로 화면) */
        @media (min-width: 1024px) {
            .mega-txt { font-size: 10rem; letter-spacing: -5px; }
            .sub-txt { font-size: 2.5rem; letter-spacing: 15px; }
            .footer-btn-zone { background: transparent; border: none; height: 15vh; }
            .btn-stay { width: 400px; height: 70px; font-size: 1.2rem; }
            .main-img { height: 95%; }
        }
    </style>
</head>
<body>
    
    <div class="liquid-bg"></div>

    <div class="main-container">
        <div class="header-text">
            <h1 class="mega-txt">UNIVERSE<br>ARCHIVE</h1>
            <h2 class="sub-txt">HAN JI WOO</h2>
        </div>

        <div class="hero-photo-zone">
            <img src="jiwoo_profile2.png" alt="주인공 한지우" class="main-img">
        </div>

        <div class="footer-btn-zone">
            <a href="menu.html" class="btn-stay">STAY TUNED</a>
        </div>
    </div>

</body>
</html>
