<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #ffffff; 
            min-height: 100vh;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        /* 🎬 배경: 은은하게 반짝이는 펄 입자 */
        body::before {
            content: "";
            position: absolute;
            width: 100%; height: 100%;
            background: radial-gradient(circle, #f8fbff 0%, #ffffff 100%);
            z-index: 0;
        }

        .crystal-wrapper {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex; align-items: center;
        }

        /* 🎬 비주얼: 배우님 얼굴을 선명하게 지키는 대형 배치 */
        .photo-crystal-box {
            position: absolute;
            right: 0%;
            width: 850px;
            z-index: 5;
            filter: drop-shadow(0 20px 50px rgba(142, 168, 201, 0.2));
        }

        .main-img {
            width: 100%; height: auto; display: block;
            opacity: 0.95;
            /* ✨ 얼굴 보존: 외곽만 안개 처리 */
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 90%);
            animation: crystalFloat 5s infinite alternate ease-in-out;
        }

        /* ✨ 효과 1: 사진 위를 흐르는 투명 유리창 (Glass Pane) */
        .glass-pane {
            position: absolute;
            top: 0; left: 0; width: 200px; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.6), transparent);
            z-index: 10;
            transform: skewX(-25deg);
            animation: glassSweep 6s infinite ease-in-out;
        }

        @keyframes crystalFloat {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-15px) scale(1.02); }
        }

        @keyframes glassSweep {
            0% { left: -50%; opacity: 0; }
            50% { opacity: 1; }
            100% { left: 150%; opacity: 0; }
        }

        /* ✍️ 타이포그래피: 사진과 겹쳐지는 입체적 배치 */
        .text-stack {
            position: relative;
            z-index: 6; /* 사진보다 살짝 위 */
            margin-left: 5%;
        }

        .huge-hollow {
            font-size: 15rem; font-weight: 900; 
            color: transparent;
            -webkit-text-stroke: 2px #8ea8c9;
            letter-spacing: -10px; line-height: 0.8;
            text-transform: uppercase; margin: 0;
            opacity: 0.3;
        }

        .solid-title {
            font-size: 6rem; font-weight: 900; color: #8ea8c9;
            letter-spacing: 20px; text-transform: uppercase;
            margin-top: -50px;
            /* ✨ 효과 2: 글자 뒤에 은은한 블루 네온 광택 */
            text-shadow: 0 0 20px rgba(142, 168, 201, 0.4);
        }
        
        /* 🎬 하단 버튼: 퓨어한 디자인 */
        .enter-btn-pure { 
            display: inline-flex;
            text-decoration: none; width: 350px; height: 2px; 
            background: #8ea8c9; 
            margin-top: 100px;
            position: relative;
            transition: 0.5s ease;
        }
        
        .enter-btn-pure::after {
            content: 'VIEW THE CRYSTAL';
            position: absolute; top: -40px; left: 0;
            color: #8ea8c9; font-size: 0.9rem; letter-spacing: 12px;
            font-weight: 900;
        }

        .enter-btn-pure:hover { 
            height: 15px;
            background: #8ea8c9;
            box-shadow: 0 10px 30px rgba(142, 168, 201, 0.4);
        }

        @media (max-width: 1200px) {
            .huge-hollow { font-size: 8rem; }
            .solid-title { font-size: 3rem; letter-spacing: 10px; }
            .photo-crystal-box { width: 100%; opacity: 0.3; }
        }
    </style>
</head>
<body>
    
    <div class="crystal-wrapper">
        <div class="text-stack">
            <h1 class="huge-hollow">PURE<br>VIBE</h1>
            <h2 class="solid-title">HAN JI WOO</h2>
            <a href="menu.html" class="enter-btn-pure"></a>
        </div>

        <div class="photo-crystal-box">
            <div class="glass-pane"></div>
            <img src="jiwoo_profile2.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
