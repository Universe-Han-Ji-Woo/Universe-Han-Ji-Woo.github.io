<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #0f0f10; /* ✨ 깊이감 있는 에스프레소 블랙 */
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .cinema-wrapper {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        /* 🎬 필름 스테이지: 노이즈와 빛 효과를 위한 메인 프레임 */
        .film-stage {
            position: absolute;
            right: -2%;
            bottom: -5%;
            width: 850px;
            z-index: 1;
            
            /* ✨ 상단과 좌측을 어둠 속으로 녹여버리는 마스크 */
            -webkit-mask-image: radial-gradient(circle at bottom right, black 30%, transparent 90%);
            mask-image: radial-gradient(circle at bottom right, black 30%, transparent 90%);
        }

        .main-img {
            width: 100%;
            height: auto;
            display: block;
            opacity: 0.85;
            filter: contrast(1.1) brightness(1.05) grayscale(0.1);
            /* ✨ 효과 1: 아주 천천히 숨쉬는 듯한 줌 효과 */
            animation: slowBreath 15s infinite alternate ease-in-out;
        }

        /* ✨ 효과 2: 필름 영화 특유의 빛 번짐(Light Leak) 효과 */
        .film-stage::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(120deg, transparent 30%, rgba(255, 200, 150, 0.08) 50%, transparent 70%);
            z-index: 2;
            pointer-events: none;
            mix-blend-mode: screen;
            animation: filmFlare 4s infinite alternate;
        }

        /* ✨ 효과 3: 지직거리는 노이즈 질감 (필름 감성) */
        .grain-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/stardust.png'); /* 노이즈 패턴 */
            opacity: 0.05;
            z-index: 3;
            pointer-events: none;
        }

        @keyframes slowBreath {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }

        @keyframes filmFlare {
            0% { opacity: 0; transform: translateX(-20%) scale(0.8); }
            50% { opacity: 1; }
            100% { opacity: 0; transform: translateX(20%) scale(1.2); }
        }

        /* ✍️ 타이포그래피: 좌측에 큼지막하게 배치 */
        .text-group {
            position: relative;
            z-index: 10;
            margin-left: 8%;
        }

        .huge-title {
            font-size: 11rem; font-weight: 900; color: #ffffff;
            letter-spacing: -8px; line-height: 0.8;
            text-transform: uppercase; margin: 0;
            opacity: 0.1;
        }

        .actor-title {
            font-size: 4rem; font-weight: 100; color: #8ea8c9;
            letter-spacing: 25px; text-transform: uppercase;
            margin-top: -30px;
            text-shadow: 0 0 20px rgba(142, 168, 201, 0.4);
        }
        
        .enter-btn-retro { 
            display: inline-flex;
            text-decoration: none; width: 260px; height: 60px; 
            border: 1px solid rgba(255,255,255,0.3);
            background: transparent;
            align-items: center; justify-content: center; 
            font-weight: 600; color: #ffffff; letter-spacing: 5px;
            margin-top: 80px; transition: 0.4s;
        }
        
        .enter-btn-retro:hover { 
            background: #ffffff; color: #0f0f10; 
            box-shadow: 0 0 40px rgba(255,255,255,0.15);
        }

        @media (max-width: 1200px) {
            .huge-title { font-size: 6rem; }
            .actor-title { font-size: 2.2rem; letter-spacing: 12px; }
            .film-stage { width: 550px; }
        }
    </style>
</head>
<body>
    <div class="grain-overlay"></div>
    
    <div class="cinema-wrapper">
        <div class="text-group">
            <h1 class="huge-title">MEMOIR<br>ARCHIVE</h1>
            <h2 class="actor-title">HAN JI WOO</h2>
            <a href="menu.html" class="enter-btn-retro">VIEW FULL STORY</a>
        </div>

        <div class="film-stage">
            <img src="jiwoo_profile.png" alt="한지우" class="main-img">
        </div>
    </div>
</body>
</html>
