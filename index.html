<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* ✨ 배경색: 깊고 푸른 미드나잇 네이비 */
            background: #0d1117; 
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .spectrum-container {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        /* 🎬 비주얼 스테이지 */
        .visual-stage {
            position: absolute;
            right: -5%;
            width: 950px;
            z-index: 1;
            
            /* ✨ 마스크: 사진의 왼쪽과 상단을 부드러운 안개로 소멸 */
            -webkit-mask-image: radial-gradient(circle at bottom right, black 30%, transparent 85%);
            mask-image: radial-gradient(circle at bottom right, black 30%, transparent 85%);
        }

        .main-img {
            width: 100%;
            height: auto;
            opacity: 0.8;
            filter: contrast(1.1) brightness(1.2) saturate(1.2);
            /* ✨ 효과 1: 아주 천천히 좌우로 흔들리는 팬(Pan) 효과 */
            animation: slowPan 20s infinite alternate ease-in-out;
        }

        /* ✨ 효과 2: 사진 위를 가로지르는 강렬한 무지갯빛 광원 (Light Streak) */
        .light-streak {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(
                110deg,
                transparent 30%,
                rgba(255, 255, 255, 0.2) 45%,
                rgba(142, 168, 201, 0.3) 50%,
                rgba(255, 255, 255, 0.2) 55%,
                transparent 70%
            );
            z-index: 2;
            mix-blend-mode: overlay;
            animation: streakMove 5s infinite ease-in-out;
        }

        @keyframes slowPan {
            from { transform: translateX(-20px) scale(1); }
            to { transform: translateX(20px) scale(1.05); }
        }

        @keyframes streakMove {
            0% { transform: translateX(-100%) skewX(-20deg); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(100%) skewX(-20deg); opacity: 0; }
        }

        /* ✍️ 타이포그래피: 좌측에 시원하게 큼지막하게 배치 */
        .text-layer {
            position: relative;
            z-index: 10;
            margin-left: 6%;
        }

        .huge-title {
            font-size: 14rem; font-weight: 900; color: #ffffff;
            letter-spacing: -10px; line-height: 0.8;
            text-transform: uppercase; margin: 0;
            opacity: 0.03; /* 배경처럼 깔리는 초대형 글자 */
        }

        .main-label {
            position: absolute;
            top: 50%; left: 0;
            transform: translateY(-50%);
        }

        .actor-name {
            font-size: 5rem; font-weight: 100; color: #ffffff;
            letter-spacing: 30px; text-transform: uppercase;
            text-shadow: 0 0 30px rgba(255,255,255,0.3);
        }
