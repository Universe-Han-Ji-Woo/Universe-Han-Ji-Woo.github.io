<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #0a0b10; 
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .archive-wrapper {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex; align-items: center;
        }

        /* 🎬 메인 비주얼: 사진 위치와 크기를 더 대담하게 */
        .photo-master {
            position: absolute;
            right: 2%;
            width: 800px;
            z-index: 5;
            /* ✨ 효과 1: 유리 뒤에 있는 듯한 은은한 글로우 */
            filter: drop-shadow(0 0 30px rgba(142, 168, 201, 0.2));
            animation: mainFloat 5s infinite alternate ease-in-out;
        }

        /* ✨ 효과 2: 사진 뒤를 가로지르는 서브 사진 잔상 (Ghost Image) */
        .photo-ghost {
            position: absolute;
            right: 15%;
            width: 600px;
            opacity: 0.1;
            z-index: 1;
            filter: grayscale(1) blur(5px);
            animation: ghostMove 10s infinite linear;
        }

        .main-img { width: 100%; height: auto; display: block; }

        /* ✨ 효과 3: 사진 위를 훑고 지나가는 투명 유리막 (Glass Scanner) */
        .glass-scanner {
            position: absolute;
            top: 0; left: 0;
            width: 150px; height: 100%;
            background: linear-gradient(
                to right, 
                transparent, 
                rgba(255, 255, 255, 0.15) 50%, 
                transparent
            );
            z-index: 10;
            transform: skewX(-20deg);
            animation: scanPass 4s infinite cubic-bezier(0.4, 0, 0.2, 1);
        }

        @keyframes mainFloat {
            from { transform: translateY(0) scale(1); }
            to { transform: translateY(-20px) scale(1.02); }
        }

        @keyframes ghostMove {
            from { transform: translateX(100px); opacity: 0; }
            50% { opacity: 0.2; }
            to { transform: translateX(-200px); opacity: 0; }
        }

        @keyframes scanPass {
            0% { left: -20%; }
            100% { left: 120%; }
        }

        /* ✍️ 타이포그래피: 사진의 레이어 사이에 끼워넣기 */
        .text-layer-box {
            position: relative;
            z-index: 6; /* 사진보다는 위, 스캐너보다는 아래 */
            margin-left: 8%;
        }

        .giant-outlined {
            font-size: 13rem; font-weight: 900; 
            color: #ffffff;
            letter-spacing: -10px; line-height: 0.8;
            text-transform: uppercase; margin: 0;
            /* ✨ 효과 4: 글자가 아주 미세하게 떨리며 노이즈 발생 */
            text-shadow: 3px 0px 0px rgba(142, 168, 201, 0.5);
        }

        .actor-highlight {
            font-size: 4rem; font-weight: 100; color: #8ea8c9;
            letter-spacing: 20px; text-transform: uppercase;
            margin-top: -20px;
            background: rgba(255,255,255,0.05);
            display: inline-block;
            padding: 5px 20px;
        }
        
        .enter-btn-royal { 
            display: flex;
            text-decoration: none; width: 300px; height: 1px; 
            background: #ffffff;
            margin-top: 100px;
            position: relative;
            transition: 0.5s;
        }
        
        .enter-btn-royal::after {
            content: 'OPEN ARCHIVE';
            position: absolute; top: -40px; left: 0;
            color: #ffffff; font-size: 0.9rem; letter-spacing: 15px;
        }

        .enter-btn-royal:hover { 
            height: 10px;
            box-shadow: 0 0 30px #ffffff;
        }

        @media (max-width: 1200px) {
            .giant-outlined { font-size: 7rem; }
            .actor-highlight { font-size: 2rem; letter-spacing: 10px; }
            .photo-master { width: 500px; }
        }
    </style>
</head>
<body>
    
    <div class="archive-wrapper">
        <div class="text-layer-box">
            <h1 class="giant-outlined">ROYAL<br>MUSE</h1>
            <h2 class="actor-highlight">HAN JI WOO</h2>
            <a href="menu.html" class="enter-btn-royal"></a>
        </div>

        <div class="photo-ghost">
            <img src="jiwoo_profile.png" alt="잔상" class="main-img">
        </div>

        <div class="photo-master">
            <div class="glass-scanner"></div>
            <img src="jiwoo_profile.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
