<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* ✨ 배경색: 차가우면서도 깊이 있는 다크 그레이 무드 */
            background: #2c2e33; 
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .layout-wrapper {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        /* 🎬 사진: 우측에 아주 크게, 그리고 몽환적으로 */
        .visual-photo {
            position: absolute;
            right: 0;
            bottom: -10%;
            width: 900px; /* 압도적인 크기 */
            z-index: 1;
            
            /* ✨ 사진의 왼쪽과 위쪽을 배경색 속으로 녹여버리는 고난도 그라데이션 */
            -webkit-mask-image: radial-gradient(
                circle at bottom right, 
                black 20%, 
                rgba(0,0,0,0.4) 55%, 
                transparent 90%
            );
            mask-image: radial-gradient(
                circle at bottom right, 
                black 20%, 
                rgba(0,0,0,0.4) 55%, 
                transparent 90%
            );
        }

        .main-img {
            width: 100%;
            height: auto;
            filter: grayscale(0.2) contrast(1.1) brightness(0.9);
            opacity: 0.85;
        }

        /* ✍️ 타이포그래피: 쫌좀님 취향을 반영한 거대 텍스트 배치 */
        .text-overlay-wrap {
            position: relative;
            z-index: 10;
            margin-left: 5%;
            pointer-events: none;
        }

        .large-title {
            font-size: 11rem; /* 화면을 압도하는 크기 */
            font-weight: 900;
            color: #ffffff;
            letter-spacing: -8px;
            line-height: 0.85;
            text-transform: uppercase;
            opacity: 0.1; /* 배경과 녹아드는 은은함 */
            margin: 0;
        }

        .front-title {
            position: absolute;
            top: 50%; left: 10px;
            transform: translateY(-50%);
        }

        .actor-name-main {
            font-size: 4.5rem; font-weight: 100; color: #8ea8c9;
            letter-spacing: 30px; text-transform: uppercase;
            white-space: nowrap;
        }
        
        .enter-link { 
            display: inline-flex;
            text-decoration: none; width: 300px; height: 1px; 
            background: #8ea8c9; 
            margin-top: 100px;
            position: relative;
            pointer-events: auto;
            transition: 0.6s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .enter-link::before {
            content: 'ENTER INTO THE UNIVERSE';
            position: absolute;
            top: -40px; left: 0;
            color: #ffffff; font-size: 0.75rem; letter-spacing: 10px;
            white-space: nowrap; opacity: 0.6;
        }

        .enter-link:hover { width: 450px; background: #ffffff; }

        @media (max-width: 1200px) {
            .large-title { font-size: 6rem; letter-spacing: -2px; }
            .actor-name-main { font-size: 2.5rem; letter-spacing: 15px; }
            .visual-photo { width: 600px; }
        }
    </style>
</head>
<body>
    
    <div class="layout-wrapper">
        <div class="text-overlay-wrap">
            <h1 class="large-title">JIWOO<br>ARCHIVE</h1>
            
            <div class="front-title">
                <h2 class="actor-name-main">HAN JI WOO</h2>
                <a href="menu.html" class="enter-link"></a>
            </div>
        </div>

        <div class="visual-photo">
            <img src="jiwoo_profile.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
