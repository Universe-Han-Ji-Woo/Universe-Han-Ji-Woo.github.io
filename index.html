            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        /* 🎬 비주얼 마스크: 글자 'J' 모양 안에만 사진 표시 */
        .j-mask-visual {
            position: absolute;

            -webkit-mask-size: contain; mask-size: contain;
            -webkit-mask-repeat: no-repeat; mask-repeat: no-repeat;
            -webkit-mask-position: center; mask-position: center;
            
            overflow: hidden;
            filter: drop-shadow(0 0 30px rgba(0, 255, 255, 0.2));
        }

        .main-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.8;
            filter: contrast(1.2) saturate(1.1) brightness(1.1);
            /* ✨ 효과 2: 사진이 아주 천천히 흔들리는 효과 */
            animation: softSwayJ 15s infinite alternate ease-in-out;
        }

        /* ✨ 효과 3: 'J' 모양 위에 맺혀 흐르는 리퀴드 글래스 (Liquid Glass) */
        .liquid-drops {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle, rgba(255, 255, 255, 0.3) 0%, transparent 20%);
            background-size: 80px 80px;
            z-index: 3;
            opacity: 0.4;
            mix-blend-mode: screen;
            animation: dropFlow 10s infinite linear;
        }

        @keyframes softSwayJ {
            from { transform: scale(1) rotate(-1deg); }
            to { transform: scale(1.05) rotate(1deg); }
        }

        @keyframes dropFlow {
            from { background-position: 0 0; }
            to { background-position: 40px 100%; }
        }
