<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* ✨ 배경색: 깊은 바다 같은 미드나잇 틸 (고급스러운 다크 무드) */
            background: #1e292b; 
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .main-frame {
            position: relative;
            width: 100%;
            max-width: 1500px;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        /* 🎬 사진: 우측 하단에서 빛을 받으며 올라오는 배치 */
        .visual-spotlight {
            position: absolute;
            right: -2%;
            bottom: -5%;
            width: 850px; 
            z-index: 1;
            
            /* ✨ 핵심: 빛이 번지는 듯한 라운드 마스크로 상단과 좌측을 소멸시킴 */
            -webkit-mask-image: radial-gradient(
                circle at bottom right, 
                black 20%, 
                rgba(0,0,0,0.4) 50%, 
                transparent 85%
            );
            mask-image: radial-gradient(
                circle at bottom right, 
                black 20%, 
                rgba(0,0,0,0.4) 50%, 
                transparent 85%
            );
        }

        .main-img {
            width: 100%;
            height: auto;
            /* 신비로운 분위기를 위한 채도 조정 */
            filter: contrast(1.1) brightness(0.9) saturate(1.1);
            opacity: 0.85;
        }

        /* ✍️ 타이포그래피: 좌측에 큼지막한 세로형 텍스트 */
        .text-side-wrap {
            position: relative;
            z-index: 10;
            margin-left: 5%;
        }

        .giant-word {
            font-size: 13rem; font-weight: 900; color: #ffffff;
            letter-spacing: -10px; line-height: 0.8;
            text-transform: uppercase; margin: 0;
            opacity: 0.05; /* 배경에 녹아든 은은한 거대 글자 */
        }

        .point-title {
            position: absolute;
            top: 50%; left: 10%;
            transform: translateY(-50%);
        }

        .actor-label {
            font-size: 3rem; font-weight: 100; color: #8ea8c9;
            letter-spacing: 25px; text-transform: uppercase;
            white-space: nowrap;
            text-shadow: 0 0 20px rgba(142, 168, 201, 0.4);
        }
        
        .enter-btn-neon { 
            display: inline-flex;
            text-decoration: none; width: 260px; height: 55px; 
            border: 1px solid rgba(142, 168, 201, 0.5);
            background: transparent;
            align-items: center; justify-content: center; 
            font-weight: 700; color: #8ea8c9; letter-spacing: 5px;
            margin-top: 80px; transition: 0.5s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .enter-btn-neon:hover { 
            background: rgba(142, 168, 201, 0.1);
            color: #ffffff;
            box-shadow: 0 0 30px rgba(142, 168, 201, 0.3);
            border: 1px solid #ffffff;
        }

        @media (max-width: 1200px) {
            .giant-word { font-size: 7rem; }
            .actor-label { font-size: 2rem; letter-spacing: 12px; }
            .visual-spotlight { width: 550px; }
        }
    </style>
</head>
<body>
    
    <div class="main-frame">
        <div class="text-side-wrap">
            <h1 class="giant-word">UNIV<br>ERSE</h1>
            
            <div class="point-title">
                <h2 class="actor-label">HAN JI WOO</h2>
                <a href="menu.html" class="enter-btn-neon">EXPLORE ARCHIVE</a>
            </div>
        </div>

        <div class="visual-spotlight">
            <img src="jiwoo_profile.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
