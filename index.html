<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #eef2f6; 
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        /* 🎬 메인 비주얼 구역 */
        .hero-section {
            position: relative;
            width: 100%;
            height: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ✨ 사진: 중앙 하단에 배치, 크기를 키워 웅장하게 */
        .photo-layer {
            position: absolute;
            bottom: 0;
            width: 650px; /* 시원한 PC 크기 */
            z-index: 1;
            
            /* 상단 경계선을 안개처럼 길게 늘어뜨려 소멸시킴 */
            -webkit-mask-image: linear-gradient(
                to bottom, 
                transparent 0%, 
                rgba(0,0,0,0.4) 15%, 
                black 40%, 
                black 100%
            );
            mask-image: linear-gradient(
                to bottom, 
                transparent 0%, 
                rgba(0,0,0,0.4) 15%, 
                black 40%, 
                black 100%
            );
        }

        .main-image {
            width: 100%;
            height: auto;
            filter: contrast(1.05) sepia(0.1) brightness(1.02);
            opacity: 0.9; /* 배경과 살짝 섞이게 */
        }

        /* ✍️ 타이포그래피: 사진의 경계선을 덮어버리는 커다란 글자 */
        .text-layer {
            position: relative;
            z-index: 5;
            text-align: center;
        }

        .main-title {
            font-size: 8rem; /* 압도적인 크기 */
            font-weight: 900;
            color: rgba(142, 168, 201, 0.15); /* 반투명하게 사진을 덮음 */
            letter-spacing: -2px;
            text-transform: uppercase;
            line-height: 1;
            user-select: none;
        }

        .sub-info {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            z-index: 10;
        }

        .actor-name {
            font-size: 2.5rem; font-weight: 200; color: #8ea8c9;
            letter-spacing: 20px; text-transform: uppercase;
            text-shadow: 0 0 15px white;
        }
        
        .enter-btn { 
            display: inline-flex;
            text-decoration: none; width: 200px; height: 65px; 
            background: white; border-radius: 5px; /* 이번엔 직선적인 느낌 */
            align-items: center; justify-content: center; 
            font-weight: 800; color: #8ea8c9; letter-spacing: 5px;
            box-shadow: 0 10px 30px rgba(142, 168, 201, 0.2);
            margin-top: 40px; transition: 0.3s;
            border: 1px solid #d1d9e6;
        }

        @media (max-width: 768px) {
            .photo-layer { width: 400px; }
            .main-title { font-size: 4rem; }
            .actor-name { font-size: 1.5rem; letter-spacing: 10px; }
        }
    </style>
</head>
<body>
    
    <div class="hero-section">
        <div class="text-layer">
            <h1 class="main-title">UNIVERSE</h1>
        </div>

        <div class="photo-layer">
            <img src="jiwoo_profile.png" alt="한지우" class="main-image">
        </div>

        <div class="sub-info">
            <h2 class="actor-name">HAN JI WOO</h2>
            <center><a href="menu.html" class="enter-btn">ENTER</a></center>
        </div>
    </div>

</body>
</html>
