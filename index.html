<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* ✨ 배경색 변경: 훨씬 고급스럽고 눈이 편안한 뮤트 샌드 톤 */
            background: #f2f0eb; 
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            position: relative;
            width: 100%;
            max-width: 1200px;
            height: 90vh;
            display: flex;
            align-items: center;
        }

        /* 🎬 사진: 왼쪽 하단에서 피어오르는 비대칭 배치 */
        .photo-wrap {
            position: absolute;
            left: -30px; 
            bottom: -20px;
            width: 680px; /* 웅장한 크기 */
            z-index: 1;
            
            /* 상단과 우측 경계선을 배경색(#f2f0eb)과 완벽히 융합시키는 마스크 */
            -webkit-mask-image: radial-gradient(
                circle at bottom left, 
                black 10%, 
                rgba(0,0,0,0.6) 45%, 
                transparent 85%
            );
            mask-image: radial-gradient(
                circle at bottom left, 
                black 10%, 
                rgba(0,0,0,0.6) 45%, 
                transparent 85%
            );
        }

        .main-image {
            width: 100%;
            height: auto;
            /* 배경색에 맞춰 톤을 살짝 누른 감성 필터 */
            filter: contrast(1.01) brightness(1.02) saturate(0.9);
            opacity: 0.95;
        }

        /* ✍️ 텍스트: 우측 상단에 세련되게 배치 */
        .info-wrap {
            position: absolute;
            right: 100px;
            top: 20%;
            z-index: 10;
            text-align: right;
        }

        .main-title {
            font-size: 5rem; font-weight: 100; color: #7a7672;
            letter-spacing: 25px; line-height: 1.1;
            text-transform: uppercase; margin: 0;
        }

        .sub-desc {
            font-size: 0.9rem; font-weight: 400; color: #a19d98;
            letter-spacing: 5px; margin-top: 30px; display: block;
            text-transform: uppercase;
        }
        
        .enter-btn { 
            display: inline-flex;
            text-decoration: none; width: 220px; height: 60px; 
            background: transparent;
            border: 1px solid #7a7672; /* 깔끔한 라인 버튼 */
            border-radius: 0px; /* 매거진 느낌의 직선 미학 */
            align-items: center; justify-content: center; 
            font-weight: 500; color: #7a7672; letter-spacing: 6px;
            margin-top: 60px; transition: 0.4s;
        }
        .enter-btn:hover { background: #7a7672; color: #f2f0eb; }

        /* 📱 모바일 대응 */
        @media (max-width: 900px) {
            .container { flex-direction: column; justify-content: flex-end; }
            .photo-wrap { position: relative; left: 0; bottom: 0; width: 110%; }
            .info-wrap { position: relative; right: 0; top: 0; text-align: center; padding: 40px 0; }
            .main-title { font-size: 2.8rem; letter-spacing: 12px; }
        }
    </style>
</head>
<body>
    
    <div class="container">
        <div class="photo-wrap">
            <img src="jiwoo_profile.png" alt="한지우" class="main-image">
        </div>

        <div class="info-wrap">
            <h1 class="main-title">HAN<br>JIWOO</h1>
            <span class="sub-desc">Archive: The First Universe</span>
            <a href="menu.html" class="enter-btn">ENTER VIEW</a>
        </div>
    </div>

</body>
</html>
