<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #0d0d0d; 
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .editorial-wrapper {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex; align-items: center;
        }

        /* 🎬 비주얼 섹션: 세로로 3분할된 사진 슬롯 */
        .photo-strips-container {
            position: absolute;
            right: 5%;
            display: flex;
            gap: 20px;
            z-index: 2;
        }

        .strip {
            width: 240px;
            height: 700px;
            overflow: hidden;
            position: relative;
            border-radius: 120px; /* 둥근 캡슐 형태 */
            /* ✨ 효과 1: 부드러운 글로우 테두리 */
            box-shadow: 0 0 40px rgba(142, 168, 201, 0.1);
        }

        .strip img {
            position: absolute;
            height: 100%;
            width: auto;
            max-width: none;
            opacity: 0.8;
            filter: grayscale(0.2) contrast(1.1);
        }

        /* ✨ 효과 2: 각 스트립별 엇갈린 무빙 (어지럽지 않은 느린 속도) */
        .strip-1 img { left: 0; animation: slideVertical 10s infinite alternate ease-in-out; }
        .strip-2 img { left: -240px; animation: slideVertical 12s infinite alternate-reverse ease-in-out; }
        .strip-3 img { left: -480px; animation: slideVertical 8s infinite alternate ease-in-out; }

        @keyframes slideVertical {
            from { transform: translateY(-5%); }
            to { transform: translateY(5%); }
        }

        /* ✍️ 타이포그래피: 좌측에 아주 큼직하게 (세로형 가로 배치) */
        .text-side-box {
            position: relative;
            z-index: 10;
            margin-left: 5%;
        }

        .huge-hollow-text {
            font-size: 14rem; font-weight: 900; 
            color: transparent;
            -webkit-text-stroke: 1px rgba(255, 255, 255, 0.4);
            letter-spacing: -5px; line-height: 0.85;
            text-transform: uppercase; margin: 0;
            /* ✨ 효과 3: 안이 비어있는 텍스트로 세련미 강조 */
        }

        .filled-title {
            font-size: 5rem; font-weight: 900; color: #ffffff;
            letter-spacing: 15px; text-transform: uppercase;
            margin-top: -30px;
            text-shadow: 0 0 30px rgba(142, 168, 201, 0.5);
        }
        
        .enter-btn-editorial { 
            display: inline-flex;
            text-decoration: none; width: 320px; height: 60px; 
            background: #ffffff;
            align-items: center; justify-content: center; 
            font-weight: 900; color: #0d0d0d; letter-spacing: 10px;
            margin-top: 100px; transition: 0.5s;
            /* ✨ 쉐입 변경: 끝이 살짝 깎인 디자인 */
            clip-path: polygon(0 0, 90% 0, 100% 100%, 10% 100%);
        }
        
        .enter-btn-editorial:hover { 
            background: #8ea8c9; color: #ffffff;
            transform: scale(1.1);
        }

        @media (max-width: 1200px) {
            .huge-hollow-text { font-size: 7rem; }
            .filled-title { font-size: 2.5rem; letter-spacing: 10px; }
            .photo-strips-container { right: 0; transform: scale(0.6); }
        }
    </style>
</head>
<body>
    
    <div class="editorial-wrapper">
        <div class="text-side-box">
            <h1 class="huge-hollow-text">SIGHT<br>BEYOND</h1>
            <h2 class="filled-title">HAN JI WOO</h2>
            <a href="menu.html" class="enter-btn-editorial">GO ARCHIVE</a>
        </div>

        <div class="photo-strips-container">
            <div class="strip strip-1"><img src="jiwoo_profile2.png" alt="조각1"></div>
            <div class="strip strip-2"><img src="jiwoo_profile2.png" alt="조각2"></div>
            <div class="strip strip-3"><img src="jiwoo_profile2.png" alt="조각3"></div>
        </div>
    </div>

</body>
</html>
