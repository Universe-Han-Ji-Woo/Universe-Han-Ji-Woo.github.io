<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #eef2f6; /* 쫌좀님 대문 배경색 */
            min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            font-family: 'Apple SD Gothic Neo', sans-serif;
        }

        /* 🎬 대형 팬페이지에서 쓰는 하이엔드 마스크 기법 */
        .profile-stage {
            margin-top: 60px;
            margin-bottom: 40px;
            position: relative;
            display: inline-block;
            line-height: 0;
        }

        /* 1. 이중 마스크: 경계를 아예 안개 수준으로 날려버립니다 */
        .mask-layer {
            position: relative;
            width: 380px; /* 블러 범위를 위해 조금 더 넓게 */
            height: 380px;
            overflow: hidden;
            
            /* 핵심: 가장자리를 0%까지 아주 길고 부드럽게 뺍니다 */
            -webkit-mask-image: radial-gradient(
                circle at center, 
                rgba(0,0,0,1) 15%,     /* 중심은 아주 선명하게 */
                rgba(0,0,0,0.8) 40%,   /* 서서히 흐려지기 시작 */
                rgba(0,0,0,0.2) 70%,   /* 거의 안보임 */
                rgba(0,0,0,0) 90%      /* 완전 증발 */
            );
            mask-image: radial-gradient(
                circle at center, 
                rgba(0,0,0,1) 15%, 
                rgba(0,0,0,0.8) 40%, 
                rgba(0,0,0,0.2) 70%, 
                rgba(0,0,0,0) 90%
            );
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 2. 이미지의 채도를 살짝 높이고 배경색과 섞이게 필터 적용 */
            filter: contrast(1.05) brightness(1.02);
        }

        /* 3. 오버레이 글로우: 사진 위에 배경색 안개를 한 겹 더 씌워 경계선을 지웁니다 */
        .profile-stage::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(
                circle at center,
                transparent 40%,
                rgba(238, 242, 246, 0.4) 60%, /* 배경색 #eef2f6 사용 */
                rgba(238, 242, 246, 1) 95%
            );
            pointer-events: none; /* 클릭은 사진에 되게 함 */
        }

        /* 타이틀 & 버튼 스타일 (기존 유지하되 더 세련되게) */
        .main-title {
            font-size: 2.2rem; font-weight: 200; color: #8ea8c9;
            letter-spacing: 12px; margin-top: 20px;
            text-transform: uppercase; text-align: center;
        }
        
        .enter-btn { 
            text-decoration: none; width: 220px; height: 70px; 
            background: white; border-radius: 50px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; color: #8ea8c9; letter-spacing: 5px;
            box-shadow: 20px 20px 40px #d1d9e6, -20px -20px 40px #ffffff; 
            margin-top: 40px; transition: 0.3s;
        }
        .enter-btn:hover { transform: translateY(-3px); box-shadow: 10px 10px 20px #d1d9e6; }

        @media (max-width: 600px) {
            .mask-layer { width: 280px; height: 280px; }
            .main-title { font-size: 1.5rem; letter-spacing: 6px; }
        }
    </style>
</head>
<body>
    
    <div class="profile-stage">
        <div class="mask-layer">
            <img src="jiwoo_profile.png" alt="한지우" class="main-image">
        </div>
    </div>

    <h1 class="main-title">UNIVERSE<br><span style="font-size: 1rem; letter-spacing: 8px; font-weight: 600;">HAN JI WOO</span></h1>

    <a href="menu.html" class="enter-btn">ENTER</a>

</body>
</html>
