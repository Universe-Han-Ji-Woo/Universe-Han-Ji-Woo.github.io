<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #eef2f6; /* 대문 배경색 고정 */
            min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            font-family: 'Apple SD Gothic Neo', sans-serif;
        }

        /* 🎬 사진이 배경에 스며드는 컨테이너 */
        .ghost-stage {
            position: relative;
            width: 100%;
            max-width: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 30px;
        }

        .main-image {
            width: 320px; 
            height: auto;
            /* ✨ 핵심 필살기: 이중 마스크 페더링
               중심(얼굴) 15%는 선명하게, 그 이후부터 95% 지점까지 
               아주 길고 부드럽게 투명도를 조절해서 경계선을 '소멸'시킵니다.
            */
            -webkit-mask-image: radial-gradient(
                circle at center, 
                rgba(0,0,0,1) 10%, 
                rgba(0,0,0,0.6) 40%, 
                rgba(0,0,0,0.2) 75%, 
                transparent 92%
            );
            mask-image: radial-gradient(
                circle at center, 
                rgba(0,0,0,1) 10%, 
                rgba(0,0,0,0.6) 40%, 
                rgba(0,0,0,0.2) 75%, 
                transparent 92%
            );
            
            /* 사진 가장자리를 배경색과 더 쫀득하게 붙이는 필터 */
            filter: brightness(1.02) contrast(1.02) blur(0.3px);
        }

        /* 메인 타이틀 */
        .main-title {
            font-size: 2.2rem; font-weight: 200; color: #8ea8c9;
            letter-spacing: 12px; margin-top: 10px;
            text-transform: uppercase; text-align: center;
        }
        
        /* ENTER 버튼 (더 깔끔하고 모던하게) */
        .enter-btn { 
            text-decoration: none; width: 220px; height: 75px; 
            background: white; border-radius: 50px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; color: #8ea8c9; letter-spacing: 5px;
            box-shadow: 20px 20px 40px #d1d9e6, -20px -20px 40px #ffffff; 
            margin-top: 50px; transition: 0.4s;
        }
        .enter-btn:hover { transform: translateY(-3px); box-shadow: 10px 10px 25px #d1d9e6; }

        @media (max-width: 600px) {
            .main-image { width: 260px; }
            .main-title { font-size: 1.5rem; letter-spacing: 6px; }
        }
    </style>
</head>
<body>
    
    <div class="ghost-stage">
        <img src="jiwoo_profile.png" alt="한지우" class="main-image">
    </div>

    <h1 class="main-title">UNIVERSE<br><span style="font-size: 1rem; letter-spacing: 8px; font-weight: 600;">HAN JI WOO</span></h1>

    <a href="menu.html" class="enter-btn">ENTER</a>

</body>
</html>
