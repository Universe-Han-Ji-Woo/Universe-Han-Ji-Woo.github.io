<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* ✨ 배경색: 차분하고 고급스러운 더스티 블루 톤 */
            background: #d1d9e6; 
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .main-container {
            position: relative;
            width: 100%;
            max-width: 1400px;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        /* 🎬 사진: 과감하게 줌인하여 우측에 배치 */
        .photo-box {
            position: absolute;
            right: -10%;
            bottom: -5%;
            width: 850px; /* 아주 크게 배치 */
            z-index: 1;
            
            /* ✨ 대각선 마스크: 상단과 좌측을 배경색과 완벽히 섞어버림 */
            -webkit-mask-image: radial-gradient(
                circle at bottom right, 
                black 30%, 
                rgba(0,0,0,0.5) 60%, 
                transparent 90%
            );
            mask-image: radial-gradient(
                circle at bottom right, 
                black 30%, 
                rgba(0,0,0,0.5) 60%, 
                transparent 90%
            );
        }

        .main-image {
            width: 100%;
            height: auto;
            filter: contrast(1.02) brightness(1.05) saturate(0.8);
            opacity: 0.9;
        }

        /* ✍️ 타이포그래피: 잡지 제호처럼 굵고 감각적으로 배치 */
        .text-wrap {
            position: relative;
            z-index: 10;
            margin-left: 10%;
        }

        .main-title {
            font-size: 7rem; font-weight: 900; color: #ffffff;
            letter-spacing: -5px; line-height: 0.9;
            text-transform: uppercase; margin: 0;
            opacity: 0.8;
            mix-blend-mode: overlay; /* 배경/사진과 섞이는 효과 */
        }

        .sub-brand {
            font-size: 1.5rem; font-weight: 300; color: #4a5568;
            letter-spacing: 15px; margin-top: 20px; display: block;
        }
        
        .enter-btn { 
            display: inline-flex;
            text-decoration: none; width: 200px; height: 50px; 
            background: #4a5568; 
            align-items: center; justify-content: center; 
            font-weight: 600; color: #ffffff; letter-spacing: 4px;
            margin-top: 60px; transition: 0.5s;
            clip-path: polygon(0 0, 90% 0, 100% 100%, 10% 100%); /* 감각적인 평행사변형 버튼 */
        }
        .enter-btn:hover { background: #ffffff; color: #4a5568; }

        @media (max-width: 1024px) {
            .photo-box { width: 600px; right: -20%; }
            .main-title { font-size: 4rem; }
        }
    </style>
</head>
<body>
    
    <div class="main-container">
        <div class="text-wrap">
            <h1 class="main-title">THE<br>UNIVERSE</h1>
            <span class="sub-brand">HAN JI WOO</span>
            <a href="menu.html" class="enter-btn">ENTER</a>
        </div>

        <div class="photo-box">
            <img src="jiwoo_profile.png" alt="한지우" class="main-image">
        </div>
    </div>

</body>
</html>
