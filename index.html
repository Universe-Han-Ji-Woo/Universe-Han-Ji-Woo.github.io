<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* ✨ 배경색: 오묘하고 깊이 있는 뮤트 그린 (배우의 분위기를 신비롭게 함) */
            background: #3d4341; 
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .art-wrapper {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        /* 🎬 사진: 우측 상단에서 아래로 쏟아지는 듯한 배치 */
        .visual-frame {
            position: absolute;
            right: 0;
            top: -5%;
            width: 800px; 
            z-index: 1;
            
            /* ✨ 핵심: 왼쪽과 아래쪽 경계선을 배경색(#3d4341)으로 길게 녹임 */
            -webkit-mask-image: linear-gradient(
                to bottom left, 
                black 10%, 
                rgba(0,0,0,0.5) 40%, 
                transparent 85%
            );
            mask-image: linear-gradient(
                to bottom left, 
                black 10%, 
                rgba(0,0,0,0.5) 40%, 
                transparent 85%
            );
        }

        .main-img {
            width: 100%;
            height: auto;
            filter: contrast(1.05) brightness(1.05) saturate(0.85);
            opacity: 0.8;
        }

        /* ✍️ 타이포그래피: 좌측에 큼지막한 수직 텍스트 배치 */
        .side-text-box {
            position: relative;
            z-index: 10;
            margin-left: 80px;
            display: flex;
            flex-direction: column;
        }

        .vertical-line {
            width: 2px; height: 100px; background: #8ea8c9; margin-bottom: 30px;
        }

        .huge-text {
            font-size: 8rem; font-weight: 900; color: #ffffff;
            letter-spacing: -2px; line-height: 0.8;
            text-transform: uppercase;
            margin: 0;
            opacity: 0.9;
        }

        .sub-brand-name {
            font-size: 1.2rem; font-weight: 200; color: #8ea8c9;
            letter-spacing: 12px; margin-top: 40px; text-transform: uppercase;
        }
        
        .enter-btn-minimal { 
            display: inline-flex;
            text-decoration: none; width: 220px; height: 60px; 
            border: 1px solid rgba(255,255,255,0.3);
            background: transparent;
            align-items: center; justify-content: center; 
            font-weight: 600; color: #ffffff; letter-spacing: 5px;
            margin-top: 60px; transition: 0.4s;
        }
        .enter-btn-minimal:hover { 
            background: #ffffff; color: #3d4341; border: 1px solid #ffffff;
        }

        @media (max-width: 1024px) {
            .huge-text { font-size: 4rem; }
            .visual-frame { width: 500px; right: -10%; }
            .side-text-box { margin-left: 40px; }
        }
    </style>
</head>
<body>
    
    <div class="art-wrapper">
        <div class="side-text-box">
            <div class="vertical-line"></div>
            <h1 class="huge-text">BEYOND<br>THE<br>UNIVERSE</h1>
            <span class="sub-brand-name">Actor Han Jiwoo</span>
            <a href="menu.html" class="enter-btn-minimal">ENTER NOW</a>
        </div>

        <div class="visual-frame">
            <img src="jiwoo_profile.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
