<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #ffffff; 
            min-height: 100vh;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        /* ✨ 효과: 배우님 뒤에서 뿜어져 나오는 후광 (배우 강조) */
        .liquid-bg {
            position: absolute;
            width: 900px; height: 900px;
            background: radial-gradient(circle, rgba(142, 168, 201, 0.2) 0%, rgba(255, 255, 255, 0) 75%);
            filter: blur(60px);
            animation: liquidMorph 15s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes liquidMorph {
            0% { transform: translate(-10%, -10%) scale(1); }
            100% { transform: translate(10%, 10%) scale(1.1); }
        }

        .motion-wrapper {
            position: relative;
            width: 100%; max-width: 1600px;
            height: 100vh;
            display: flex; align-items: center;
        }

        /* 🎬 PC: 배우님 비주얼 영역 (압도적 크기) */
        .photo-motion-box {
            position: absolute;
            right: 0%;
            width: 900px; /* 더 크게 키움 */
            z-index: 10;
        }

        .main-img {
            width: 100%; height: auto; display: block;
            -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 95%);
            animation: heroMotion 6s infinite alternate ease-in-out;
        }

        @keyframes heroMotion {
            from { transform: scale(1); filter: brightness(1); }
            to { transform: scale(1.04); filter: brightness(1.05); }
        }

        /* ✍️ PC: 텍스트는 보조적인 수단일 뿐 */
        .text-motion-zone {
            position: relative;
            z-index: 20;
            margin-left: 5%;
        }

        .mega-universe-txt {
            font-size: 12rem; font-weight: 900; color: #1a1a1a;
            letter-spacing: -8px; line-height: 0.8;
            text-transform: uppercase; margin: 0;
            background: linear-gradient(to bottom, #1a1a1a 60%, rgba(142, 168, 201, 0.5));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-coming-soon {
            font-size: 3rem; font-weight: 900; color: #8ea8c9;
            letter-spacing: 12px; text-transform: uppercase;
            margin-top: 10px;
        }

        .artist-name-label {
            font-size: 1.2rem; font-weight: 100; color: #1a1a1a;
            letter-spacing: 20px; text-transform: uppercase;
            margin-top: 30px; opacity: 0.4;
        }
        
        .enter-btn-motion { 
            display: inline-flex;
            text-decoration: none; width: 300px; height: 65px; 
            background: #1a1a1a; color: #fff;
            align-items: center; justify-content: center; 
            font-weight: 900; font-size: 1rem; letter-spacing: 10px;
            margin-top: 50px; transition: 0.5s;
            border-radius: 30px; /* 더 부드럽게 */
        }
        
        .enter-btn-motion:hover { width: 400px; background: #8ea8c9; }

        /* 📱 모바일: 배우님 비주얼 절대 사수 버전 */
        @media (max-width: 1200px) {
            .motion-wrapper {
                flex-direction: column; 
                justify-content: space-between; /* 위아래 끝으로 배치 */
                padding: 5vh 0;
            }

            .text-motion-zone {
                margin-left: 0;
                text-align: center;
                order: 1;
            }

            .mega-universe-txt { font-size: 4.5rem; letter-spacing: -2px; }
            .sub-coming-soon { font-size: 1.5rem; letter-spacing: 5px; }

            /* ✨ 배우님을 화면 하단에 꽉 차게 배치하여 주인공 포스 극대화 */
            .photo-motion-box {
                order: 2;
                position: relative;
                width: 120%; /* 화면 밖으로 살짝 나가게 하여 웅장함 강조 */
                margin-top: auto;
                bottom: -20px;
            }

            .main-img {
                width: 100%;
                -webkit-mask-image: linear-gradient(to top, black 80%, transparent 100%);
            }

            .enter-btn-motion {
                position: absolute; /* 글자와 사진 사이 적절한 위치 */
                top: 45vh; left: 50%; transform: translateX(-50%);
                z-index: 30;
                width: 250px;
            }
        }
    </style>
</head>
<body>
    
    <div class="liquid-bg"></div>

    <div class="motion-wrapper">
        <div class="text-motion-zone">
            <h1 class="mega-universe-txt">UNIVERSE<br>ARCHIVE</h1>
            <h2 class="sub-coming-soon">COMING SOON</h2>
            <div class="artist-name-label">HAN JI WOO</div>
            <a href="menu.html" class="enter-btn-motion">STAY TUNED</a>
        </div>

        <div class="photo-motion-box">
            <img src="jiwoo_profile2.png" alt="배우 한지우" class="main-img">
        </div>
    </div>

</body>
</html>
