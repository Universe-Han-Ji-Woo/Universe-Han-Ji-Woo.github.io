<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #eef2f6; 
            min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            font-family: 'Apple SD Gothic Neo', sans-serif;
        }

        /* 🎬 메인 스테이지 */
        .ghost-stage {
            position: relative;
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 20px;
        }

        /* ✨ 상하 경계선을 지우는 핵심: 마스크 레이어 추가 */
        .ghost-stage::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            /* 움짤에서 짚어주신 상단과 하단만 배경색(#eef2f6)으로 부드럽게 덮어버립니다 */
            background: linear-gradient(
                to bottom, 
                #eef2f6 0%, 
                transparent 25%, 
                transparent 75%, 
                #eef2f6 100%
            );
            pointer-events: none;
        }

        .main-image {
            /* 쫌좀님이 요청하신 딱 그 크기 (PC 550px) */
            width: 550px; 
            height: auto;
            
            /* 기존의 부드러운 원형 페더링도 유지해서 자연스럽게 융합 */
            -webkit-mask-image: radial-gradient(
                circle at center, 
                rgba(0,0,0,1) 15%, 
                rgba(0,0,0,0.7) 45%, 
                rgba(0,0,0,0.2) 75%, 
                transparent 95%
            );
            mask-image: radial-gradient(
                circle at center, 
                rgba(0,0,0,1) 15%, 
                rgba(0,0,0,0.7) 45%, 
                rgba(0,0,0,0.2) 75%, 
                transparent 95%
            );
            
            filter: brightness(1.02) contrast(1.02) blur(0.3px);
        }

        .main-title {
            font-size: 2.5rem; font-weight: 200; color: #8ea8c9;
            letter-spacing: 15px; margin-top: 15px;
            text-transform: uppercase; text-align: center;
        }
        
        .enter-btn { 
            text-decoration: none; width: 220px; height: 75px; 
            background: white; border-radius: 50px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; color: #8ea8c9; letter-spacing: 5px;
            box-shadow: 20px 20px 40px #d1d9e6, -20px -20px 40px #ffffff; 
            margin-top: 50px; transition: 0.4s;
        }
        .enter-btn:hover { transform: translateY(-3px); }

        /* 📱 모바일 버전 유지 */
        @media (max-width: 768px) {
            .main-image { width: 300px; }
            .main-title { font-size: 1.6rem; letter-spacing: 8px; }
            .ghost-stage { max-width: 100%; }
        }
    </style>
</head>
<body>
    
    <div class="ghost-stage">
        <img src="jiwoo_profile.png" alt="한지우" class="main-image">
    </div>

    <h1 class="main-title">UNIVERSE<br><span style="font-size: 1.1rem; letter-spacing: 10px; font-weight: 600;">HAN JI WOO</span></h1>

    <a href="menu.html" class="enter-btn">ENTER</a>

</body>
</html>
