<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* ✨ 배경색: 투명감이 느껴지는 시원한 화이트 톤 */
            background: #f8fafc; 
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 🎬 전시 프레임: 사진을 상단에 배치 */
        .gallery-frame {
            position: relative;
            width: 100%;
            height: 70vh;
            display: flex;
            justify-content: center;
            align-items: flex-start; /* 위쪽 정렬 */
            padding-top: 5vh;
            overflow: hidden;
        }

        .main-image {
            width: 580px; /* 시원시원한 크기 */
            height: auto;
            display: block;
            
            /* ✨ 핵심: 하단 경계선을 바닥까지 아주 길게 녹여버리는 마스크 
               앞머리와 얼굴(상단 10%)은 칼같이 살리고, 하단으로 갈수록 배경과 합체
            */
            -webkit-mask-image: linear-gradient(
                to bottom, 
                black 10%, 
                rgba(0,0,0,0.8) 30%, 
                rgba(0,0,0,0.3) 60%, 
                transparent 90%
            );
            mask-image: linear-gradient(
                to bottom, 
                black 10%, 
                rgba(0,0,0,0.8) 30%, 
                rgba(0,0,0,0.3) 60%, 
                transparent 90%
            );
            
            filter: contrast(1.02) saturate(1.05);
        }

        /* ✍️ 타이포그래피: 사진 아래 넓은 여백을 활용 */
        .bottom-content {
            text-align: center;
            margin-top: -10vh; /* 사진 안개 부분과 살짝 겹치게 */
            z-index: 10;
        }

        .main-title {
            font-size: 3rem; font-weight: 100; color: #475569;
            letter-spacing: 20px; text-transform: uppercase;
            margin-bottom: 10px;
        }

        .sub-text {
            font-size: 0.85rem; font-weight: 500; color: #94a3b8;
            letter-spacing: 10px; text-transform: uppercase;
        }
        
        .enter-btn { 
            display: inline-flex;
            text-decoration: none; width: 60px; height: 60px; 
            border: 1px solid #cbd5e1; border-radius: 50%; 
            align-items: center; justify-content: center; 
            margin-top: 60px; transition: 0.4s;
            color: #475569;
        }
        
        /* 버튼 안의 화살표 아이콘 느낌 */
        .enter-btn::before { content: '↓'; font-size: 1.5rem; font-weight: 200; }
        .enter-btn:hover { background: #475569; color: white; transform: translateY(5px); }

        @media (max-width: 768px) {
            .main-image { width: 340px; }
            .main-title { font-size: 1.8rem; letter-spacing: 10px; }
        }
    </style>
</head>
<body>
    
    <div class="gallery-frame">
        <img src="jiwoo_profile.png" alt="한지우" class="main-image">
    </div>

    <div class="bottom-content">
        <h1 class="main-title">HAN JI WOO</h1>
        <p class="sub-text">2026 OFFICIAL ARCHIVE</p>
        <a href="menu.html" class="enter-btn"></a>
    </div>

</body>
</html>
