<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #eef2f6; 
            min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            font-family: 'Apple SD Gothic Neo', sans-serif;
        }

        /* 🎬 홈마들이 쓰는 고난도 마스크 컨테이너 */
        .frame-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* ✨ 핵심 필살기: 이중 선형 마스크 
               상단(0~30%)과 하단(70~100%)을 아주 길고 부드럽게 날립니다.
               중앙 40% 영역(얼굴)은 100% 선명하게 유지합니다.
            */
            -webkit-mask-image: linear-gradient(
                to bottom, 
                transparent 0%, 
                rgba(0,0,0,0.5) 15%, 
                black 30%, 
                black 70%, 
                rgba(0,0,0,0.5) 85%, 
                transparent 100%
            );
            mask-image: linear-gradient(
                to bottom, 
                transparent 0%, 
                rgba(0,0,0,0.5) 15%, 
                black 30%, 
                black 70%, 
                rgba(0,0,0,0.5) 85%, 
                transparent 100%
            );
        }

        .main-image {
            /* PC 사이즈 550px 유지 */
            width: 550px; 
            height: auto;
            display: block;
            /* 사진 자체에 아주 미세한 블러를 줘서 배경과 톤을 맞춤 */
            filter: brightness(1.02) contrast(1.01) blur(0.2px);
        }

        .main-title {
            font-size: 2.2rem; font-weight: 200; color: #8ea8c9;
            letter-spacing: 15px; margin-top: 30px;
            text-transform: uppercase; text-align: center;
        }
        
        .enter-btn { 
            text-decoration: none; width: 220px; height: 75px; 
            background: #eef2f6; border-radius: 50px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; color: #8ea8c9; letter-spacing: 5px;
            /* 홈마 감성 뉴모피즘 버튼 */
            box-shadow: 12px 12px 24px #d1d9e6, -12px -12px 24px #ffffff; 
            margin-top: 50px; transition: 0.3s;
        }

        @media (max-width: 768px) {
            .main-image { width: 300px; }
            .main-title { font-size: 1.5rem; letter-spacing: 8px; }
        }
    </style>
</head>
<body>
    
    <div class="frame-container">
        <img src="jiwoo_profile.png" alt="한지우" class="main-image">
    </div>

    <h1 class="main-title">UNIVERSE<br><span style="font-size: 1rem; letter-spacing: 8px; font-weight: 600;">HAN JI WOO</span></h1>

    <a href="menu.html" class="enter-btn">ENTER</a>

</body>
</html>
