<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #08090a; 
            min-height: 100vh;
            font-family: 'Impact', 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .glitch-container {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        /* 🎬 사진 구역: 사진을 배경의 일부처럼 배치 */
        .visual-glitch-box {
            position: absolute;
            right: 0;
            width: 50%; /* 사진을 오른쪽 절반에 꽉 채움 */
            height: 100%;
            overflow: hidden;
            z-index: 1;
        }

        .main-img {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 사진 위치/크기 변경: 화면 절반을 꽉 채우는 박력 */
            opacity: 0.6;
            filter: contrast(1.2) grayscale(0.3);
            /* ✨ 효과 1: GIF처럼 지직거리는 글리치 모션 */
            animation: imgGlitch 3s infinite;
        }

        /* ✨ 효과 2: 사진 위를 가로지르는 세로 스캔라인 (GIF 질감) */
        .visual-glitch-box::after {
            content: '';
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%), 
                        linear-gradient(90deg, rgba(255, 0, 0, 0.05), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.05));
            background-size: 100% 2px, 3px 100%;
            z-index: 2;
            pointer-events: none;
        }

        @keyframes imgGlitch {
            0% { transform: translate(0); }
            20% { transform: translate(-5px, 5px) skew(1deg); }
            40% { transform: translate(-5px, -5px) scale(1.02); }
            60% { transform: translate(5px, 5px) skew(-1deg); }
            80% { transform: translate(5px, -5px); }
            100% { transform: translate(0); }
        }

        /* ✍️ 타이포그래피: 좌측에 웅장하고 압도적으로 */
        .text-overlay {
            position: relative;
            z-index: 10;
            margin-left: 8%;
        }

        .giant-impact {
            font-size: 15rem; font-weight: 900; color: #ffffff;
            letter-spacing: -10px; line-height: 0.8;
            text-transform: uppercase; margin: 0;
            text-shadow: 10px 10px 0px #8ea8c9; /* 그림자로 입체감 극대화 */
            /* ✨ 효과 3: 글자가 좌우로 미세하게 떨리는 진동 효과 */
            animation: textVibrate 0.2s infinite;
        }

        @keyframes textVibrate {
            0% { transform: translate(0); }
            50% { transform: translate(2px, 2px); }
            100% { transform: translate(0); }
        }

        .actor-id {
            font-size: 4rem; font-weight: 100; color: #ffffff;
            letter-spacing: 20px; text-transform: uppercase;
            margin-top: 20px;
            background: #8ea8c9;
            padding: 10px 20px;
            display: inline-block;
        }
        
        .enter-btn-glitch { 
            display: flex;
            text-decoration: none; width: 350px; height: 70px; 
            border: 2px solid #ffffff; 
            background: transparent;
            align-items: center; justify-content: center; 
            font-weight: 900; color: #ffffff; letter-spacing: 10px;
            margin-top: 80px; transition: 0.3s;
            position: relative;
        }

            background: #ffffff; color: #0
