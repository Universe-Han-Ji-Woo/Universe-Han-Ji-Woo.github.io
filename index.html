<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* ✨ 배경색: 눈부시게 깨끗한 화이트 */
            background: #ffffff; 
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .white-wrapper {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        /* 🎬 비주얼 섹션 */
        .visual-frame {
            position: absolute;
            right: 0;
            bottom: 0;
            width: 850px;
            z-index: 2;
            
            /* ✨ 밝은 배경용 마스크: 사진 하단과 왼쪽을 화이트 속으로 녹임 */
            -webkit-mask-image: radial-gradient(circle at bottom right, black 30%, transparent 90%);
            mask-image: radial-gradient(circle at bottom right, black 30%, transparent 90%);
        }

        .main-img {
            width: 100%;
            height: auto;
            opacity: 0.95;
            filter: contrast(1.05) saturate(1.1) brightness(1.02);
            /* ✨ 효과 1: 아주 천천히 좌우로 부드럽게 흔들리는 스웨이(Sway) 효과 */
            animation: softSway 12s infinite alternate ease-in-out;
        }

        /* ✨ 효과 2: 사진 위로 지나가는 투명한 유리 반사광 (Glossy Reflection) */
        .glossy-shine {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(
                135deg,
                transparent 45%,
                rgba(255, 255, 255, 0.6) 50%,
                transparent 55%
            );
            z-index: 3;
            mix-blend-mode: overlay;
            animation: shineMove 4s infinite linear;
        }

        /* ✨ 효과 3: 화면 전체에 떠다니는 아주 작은 화이트 파티클 */
        .white-particles {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-image: radial-gradient(rgba(142, 168, 201, 0.2) 1px, transparent 1px);
            background-size: 40px 40px;
            z-index: 1;
            animation: particleFloat 10s infinite linear;
        }

        @keyframes softSway {
            from { transform: rotate(-1deg) scale(1); }
            to { transform: rotate(1deg) scale(1.03); }
        }

        @keyframes shineMove {
            from { transform: translateX(-100%); }
            to { transform: translateX(100%); }
        }

        @keyframes particleFloat {
            from { background-position: 0 0; }
            to { background-position: 40px 80px; }
        }

        /* ✍️ 타이포그래피: 밝은 배경에 어울리는 세련된 그레이 톤 */
        .text-stage {
            position: relative;
            z-index: 10;
            margin-left: 7%;
        }

        .huge-hollow {
            font-size: 12rem; font-weight: 900; 
            /* ✨ 테두리만 있는 글자 (Hollow Text)로 시원하게 */
            color: transparent;
            -webkit-text-stroke: 1px #e2e8f0;
            letter-spacing: -5px; line-height: 0.85;
            text-transform: uppercase; margin: 0;
        }

        .actor-label-pure {
            font-size: 4rem; font-weight: 100; color: #475569;
            letter-spacing: 25px; text-transform: uppercase;
            margin-top: -30px;
        }
        
        .enter-btn-white { 
            display: inline-flex;
            text-decoration: none; width: 280px; height: 60px; 
            border: 1px solid #475569; 
            background: transparent;
            align-items: center; justify-content: center; 
            font-weight: 700; color: #475569; letter-spacing: 8px;
            margin-top: 80px; transition: 0.5s;
        }
        
        .enter-btn-white:hover { 
            background: #475569; color: #ffffff; 
            box-shadow: 0 20px 40px rgba(0,0,0,0.05);
            transform: translateY(-5px);
        }

        @media (max-width: 1200px) {
            .huge-hollow { font-size: 6rem; }
            .actor-label-pure { font-size: 2.2rem; letter-spacing: 12px; }
            .visual-frame { width: 550px; }
        }
    </style>
</head>
<body>
    <div class="white-particles"></div>
    
    <div class="white-wrapper">
        <div class="text-stage">
            <h1 class="huge-hollow">ETERNAL<br>MUSE</h1>
            <h2 class="actor-label-pure">HAN JI WOO</h2>
            <a href="menu.html" class="enter-btn-white">ENTER GALLERY</a>
        </div>

        <div class="visual-frame">
            <div class="glossy-shine"></div>
            <img src="jiwoo_profile.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
