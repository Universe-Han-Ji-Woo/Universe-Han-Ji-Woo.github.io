<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #f8faff; 
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        /* 🎬 효과 1: 공중에 떠다니는 미세한 눈가루(Snow Dust) */
        .snow-dust {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: radial-gradient(circle, rgba(142, 168, 201, 0.2) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: 1;
            animation: snowMove 20s linear infinite;
        }

        @keyframes snowMove {
            from { background-position: 0 0; }
            to { background-position: 500px 1000px; }
        }

        .ethereal-wrapper {
            position: relative;
            width: 100%; max-width: 1600px;
            height: 100vh;
            display: flex; align-items: center;
        }

        /* 🎬 비주얼: 우측 하단에 배치하고 안개 마스크 처리 */
        .photo-frost-box {
            position: absolute;
            right: -2%; bottom: -5%;
            width: 900px;
            z-index: 5;
        }

        .main-img {
            width: 100%; height: auto; display: block;
            opacity: 0.9;
            filter: contrast(1.05) brightness(1.05) saturate(1.1);
            /* ✨ 얼굴 사수: 얼굴은 선명하게, 외곽은 아주 넓게 안개 효과 */
            -webkit-mask-image: radial-gradient(circle at 60% 40%, black 20%, transparent 85%);
            animation: slowSway 10s infinite alternate ease-in-out;
        }

        /* ✨ 효과 2: 사진 위를 부드럽게 훑는 '윈터 라이트(Winter Light)' */
        .winter-light {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(135deg, transparent, rgba(255,255,255,0.4), transparent);
            z-index: 10;
            animation: lightSweep 7s infinite ease-in-out;
        }

        @keyframes slowSway {
            from { transform: scale(1) translateX(0); }
            to { transform: scale(1.03) translateX(-10px); }
        }

        @keyframes lightSweep {
            0% { transform: translateX(-100%); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateX(100%); opacity: 0; }
        }

        /* ✍️ 타이포그래피: 좌측 상단에 맑고 투명하게 */
        .text-frost-zone {
            position: relative;
            z-index: 20;
            margin-left: 6%;
            margin-top: -5%;
        }

        .giant-frost-txt {
            font-size: 14rem; font-weight: 900; color: #1a1a1a;
            letter-spacing: -10px; line-height: 0.85;
            text-transform: uppercase; margin: 0;
            /* ✨ 효과 3: 글자 뒷부분에 투명한 오로라 광택 */
            text-shadow: 15px 15px 40px rgba(142, 168, 201, 0.2);
        }

        .sub-frost-label {
            font-size: 4.5rem; font-weight: 100; color: #8ea8c9;
            letter-spacing: 25px; text-transform: uppercase;
            margin-top: 10px;
        }
        
        /* 🎬 버튼: 유리처럼 투명한 디자인 */
        .enter-btn-frost { 
            display: inline-flex;
            text-decoration: none; width: 360px; height: 70px; 
            border: 1px solid rgba(142, 168, 201, 0.5);
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            align-items: center; justify-content: center; 
            font-weight: 900; color: #1a1a1a; letter-spacing: 12px;
            margin-top: 80px; transition: 0.5s;
        }
        
        .enter-btn-frost:hover { 
            background: #1a1a1a; color: #fff;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            transform: translateY(-5px);
        }

        @media (max-width: 1200px) {
            .giant-frost-txt { font-size: 7rem; }
            .sub-frost-label { font-size: 2.5rem; letter-spacing: 12px; }
            .photo-frost-box { width: 100%; opacity: 0.3; }
        }
    </style>
</head>
<body>
    
    <div class="snow-dust"></div>

    <div class="ethereal-wrapper">
        <div class="text-frost-zone">
            <h1 class="giant-frost-txt">FROST<br>LIGHT</h1>
            <h2 class="sub-frost-label">HAN JI WOO</h2>
            <a href="menu.html" class="enter-btn-frost">VIEW MORE</a>
        </div>

        <div class="photo-frost-box">
            <div class="winter-light"></div>
            <img src="jiwoo_profile2.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
