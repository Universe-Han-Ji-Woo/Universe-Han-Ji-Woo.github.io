<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* ✨ 배경: 아주 차분하고 깊은 딥 네이비 */
            background: #02040a; 
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .luxury-wrapper {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex; align-items: center;
        }

        /* 🎬 비주얼 섹션: 오른쪽 하단에 웅장하게 배치 */
        .photo-visual-soft {
            position: absolute;
            right: -5%;
            bottom: -5%;
            width: 950px;
            z-index: 2;
            /* ✨ 효과 1: 부드러운 안개 마스크로 배경과 완전 통합 */
            -webkit-mask-image: radial-gradient(circle at bottom right, black 30%, transparent 85%);
            mask-image: radial-gradient(circle at bottom right, black 30%, transparent 85%);
        }

        .main-img {
            width: 100%;
            height: auto;
            opacity: 0.85;
            filter: contrast(1.1) brightness(1.05) saturate(1.1);
            /* ✨ 효과 2: 숨쉬듯 아주 미세하게 커지는 펄스 모션 (어지러움 Zero) */
            animation: slowBreath 12s infinite alternate ease-in-out;
        }

        /* ✨ 효과 3: 사진 위를 천천히 유영하는 '실크 광택' (Silk Glow) */
        .silk-glow {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(142, 168, 201, 0.25) 0%, transparent 60%);
            z-index: 3;
            mix-blend-mode: screen;
            animation: lightFollow 8s infinite alternate ease-in-out;
        }

        @keyframes slowBreath {
            from { transform: scale(1); }
            to { transform: scale(1.04); }
        }

        @keyframes lightFollow {
            0% { transform: translate(-20%, -20%); }
            100% { transform: translate(20%, 20%); }
        }

        /* ✍️ 타이포그래피: 좌측 상단에 묵직하고 세련되게 */
        .text-top-left {
            position: relative;
            z-index: 10;
            margin-left: 6%;
            margin-top: -10%;
        }

        .giant-luxury-text {
            font-size: 14rem; font-weight: 900; 
            color: #ffffff;
            letter-spacing: -8px; line-height: 0.8;
            text-transform: uppercase; margin: 0;
            /* ✨ 효과 4: 글자에 은은한 금속성 그라데이션 */
            background: linear-gradient(to bottom, #ffffff 50%, #8ea8c9 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .sub-label-thin {
            font-size: 4rem; font-weight: 100; color: #ffffff;
            letter-spacing: 25px; text-transform: uppercase;
            margin-top: 10px;
            opacity: 0.6;
        }
        
        .enter-btn-silk { 
            display: inline-flex;
            text-decoration: none; width: 350px; height: 60px; 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            background: transparent;
            align-items: center; justify-content: center; 
            font-weight: 700; color: #ffffff; letter-spacing: 12px;
            margin-top: 100px; transition: 0.6s;
            overflow: hidden;
            position: relative;
        }
        
        .enter-btn-silk::before {
            content: '';
            position: absolute; top: 0; left: -100%;
            width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }

        .enter-btn-silk:hover::before { left: 100%; }
        .enter-btn-silk:hover { 
            border-color: #ffffff;
            box-shadow: 0 0 40px rgba(142, 168, 201, 0.3);
            background: rgba(255,255,255,0.05);
        }

        @media (max-width: 1200px) {
            .giant-luxury-text { font-size: 7rem; }
            .sub-label-thin { font-size: 2.2rem; letter-spacing: 12px; }
            .photo-visual-soft { width: 600px; right: -10%; }
        }
    </style>
</head>
<body>
    
    <div class="luxury-wrapper">
        <div class="text-top-left">
            <h1 class="giant-luxury-text">DIVINE<br>SPACE</h1>
            <h2 class="sub-label-thin">HAN JI WOO</h2>
            <a href="menu.html" class="enter-btn-silk">DISCOVER</a>
        </div>

        <div class="photo-visual-soft">
            <div class="silk-glow"></div>
            <img src="jiwoo_profile2.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
