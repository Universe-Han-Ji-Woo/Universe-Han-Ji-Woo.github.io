<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #111214; /* ✨ 흑연보다 깊은 딥 블랙 */
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .hologram-wrapper {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        /* 🎬 메인 비주얼 구역 */
        .visual-zone {
            position: absolute;
            right: 0;
            width: 900px;
            height: 100%;
            z-index: 1;
            display: flex;
            align-items: center;
            
            -webkit-mask-image: linear-gradient(to left, black 40%, transparent 95%);
            mask-image: linear-gradient(to left, black 40%, transparent 95%);
        }

        .main-img {
            width: 100%;
            height: auto;
            opacity: 0.75;
            filter: contrast(1.2) brightness(1.1) saturate(1.1);
            /* ✨ 효과 1: 아주 미세한 떨림과 크기 변화 */
            animation: subtleVibrate 10s infinite alternate;
        }

        /* ✨ 효과 2: 사진 위를 흐르는 디지털 홀로그램 노이즈 */
        .hologram-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(rgba(142, 168, 201, 0.1) 1px, transparent 1px);
            background-size: 100% 3px;
            z-index: 2;
            pointer-events: none;
            opacity: 0.3;
            animation: scanLine 4s infinite linear;
        }

        @keyframes subtleVibrate {
            0% { transform: scale(1) translateX(0); }
            50% { transform: scale(1.03) translateX(10px); }
            100% { transform: scale(1) translateX(0); }
        }

        @keyframes scanLine {
            from { background-position: 0 0; }
            to { background-position: 0 100%; }
        }

        /* ✍️ 타이포그래피: 사진의 경계를 가로지르는 배치 */
        .text-overlay-stage {
            position: relative;
            z-index: 10;
            margin-left: 6%;
        }

        .glitch-title {
            font-size: 13rem; font-weight: 900; color: #ffffff;
            letter-spacing: -12px; line-height: 0.8;
            text-transform: uppercase; margin: 0;
            opacity: 0.8;
            /* ✨ 효과 3: 글자가 지직거리는 글리치 효과 */
            animation: textGlitch 5s infinite;
        }

        @keyframes textGlitch {
            0%, 100% { transform: translate(0); text-shadow: none; }
            92% { transform: translate(0); text-shadow: none; }
            94% { transform: translate(-5px, 2px); text-shadow: 2px 0 red, -2px 0 cyan; }
            96% { transform: translate(5px, -2px); text-shadow: -2px 0 red, 2px 0 cyan; }
            98% { transform: translate(-2px, -1px); text-shadow: 2px 0 blue, -2px 0 yellow; }
        }

        .sub-identity {
            font-size: 4rem; font-weight: 100; color: #8ea8c9;
            letter-spacing: 25px; text-transform: uppercase;
            margin-top: -20px;
            text-shadow: 0 0 30px rgba(142, 168, 201, 0.4);
        }
        
        .enter-btn-hologram { 
            display: inline-flex;
            text-decoration: none; width: 320px; height: 60px; 
            border: 1px solid #ffffff; 
            background: transparent;
            align-items: center; justify-content: center; 
            font-weight: 800; color: #ffffff; letter-spacing: 8px;
            margin-top: 80px; transition: 0.4s;
            position: relative;
            overflow: hidden;
        }
        
        .enter-btn-hologram:hover { 
            background: #ffffff; color: #111214; 
            box-shadow: 0 0 50px rgba(255,255,255,0.3);
            letter-spacing: 12px;
        }

        @media (max-width: 1200px) {
            .glitch-title { font-size: 7rem; letter-spacing: -5px; }
            .sub-identity { font-size: 2.5rem; letter-spacing: 12px; }
            .visual-zone { width: 600px; }
        }
    </style>
</head>
<body>
    
    <div class="hologram-wrapper">
        <div class="text-overlay-stage">
            <h1 class="glitch-title">UNIVERSE<br>LIMITLESS</h1>
            <h2 class="sub-identity">HAN JI WOO</h2>
            <a href="menu.html" class="enter-btn-hologram">ENTER NOW</a>
        </div>

        <div class="visual-zone">
            <div class="hologram-overlay"></div>
            <img src="jiwoo_profile.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
