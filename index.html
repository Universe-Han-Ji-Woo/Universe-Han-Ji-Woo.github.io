<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #0a0a0c; /* ✨ 더 깊어진 블랙 홀 무드 */
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        .prism-wrapper {
            position: relative;
            width: 100%;
            max-width: 1600px;
            height: 100vh;
            display: flex;
            align-items: center;
        }

        /* 🎬 메인 비주얼 구역 */
        .visual-area {
            position: absolute;
            right: -2%;
            width: 900px;
            z-index: 2;
            
            /* ✨ 강력한 마스크: 사진을 배경 속으로 증발시킴 */
            -webkit-mask-image: radial-gradient(circle at bottom right, black 20%, transparent 85%);
            mask-image: radial-gradient(circle at bottom right, black 20%, transparent 85%);
        }

        .main-img {
            width: 100%;
            height: auto;
            opacity: 0.85;
            filter: contrast(1.1) brightness(1.1);
            /* ✨ 효과 1: 물결치듯 아주 미세하게 일렁이는 효과 */
            animation: waterRipple 6s infinite ease-in-out;
        }

        /* ✨ 효과 2: 사진 위로 쏟아지는 유리 파편 빛 (Prism Fragments) */
        .prism-shards {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                linear-gradient(135deg, transparent 40%, rgba(255,255,255,0.2) 45%, transparent 50%),
                linear-gradient(45deg, transparent 48%, rgba(142,168,201,0.15) 50%, transparent 52%);
            z-index: 3;
            mix-blend-mode: screen;
            animation: shardFlow 4s infinite linear;
        }

        @keyframes waterRipple {
            0%, 100% { transform: scale(1.02) skew(0deg); }
            50% { transform: scale(1.05) skew(1deg); }
        }

        @keyframes shardFlow {
            from { background-position: -500px -500px; }
            to { background-position: 500px 500px; }
        }

        /* ✍️ 타이포그래피: 사진과 겹치는 압도적인 텍스트 */
        .text-stack {
            position: relative;
            z-index: 10;
            margin-left: 6%;
        }

        .huge-bg-text {
            font-size: 15rem; font-weight: 900; color: #ffffff;
            letter-spacing: -15px; line-height: 0.75;
            text-transform: uppercase; margin: 0;
            opacity: 0.04;
            /* ✨ 효과 3: 배경 글자가 숨쉬듯 서서히 깜빡임 */
            animation: textPulse 4s infinite alternate;
        }

        .hero-title {
            position: absolute;
            top: 55%; left: 0;
            transform: translateY(-50%);
        }

        .actor-name-large {
            font-size: 4.5rem; font-weight: 100; color: #8ea8c9;
            letter-spacing: 30px; text-transform: uppercase;
            text-shadow: 0 0 50px rgba(142, 168, 201, 0.5);
        }
        
        @keyframes textPulse {
            from { opacity: 0.02; letter-spacing: -15px; }
            to { opacity: 0.06; letter-spacing: -5px; }
        }

        .enter-btn-prism { 
            display: inline-flex;
            text-decoration: none; width: 340px; height: 65px; 
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(142, 168, 201, 0.05);
            backdrop-filter: blur(5px);
            align-items: center; justify-content: center; 
            font-weight: 800; color: #ffffff; letter-spacing: 10px;
            margin-top: 100px; transition: 0.5s cubic-bezier(0.23, 1, 0.32, 1);
        }
        
        .enter-btn-prism:hover { 
            background: #ffffff; color: #0a0a0c; 
            box-shadow: 0 0 60px rgba(142, 168, 201, 0.4);
            transform: translateY(-5px);
        }

        @media (max-width: 1200px) {
            .huge-bg-text { font-size: 8rem; }
            .actor-name-large { font-size: 2.5rem; letter-spacing: 12px; }
            .visual-area { width: 550px; }
        }
    </style>
</head>
<body>
    
    <div class="prism-wrapper">
        <div class="text-stack">
            <h1 class="huge-bg-text">BEYOND<br>VISION</h1>
            <div class="hero-title">
                <h2 class="actor-name-large">HAN JI WOO</h2>
                <a href="menu.html" class="enter-btn-prism">DISCOVER MORE</a>
            </div>
        </div>

        <div class="visual-area">
            <div class="prism-shards"></div>
            <img src="jiwoo_profile.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
