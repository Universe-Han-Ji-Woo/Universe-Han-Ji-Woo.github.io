<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* ✨ 배경: 레트로 TV 스캔라인 효과 */
            background: #000000; 
            min-height: 100vh;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        /* 🎬 전체 화면 글리치 오버레이 */
        body::after {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: repeating-linear-gradient(0deg, transparent, rgba(255,255,255,0.05) 1px, transparent 2px);
            pointer-events: none; z-index: 100;
        }

        .glitch-stage {
            position: relative;
            width: 100%; max-width: 1600px;
            height: 100vh;
            display: flex; align-items: center;
        }

        /* 🎬 비주얼: 중앙 우측에 레트로 카세트 프레임 */
        .photo-cassette-box {
            position: absolute;
            right: -5%;
            width: 850px;
            z-index: 5;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            /* ✨ 효과 1: 카세트 테이프 같은 둥근 사각형 프레임 */
            border-radius: 50px;
            border: 2px solid rgba(142, 168, 201, 0.3);
            /* ✨ 효과 2: 사진 주위에 은은한 네온 글로우 */
            box-shadow: 0 0 40px rgba(142, 168, 201, 0.3);
        }

        .main-img {
            width: 100%; height: auto; display: block;
            opacity: 0.95;
            /* ✨ 효과 3: 사진 색상이 순간적으로 무지갯빛으로 반전되는 글리치 */
            animation: prismShift 2s infinite step-end;
            -webkit-mask-image: radial-gradient(circle, black 40%, transparent 95%);
        }

        @keyframes prismShift {
            0%, 100% { filter: contrast(1.1) brightness(1.1) hue-rotate(0deg); }
            95% { filter: contrast(1.1) brightness(1.3) hue-rotate(180deg); }
            98% { filter: contrast(2) invert(1); }
        }

        /* ✍️ 타이포그래피: 좌측에 꽉 차게 배치 + 글리치 텍스트 */
        .text-chaos-zone {
            position: relative;
            z-index: 10;
            margin-left: 5%;
        }

        .huge-title-40 {
            font-size: 16rem; font-weight: 900; color: #ffffff;
            letter-spacing: -15px; line-height: 0.75;
            text-transform: uppercase; margin: 0;
            /* ✨ 효과 4: 텍스트 쉐도우 글리치 (민트, 블루 잔상) */
            text-shadow: 10px 10px 0px rgba(142, 168, 201, 0.15);
            animation: shadowPulse 0.5s infinite;
        }

        @keyframes shadowPulse {
            0% { text-shadow: 10px 10px 0px rgba(142, 168, 201, 0.15); }
            50% { text-shadow: -10px 10px 0px rgba(142, 168, 201, 0.15); }
            100% { text-shadow: 10px 10px 0px rgba(142, 168, 201, 0.15); }
        }

        .sub-tag-40 {
            font-size: 5rem; font-weight: 100; color: #8ea8c9;
            letter-spacing: 20px; text-transform: uppercase;
            margin-top: -30px;
            display: inline-block;
            border-left: 15px solid #ffffff;
            padding-left: 20px;
            text-shadow: 0 0 30px rgba(142, 168, 201, 0.3);
        }
        
        .enter-btn-glitch { 
            display: flex;
            text-decoration: none; width: 400px; height: 80px; 
            background: #ffffff; color: #8ea8c9;
            align-items: center; justify-content: center; 
            font-weight: 900; font-size: 1.5rem; letter-spacing: 15px;
            margin-top: 80px; transition: 0.2s;
            clip-path: polygon(5% 0%, 100% 0%, 95% 100%, 0% 100%);
            box-shadow: 0 15px 35px rgba(142, 168, 201, 0.2);
        }
        
        .enter-btn-glitch:hover { 
            background: #8ea8c9; color: #ffffff;
            transform: scale(1.1) skew(-5deg);
            box-shadow: 0 20px 50px rgba(142, 168, 201, 0.4);
        }

        @media (max-width: 1200px) {
            .huge-title-40 { font-size: 8rem; }
            .photo-cassette-box { width: 100%; opacity: 0.4; }
        }
    </style>
</head>
<body>
    
    <div class="glitch-stage">
        <div class="text-chaos-zone">
            <h1 class="huge-title-40">RETRO<br>VIBE</h1>
            <h2 class="sub-tag-40">HAN JI WOO</h2>
            <br>
            <a href="menu.html" class="enter-btn-glitch">ENTER NOW</a>
        </div>

        <div class="photo-cassette-box">
            <img src="jiwoo_profile2.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
