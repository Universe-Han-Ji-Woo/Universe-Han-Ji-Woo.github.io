<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* ✨ 배경: 맑은 물줄기가 느껴지는 청량한 그라데이션 */
            background: radial-gradient(circle at top left, #ffffff, #f0faff, #eef5ff);
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        /* 🎬 효과 1: 공중에 떠다니는 투명한 물방울(Liquid Bubbles) */
        .water-drops {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: 1;
        }
        .drop {
            position: absolute;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            filter: blur(5px);
            animation: bubbleUp 10s infinite linear;
        }

        @keyframes bubbleUp {
            0% { transform: translateY(100vh) scale(0.5); opacity: 0; }
            50% { opacity: 0.5; }
            100% { transform: translateY(-20vh) scale(1.2); opacity: 0; }
        }

        .aquarelle-wrapper {
            position: relative;
            width: 100%; max-width: 1600px;
            height: 100vh;
            display: flex; align-items: center;
        }

        /* 🎬 비주얼: 중앙 우측 배치 & 수채화 마스크 */
        .photo-aquarelle-box {
            position: absolute;
            right: 2%;
            width: 850px;
            z-index: 5;
        }

        .main-img {
            width: 100%; height: auto; display: block;
            opacity: 0.95;
            filter: contrast(1.05) saturate(1.2);
            /* ✨ 얼굴 사수: 중앙은 선명, 외곽은 물감이 번진 듯한 거친 마스크 */
            -webkit-mask-image: radial-gradient(circle, black 35%, rgba(0,0,0,0.5) 60%, transparent 85%);
            mask-image: radial-gradient(circle, black 35%, rgba(0,0,0,0.5) 60%, transparent 85%);
            animation: softWave 8s infinite alternate ease-in-out;
        }

        @keyframes softWave {
            from { transform: scale(1) rotate(-1deg); filter: hue-rotate(0deg); }
            to { transform: scale(1.05) rotate(1deg); filter: hue-rotate(5deg); }
        }

        /* ✍️ 타이포그래피: 좌측에 맑고 시원하게 배치 */
        .text-water-zone {
            position: relative;
            z-index: 20;
            margin-left: 6%;
        }

        .giant-water-txt {
            font-size: 15rem; font-weight: 900; 
            color: #8ea8c9;
            letter-spacing: -12px; line-height: 0.8;
            text-transform: uppercase; margin: 0;
            /* ✨ 효과 2: 글자 안에 흐르는 물결 텍스처 */
            background: linear-gradient(to bottom, #8ea8c9, #ffffff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 10px 20px rgba(142, 168, 201, 0.3));
        }

        .sub-water-label {
            font-size: 4.5rem; font-weight: 100; color: #1a1a1a;
            letter-spacing: 25px; text-transform: uppercase;
            margin-top: 10px;
            opacity: 0.7;
        }
        
        /* 🎬 버튼: 물방울처럼 둥글고 투명한 디자인 */
        .enter-btn-aqua { 
            display: inline-flex;
            text-decoration: none; width: 350px; height: 75px; 
            background: rgba(142, 168, 201, 0.1);
            border: 2px solid #8ea8c9;
            border-radius: 50px; /* 완전 둥글게 */
            align-items: center; justify-content: center; 
            font-weight: 900; color: #8ea8c9; letter-spacing: 12px;
            margin-top: 80px; transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .enter-btn-aqua:hover { 
            background: #8ea8c9; color: #fff;
            transform: scale(1.1);
            box-shadow: 0 20px 40px rgba(142, 168, 201, 0.4);
        }

        @media (max-width: 1200px) {
            .giant-water-txt { font-size: 8rem; }
            .photo-aquarelle-box { width: 100%; opacity: 0.3; }
        }
    </style>
</head>
<body>
    
    <div class="water-drops">
        <div class="drop" style="left: 10%; width: 50px; height: 50px; animation-delay: 0s;"></div>
        <div class="drop" style="left: 30%; width: 80px; height: 80px; animation-delay: 2s;"></div>
        <div class="drop" style="left: 70%; width: 40px; height: 40px; animation-delay: 4s;"></div>
        <div class="drop" style="left: 90%; width: 60px; height: 60px; animation-delay: 1s;"></div>
    </div>

    <div class="aquarelle-wrapper">
        <div class="text-water-zone">
            <h1 class="giant-water-txt">AQUA<br>PURE</h1>
            <h2 class="sub-water-label">HAN JI WOO</h2>
            <a href="menu.html" class="enter-btn-aqua">DIVE IN</a>
        </div>

        <div class="photo-aquarelle-box">
            <img src="jiwoo_profile2.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
