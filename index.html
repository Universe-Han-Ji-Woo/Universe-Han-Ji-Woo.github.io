<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe | 배우 한지우 팬페이지</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>

    <script>
        // 관리자님의 서버 설정
        const firebaseConfig = {
            apiKey: "AIzaSyCD0OaaN1E5uT950X5hkzCBdqT87JQRXrg",
            authDomain: "jiwoo-fanpage.firebaseapp.com",
            projectId: "jiwoo-fanpage",
            storageBucket: "jiwoo-fanpage.firebasestorage.app",
            messagingSenderId: "928634858988",
            appId: "1:928634858988:web:34ae1adf6bab3ad654e4c9"
        };
        
        // 서버 초기화
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        // 로그인 로직
        function handleLogin() {
            const email = document.getElementById('lEmail').value;
            const pw = document.getElementById('lPw').value;

            // 🚨 관리자 비상문
            if (email === "joar6563@naver.com" && pw === "jqhty836ud@%") {
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('userNick', '관리자');
                alert("관리자님 환영합니다!");
                location.href = confirm("확인: 아카이브 / 취소: 게시판") ? "archive.html" : "board.html";
                return;
            }

            auth.signInWithEmailAndPassword(email, pw)
                .then(() => {
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('userNick', '팬');
                    document.getElementById('authModal').style.display = 'none';
                    document.getElementById('deniedMsg').style.display = 'block';
                })
                .catch((err) => alert("정보가 없습니다: " + err.message));
        }

        // 회원가입 로직
        function handleSignup() {
            const email = document.getElementById('sEmail').value;
            const pw = document.getElementById('sPw').value;
            auth.createUserWithEmailAndPassword(email, pw)
                .then(() => { alert("가입 성공! 로그인을 해주세요."); location.reload(); })
                .catch((err) => alert("가입 오류: " + err.message));
        }
    </script>

    <style>
        /* 💡 메인 화면이 안 보일 수 없도록 배경색과 레이아웃 고정 */
        body { margin: 0; padding: 0; background-color: #ffffff !important; color: #000; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .main-content { text-align: center; }
        h1 { font-size: 3rem; margin-bottom: 20px; font-weight: 900; color: #1a1a1a; }
        .btn-entry { padding: 20px 60px; font-size: 1.2rem; background: #000; color: #fff; border: none; cursor: pointer; font-weight: bold; border-radius: 5px; }
        
        /* 모달 스타일 */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100; }
        .card { background: #fff; padding: 40px; border-radius: 15px; width: 300px; text-align: center; }
        input { width: 90%; padding: 12px; margin-bottom: 10px; border: 1px solid #ddd; }
        #deniedMsg { display: none; margin-top: 20px; font-weight: bold; color: red; padding: 15px; border: 1px solid red; }
    </style>
</head>
<body>

    <div class="main-content">
        <h1>UNIVERSE ARCHIVE</h1>
        <button class="btn-entry" onclick="document.getElementById('authModal').style.display='flex'">STAY TUNED</button>
        <div id="deniedMsg">은하가 정렬 중입니다. 오픈을 기다려 주세요!</div>
    </div>

    <div class="modal" id="authModal">
        <div class="card">
            <div id="loginBox">
                <h3>LOGIN</h3>
                <input type="email" id="lEmail" placeholder="이메일">
                <input type="password" id="lPw" placeholder="비밀번호">
                <button style="width:100%; padding:10px; background:#000; color:#fff;" onclick="handleLogin()">로그인</button>
                <p style="font-size:0.8rem; margin-top:15px; cursor:pointer; color:blue;" onclick="document.getElementById('loginBox').style.display='none'; document.getElementById('signBox').style.display='block';">회원가입</p>
            </div>
            <div id="signBox" style="display:none;">
                <h3>JOIN US</h3>
                <input type="email" id="sEmail" placeholder="이메일">
                <input type="password" id="sPw" placeholder="비밀번호">
                <button style="width:100%; padding:10px; background:#000; color:#fff;" onclick="handleSignup()">가입하기</button>
                <p style="font-size:0.8rem; margin-top:15px; cursor:pointer;" onclick="document.getElementById('signBox').style.display='none'; document.getElementById('loginBox').style.display='block';">돌아가기</p>
            </div>
            <button style="margin-top:20px; border:none; background:none; cursor:pointer; text-decoration:underline;" onclick="document.getElementById('authModal').style.display='none'">닫기</button>
        </div>
    </div>

</body>
</html>
