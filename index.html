<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; background: #eef2f6; 
            min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            font-family: 'Apple SD Gothic Neo', sans-serif; overflow-x: hidden;
        }

        /* 🖼️ 깔끔한 평면 원형 프레임 */
        .profile-stage {
            margin-top: 50px;
            margin-bottom: 40px;
        }

        .main-image-container {
            width: 320px; /* 원 크기 */
            height: 320px;
            border-radius: 50%;
            overflow: hidden;
            
            /* 입체감(그림자)을 아예 빼고 아주 얇은 테두리만 주어 깔끔하게! */
            border: 8px solid white; 
            box-shadow: 0 4px 15px rgba(142, 168, 201, 0.1); /* 최소한의 구분감만 유지 */
            
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        /* 이미지가 원 안에 꽉 차도록 설정 */
        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover; /* 비율 유지하며 원형을 꽉 채움 */
        }

        /* 메인 타이틀 */
        .main-title {
            font-size: 2rem; font-weight: 200; color: #8ea8c9;
            letter-spacing: 10px; margin-bottom: 30px;
            text-transform: uppercase;
            text-align: center;
            line-height: 1.4;
        }

        /* BGM 섹션 */
        .bgm-player {
            text-align: center;
            margin-bottom: 40px;
        }
        .bgm-player p {
            font-size: 12px; color: #a5b8d0; 
            letter-spacing: 2px; margin-bottom: 15px;
        }

        /* ENTER 버튼 (평면 스타일과 어울리게 조정) */
        .enter-btn { 
            text-decoration: none; 
            width: 200px; height: 60px; 
            background: white; border-radius: 100px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; color: #8ea8c9; letter-spacing: 3px;
            border: 1px solid #d1d9e6;
            transition: all 0.3s ease; 
            margin-bottom: 40px;
        }

        .enter-btn:hover { 
            background: #8ea8c9;
            color: white;
            transform: translateY(-3px);
        }

        /* 모바일 최적화 */
        @media (max-width: 768px) {
            .main-image-container { 
                width: 240px;
                height: 240px;
            }
            .main-title { font-size: 1.3rem; letter-spacing: 5px; }
        }
    </style>
</head>
<body>
    
    <div class="profile-stage">
        <div class="main-image-container">
            <img src="jiwoo_profile.png" alt="한지우 프로필 사진" class="main-image">
        </div>
    </div>

    <h1 class="main-title">UNIVERSE<br><span style="font-size: 1rem; letter-spacing: 6px; font-weight: 600;">HAN JI WOO</span></h1>

    <div class="bgm-player">
        <p>NOW PLAYING 🎵</p>
        <iframe width="280" height="157" 
            src="https://www.youtube.com/embed/RuRT3B4u5bk" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            style="border-radius: 15px;">
        </iframe>
    </div>
    
    <a href="menu.html" class="enter-btn">ENTER</a>

</body>
</html>
