<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; background: #ffffff; 
            height: 100vh; font-family: 'Arial Black', sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* ✨ 배경 효과 */
        .liquid-bg {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(142, 168, 201, 0.12) 0%, #ffffff 85%);
            z-index: 1;
        }

        .main-container {
            position: relative; width: 100%; height: 100vh;
            display: flex; flex-direction: column; align-items: center; z-index: 10;
        }

        /* 🎬 상단: 타이포 구역 */
        .header-text {
            flex: 0 0 auto; width: 100%; padding-top: 6vh;
            text-align: center; z-index: 30;
        }
        .univ-title {
            font-size: 4.5rem; font-weight: 900; color: #1a1a1a;
            line-height: 0.85; letter-spacing: -3px; text-transform: uppercase; margin: 0;
        }
        .coming-soon-label {
            font-size: 1.5rem; color: #8ea8c9; letter-spacing: 8px;
            margin-top: 12px; text-transform: uppercase; font-weight: 900;
        }

        /* 🎬 중앙: 배우님 비주얼 (절대 사수) */
        .hero-photo-zone {
            flex: 1; width: 100%; display: flex; 
            justify-content: center; align-items: center;
            overflow: hidden; z-index: 20;
        }
        .main-img {
            height: 80%; width: auto; object-fit: contain;
            animation: softPulse 6s infinite alternate ease-in-out;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
        }

        /* 🎬 하단: 버튼 구역 */
        .footer-btn-zone {
            flex: 0 0 auto; width: 100%; height: 12vh;
            display: flex; justify-content: center; align-items: center; z-index: 40;
        }
        .btn-stay {
            cursor: pointer; border: none; width: 85%; height: 55px;
            background: #1a1a1a; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; letter-spacing: 12px; font-size: 0.9rem;
            border-radius: 5px; transition: 0.3s;
        }

        /* 🛑 [핵심] 회원가입 팝업 모달 디자인 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.4); 
            backdrop-filter: blur(15px); /* 유리 질감 */
            display: none; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; transition: 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }

        .signup-card {
            width: 85%; max-width: 400px; padding: 40px 20px;
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(142, 168, 201, 0.3);
            border-radius: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center; position: relative;
        }
        .signup-card h3 { font-size: 2rem; margin-bottom: 25px; color: #1a1a1a; }
        .signup-input {
            width: 90%; padding: 15px; margin-bottom: 15px;
            border: 1px solid #ddd; border-radius: 8px; font-size: 1rem;
            outline: none; transition: 0.3s;
        }
        .signup-input:focus { border-color: #8ea8c9; box-shadow: 0 0 10px rgba(142, 168, 201, 0.2); }
        .btn-submit {
            width: 90%; padding: 15px; background: #1a1a1a; color: #fff;
            border: none; border-radius: 8px; font-weight: 900;
            font-size: 1rem; cursor: pointer; letter-spacing: 5px; margin-top: 10px;
        }
        .close-btn {
            position: absolute; top: 15px; right: 20px; font-size: 1.5rem;
            cursor: pointer; color: #999;
        }

        /* 💻 PC 설정 */
        @media (min-width: 1024px) {
            .univ-title { font-size: 11rem; }
            .btn-stay { width: 450px; height: 75px; }
        }
    </style>
</head>
<body>
    
    <div class="liquid-bg"></div>

    <div class="main-container">
        <div class="header-text">
            <h1 class="univ-title">UNIVERSE<br>ARCHIVE</h1>
            <h2 class="coming-soon-label">COMING SOON</h2>
        </div>

        <div class="hero-photo-zone">
            <img src="jiwoo_profile2.png" alt="배우 한지우" class="main-img">
        </div>

        <div class="footer-btn-zone">
            <button class="btn-stay" onclick="openSignup()">STAY TUNED</button>
        </div>
    </div>

    <div class="modal-overlay" id="signupModal">
        <div class="signup-card">
            <span class="close-btn" onclick="closeSignup()">×</span>
            <h3>JOIN THE UNIVERSE</h3>
            <p style="color:#8ea8c9; font-size:0.8rem; letter-spacing:3px; margin-top:-20px; margin-bottom:30px;">FOR HAN JI WOO</p>
            <form>
                <input type="text" class="signup-input" placeholder="ID">
                <input type="password" class="signup-input" placeholder="PASSWORD">
                <input type="email" class="signup-input" placeholder="EMAIL">
                <button type="button" class="btn-submit" onclick="location.href='welcome.html'">REGISTER</button>
            </form>
        </div>
    </div>

    <script>
        function openSignup() {
            document.getElementById('signupModal').classList.add('active');
            document.getElementById('signupModal').style.display = 'flex';
        }
        function closeSignup() {
            document.getElementById('signupModal').classList.remove('active');
            setTimeout(() => {
                document.getElementById('signupModal').style.display = 'none';
            }, 300);
        }
    </script>

</body>
</html>
