<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; background: #ffffff; 
            height: 100vh; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            overflow: hidden; display: flex; flex-direction: column;
        }

        /* ✨ 배경 효과: 리퀴드 후광 */
        .liquid-bg {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, rgba(142, 168, 204, 0.15) 0%, #ffffff 85%);
            z-index: 1;
        }

        .main-container {
            position: relative; width: 100%; height: 100vh;
            display: flex; flex-direction: column; align-items: center; z-index: 10;
        }

        /* 🎬 상단: 타이포 */
        .header-text {
            flex: 0 0 auto; width: 100%; padding-top: 8vh;
            text-align: center; z-index: 30;
        }
        .univ-title {
            font-family: 'Arial Black', sans-serif;
            font-size: 3.8rem; font-weight: 900; color: #1a1a1a;
            line-height: 0.9; letter-spacing: -2px; text-transform: uppercase; margin: 0;
        }
        .coming-soon-label {
            font-size: 1.2rem; color: #8ea8c9; letter-spacing: 5px;
            margin-top: 10px; font-weight: 900; text-transform: uppercase;
        }

        /* 🎬 중앙: 배우님 (jiwoo_profile3.png) */
        .hero-photo-zone {
            flex: 1; width: 100%; display: flex; 
            justify-content: center; align-items: center;
            overflow: hidden; z-index: 20;
        }
        .main-img {
            height: 80%; width: auto; object-fit: contain;
            animation: softPulse 6s infinite alternate ease-in-out;
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%);
        }

        /* 🎬 하단: 메인 버튼 (STAY TUNED) */
        .footer-btn-zone {
            flex: 0 0 auto; width: 100%; height: 12vh;
            display: flex; justify-content: center; align-items: center; z-index: 40;
        }
        .btn-stay {
            cursor: pointer; border: none; width: 80%; height: 55px;
            background: #1a1a1a; color: #fff;
            display: flex; align-items: center; justify-content: center;
            font-weight: 900; letter-spacing: 10px; font-size: 0.95rem;
            border-radius: 5px; transition: 0.4s; text-transform: uppercase;
        }

        /* 🛑 회원가입 팝업 모달 */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.4); backdrop-filter: blur(25px); 
            display: none; align-items: center; justify-content: center;
            z-index: 100; opacity: 0; transition: 0.3s;
        }
        .modal-overlay.active { display: flex; opacity: 1; }

        .signup-card {
            width: 85%; max-width: 420px; padding: 40px 10px;
            background: rgba(255, 255, 255, 0.95);
            border: 1px solid rgba(142, 168, 201, 0.3);
            border-radius: 25px; box-shadow: 0 30px 60px rgba(0,0,0,0.1);
            text-align: center; position: relative;
        }
        .signup-card h3 { font-size: 2rem; margin-bottom: 20px; color: #1a1a1a; letter-spacing: -1px; }
        .signup-input {
            width: 85%; padding: 15px; margin-bottom: 12px;
            border: 1px solid #eee; border-radius: 10px; font-size: 1rem;
            outline: none; transition: 0.3s; background: #fcfcfc;
        }
        
        /* 팝업 내부 버튼: 회원가입 (한글) */
        .btn-submit {
            width: 85%; padding: 18px; background: #1a1a1a; color: #fff;
            border: none; border-radius: 10px; font-weight: 900;
            font-size: 1.1rem; cursor: pointer; letter-spacing: 4px; margin-top: 15px;
        }
        .close-btn { position: absolute; top: 15px; right: 25px; font-size: 2rem; cursor: pointer; color: #ddd; }

        /* 💻 PC 위치 레이아웃 */
        @media (min-width: 1024px) {
            .main-container { flex-direction: row; align-items: center; }
            .header-text { flex: 1; text-align: left; padding-left: 8%; padding-top: 0; }
            .univ-title { font-size: 11rem; }
            .coming-soon-label { font-size: 2.5rem; letter-spacing: 20px; }
            .hero-photo-zone { flex: 1.5; height: 100%; justify-content: flex-end; }
            .main-img { height: 95%; }
            .footer-btn-zone { position: absolute; bottom: 8vh; left: 8%; width: auto; height: auto; }
            .btn-stay { width: 380px; height: 75px; font-size: 1.2rem; }
        }

        @keyframes softPulse { from { transform: scale(1); } to { transform: scale(1.04); } }
    </style>
</head>
<body>
    
    <div class="liquid-bg"></div>

    <div class="main-container">
        <div class="header-text">
            <h1 class="univ-title">UNIVERSE<br>ARCHIVE</h1>
            <h2 class="coming-soon-label">COMING SOON</h2>
        </div>

        <div class="hero-photo-zone">
            <img src="jiwoo_profile3.png" alt="배우 한지우" class="main-img">
        </div>

        <div class="footer-btn-zone">
            <button class="btn-stay" onclick="openSignup()">STAY TUNED</button>
        </div>
    </div>

    <div class="modal-overlay" id="signupModal">
        <div class="signup-card">
            <span class="close-btn" onclick="closeSignup()">×</span>
            <h3>JOIN THE UNIVERSE</h3>
            <p style="color:#8ea8c9; font-size:0.8rem; letter-spacing:3px; margin-top:-15px; margin-bottom:25px; font-weight:bold;">FOR HAN JI WOO</p>
            <form id="signupForm">
                <input type="text" class="signup-input" placeholder="ID">
                <input type="password" class="signup-input" placeholder="PASSWORD">
                <input type="text" class="signup-input" placeholder="NICKNAME">
                <input type="email" class="signup-input" placeholder="EMAIL">
                <button type="button" class="btn-submit" onclick="closeSignup()">회원가입</button>
            </form>
        </div>
    </div>

    <script>
        function openSignup() {
            const modal = document.getElementById('signupModal');
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }
        function closeSignup() {
            const modal = document.getElementById('signupModal');
            modal.classList.remove('active');
            setTimeout(() => modal.style.display = 'none', 300);
            // 가입 후 폼 초기화 (선택 사항)
            document.getElementById('signupForm').reset();
        }
    </script>
</body>
</html>
