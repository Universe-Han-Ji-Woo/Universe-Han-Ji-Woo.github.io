<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universe | 배우 한지우 팬페이지</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCD0OaaN1E5uT950X5hkzCBdqT87JQRXrg",
            authDomain: "jiwoo-fanpage.firebaseapp.com",
            databaseURL: "https://jiwoo-fanpage-default-rtdb.firebaseio.com", 
            projectId: "jiwoo-fanpage",
            storageBucket: "jiwoo-fanpage.firebasestorage.app",
            messagingSenderId: "928634858988",
            appId: "1:928634858988:web:34ae1adf6bab3ad654e4c9"
        };
        firebase.initializeApp(firebaseConfig);
        
        const auth = firebase.auth();
        const db = firebase.database();

        // 📊 실시간 탐사 중 (접속자)
        function trackOnlineUsers() {
            const connectedRef = db.ref(".info/connected");
            const onlineRef = db.ref("online_users").push();

            connectedRef.on("value", (snap) => {
                if (snap.val() === true) {
                    onlineRef.set(true);
                    onlineRef.onDisconnect().remove();
                }
            });

            db.ref("online_users").on("value", (snap) => {
                const count = snap.numChildren() || 0;
                document.getElementById('onlineCount').innerText = `${count}명 실시간 탐사 중`;
            });
        }

        // 📊 [자동화 수정] 유니버스 입성 (DB에서 실시간 가입자 수 불러오기)
        function updateTotalFans() {
            const fanCountRef = db.ref('total_fan_count');
            fanCountRef.on('value', (snapshot) => {
                const count = snapshot.val() || 0;
                document.getElementById('userCount').innerText = `${count.toLocaleString()}명 지우 유니버스 입성`;
            });
        }

        window.onload = () => {
            trackOnlineUsers();
            updateTotalFans();
            
            const nick = sessionStorage.getItem('userNick');
            if(nick) document.getElementById('nickBadge').innerText = nick;
        };

        function handleLogin() {
            const email = document.getElementById('lEmail').value;
            const pw = document.getElementById('lPw').value;
            
            if (email === "joar6563@naver.com" && pw === "jqhty836ud@%") {
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('userNick', 'ADMIN');
                location.href = confirm("관리자님 환영합니다!") ? "archive.html" : "board.html";
                return;
            }
            auth.signInWithEmailAndPassword(email, pw).then(() => {
                sessionStorage.setItem('isLoggedIn', 'true');
                sessionStorage.setItem('userNick', 'FAN');
                document.getElementById('nickBadge').innerText = "FAN";
                closeAuth();
                alert("로그인되었습니다. 오픈까지 조금만 기다려주세요!");
            }).catch(() => alert("가입 정보가 없거나 비밀번호가 틀렸습니다."));
        }

        // 📊 [자동화 수정] 회원가입 시 DB 숫자 +1 처리
        function handleSignup() {
            const email = document.getElementById('sEmail').value;
            const pw = document.getElementById('sPw').value;
            
            auth.createUserWithEmailAndPassword(email, pw).then(() => {
                // ✨ 가입 성공 즉시 DB 카운트 올리기
                db.ref('total_fan_count').transaction((currentCount) => {
                    return (currentCount || 0) + 1;
                });
                
                alert("지우 유니버스 입성을 환영합니다! 로그인을 진행해 주세요."); 
                location.reload();
            }).catch((err) => alert(err.message));
        }

        function openAuth() { document.getElementById('authModal').classList.add('active'); document.getElementById('authModal').style.display = 'flex'; }
        function closeAuth() { document.getElementById('authModal').classList.remove('active'); setTimeout(() => document.getElementById('authModal').style.display = 'none', 400); }
    </script>

    <style>
        body { margin: 0; padding: 0; background: #ffffff; height: 100vh; font-family: 'Apple SD Gothic Neo', sans-serif; overflow: hidden; }
        .liquid-bg { position: absolute; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, rgba(142, 168, 204, 0.15) 0%, #ffffff 85%); z-index: 1; }
        .main-container { position: relative; width: 100%; height: 100vh; display: flex; flex-direction: column; align-items: center; z-index: 10; }
        .header-text { padding-top: 8vh; text-align: center; }
        .univ-title { font-family: 'Arial Black', sans-serif; font-size: 3.8rem; font-weight: 900; color: #1a1a1a; line-height: 0.9; letter-spacing: -2px; text-transform: uppercase; margin: 0; }
        .coming-soon-label { font-size: 1.2rem; color: #8ea8c9; letter-spacing: 5px; margin-top: 10px; font-weight: 900; }
        .hero-photo-zone { flex: 1; display: flex; justify-content: center; align-items: center; overflow: hidden; }
        .main-img { height: 85%; animation: softPulse 6s infinite alternate ease-in-out; -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 15%, black 85%, transparent 100%); }
        .footer-btn-zone { height: 15vh; display: flex; justify-content: center; align-items: center; }
        .btn-stay { cursor: pointer; border: none; width: 80%; max-width: 320px; height: 55px; background: #1a1a1a; color: #fff; font-weight: 900; letter-spacing: 8px; border-radius: 5px; text-transform: uppercase; }

        #statusZone { 
            display: flex; 
            position: fixed; 
            right: 25px; 
            top: 25px; 
            flex-direction: column; 
            align-items: flex-end; 
            z-index: 100;
        }
        .nick-box { font-size: 0.6rem; border: 1px solid #1a1a1a; padding: 2px 6px; font-weight: bold; background: #fff; margin-bottom: 6px; letter-spacing: 1px; }
        .status-msg { font-size: 0.75rem; font-weight: bold; color: #1a1a1a; margin-bottom: 4px; border-bottom: 1px solid #eee; padding-bottom: 2px; }
        .count-info { font-size: 0.65rem; color: #888; text-align: right; margin-top: 2px; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.4); backdrop-filter: blur(25px); display: none; align-items: center; justify-content: center; z-index: 500; opacity: 0; transition: 0.3s; }
        .modal-overlay.active { display: flex; opacity: 1; }
        .auth-card { width: 85%; max-width: 400px; padding: 40px 10px; background: #fff; border-radius: 25px; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,0.1); }
        .auth-input { width: 80%; padding: 15px; margin-bottom: 12px; border: 1px solid #eee; border-radius: 10px; font-size: 1rem; }
        .btn-submit { width: 85%; padding: 15px; background: #1a1a1a; color: #fff; border: none; border-radius: 10px; font-weight: 900; cursor: pointer; }
        @keyframes softPulse { from { transform: scale(1); } to { transform: scale(1.04); } }
    </style>
</head>
<body>
    <div class="liquid-bg"></div>
    <div class="main-container">
        <div class="header-text"><h1 class="univ-title">UNIVERSE<br>ARCHIVE</h1><h2 class="coming-soon-label">COMING SOON</h2></div>
        <div class="hero-photo-zone"><img src="jiwoo_profile3.png" alt="Han Ji Woo" class="main-img"></div>
        <div class="footer-btn-zone"><button class="btn-stay" onclick="openAuth()">STAY TUNED</button></div>
    </div>

    <div id="statusZone">
        <div class="nick-box" id="nickBadge">VISITOR</div>
        <div class="status-msg">오픈 준비 중</div>
        <div class="count-info" id="userCount">로딩 중...</div>
        <div class="count-info" id="onlineCount">실시간 탐사 준비 중...</div>
    </div>

    <div class="modal-overlay" id="authModal">
        <div class="auth-card">
            <div id="loginBox">
                <h3>LOGIN</h3>
                <input type="email" id="lEmail" class="auth-input" placeholder="이메일">
                <input type="password" id="lPw" class="auth-input" placeholder="비밀번호">
                <button class="btn-submit" onclick="handleLogin()">로그인</button>
                <p style="margin-top:20px; font-size:0.8rem;">계정이 없나요? <span onclick="document.getElementById('loginBox').style.display='none'; document.getElementById('signBox').style.display='block';" style="color:#8ea8c9; cursor:pointer; font-weight:bold;">회원가입</span></p>
            </div>
            <div id="signBox" style="display:none;">
                <h3>JOIN US</h3>
                <input type="email" id="sEmail" class="auth-input" placeholder="이메일">
                <input type="password" id="sPw" class="auth-input" placeholder="비밀번호">
                <button class="btn-submit" onclick="handleSignup()">가입하기</button>
            </div>
            <button style="margin-top:20px; border:none; background:none; text-decoration:underline; cursor:pointer; color:#999;" onclick="closeAuth()">닫기</button>
        </div>
    </div>
</body>
</html>
