<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #eef2f6; /* 배경색 고정 */
            min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            font-family: 'Apple SD Gothic Neo', sans-serif;
        }

        /* 🎬 이미지 경계선을 '삭제'하는 메인 컨테이너 */
        .fade-wrapper {
            position: relative;
            width: 100%;
            max-width: 500px;
            margin-top: 40px;
            line-height: 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .main-image {
            width: 85%; /* 컨테이너보다 작게 설정해서 블러 공간 확보 */
            height: auto;
            /* 1. 이미지 자체의 모서리 각진 선을 부드럽게 뭉갭니다 */
            filter: blur(0.5px); 
        }

        /* ✨ 필살기: 5중 그라데이션 마스크 (상하좌우 경계선을 안개로 덮음) */
        .fade-wrapper::after {
            content: '';
            position: absolute;
            top: -2px; left: -2px; right: -2px; bottom: -2px;
            /* 중앙(지우 배우님 얼굴)은 투명하게 비우고, 
               가장자리로 갈수록 배경색(#eef2f6)을 겹겹이 쌓아 
               사진의 네모난 끝선을 아예 '지워' 버립니다.
            */
            background: 
                radial-gradient(circle at center, transparent 20%, #eef2f6 85%),
                linear-gradient(to right, #eef2f6 0%, transparent 20%, transparent 80%, #eef2f6 100%),
                linear-gradient(to bottom, #eef2f6 0%, transparent 20%, transparent 80%, #eef2f6 100%);
            pointer-events: none;
        }

        /* 타이틀 및 버튼 */
        .main-title {
            font-size: 2rem; font-weight: 200; color: #8ea8c9;
            letter-spacing: 12px; margin-top: 30px;
            text-transform: uppercase; text-align: center;
        }
        
        .enter-btn { 
            text-decoration: none; width: 220px; height: 70px; 
            background: white; border-radius: 50px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; color: #8ea8c9; letter-spacing: 5px;
            box-shadow: 20px 20px 40px #d1d9e6, -20px -20px 40px #ffffff; 
            margin-top: 40px; transition: 0.3s;
        }
    </style>
</head>
<body>
    
    <div class="fade-wrapper">
        <img src="jiwoo_profile.png" alt="한지우" class="main-image">
    </div>

    <h1 class="main-title">UNIVERSE<br><span style="font-size: 1rem; letter-spacing: 8px; font-weight: 600;">HAN JI WOO</span></h1>

    <a href="menu.html" class="enter-btn">ENTER</a>

</body>
</html>
