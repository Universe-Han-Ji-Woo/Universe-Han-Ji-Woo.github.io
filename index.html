<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #ffffff; 
            min-height: 100vh;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        /* 🎬 효과 1: 배경에 흐르는 거대 리퀴드 쉐이프 (진짜 움직임) */
        .liquid-bg {
            position: absolute;
            width: 800px; height: 800px;
            background: linear-gradient(45deg, rgba(142, 168, 201, 0.1), rgba(255, 255, 255, 0.5));
            filter: blur(80px);
            border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%;
            animation: liquidMorph 12s infinite alternate ease-in-out;
            z-index: 1;
        }

        @keyframes liquidMorph {
            0% { border-radius: 40% 60% 70% 30% / 40% 50% 60% 50%; transform: translate(-10%, -10%) rotate(0deg); }
            100% { border-radius: 60% 40% 30% 70% / 60% 30% 70% 40%; transform: translate(10%, 10%) rotate(180deg); }
        }

        .motion-wrapper {
            position: relative;
            width: 100%; max-width: 1600px;
            height: 100vh;
            display: flex; align-items: center;
        }

        /* 🎬 비주얼: 중앙 우측 배치 & 리퀴드 디스토션 효과 */
        .photo-motion-box {
            position: absolute;
            right: 0%;
            width: 850px;
            z-index: 10;
        }

        .main-img {
            width: 100%; height: auto; display: block;
            /* ✨ 얼굴 사수: 중앙은 냅두고 외곽만 울렁거리게 마스킹 */
            -webkit-mask-image: radial-gradient(circle, black 30%, transparent 90%);
            /* ✨ 효과 2: 하이퍼 줌 & 웨이브 모션 */
            animation: hyperWave 5s infinite ease-in-out;
        }

        @keyframes hyperWave {
            0%, 100% { transform: scale(1) skew(0deg); filter: brightness(1); }
            50% { transform: scale(1.08) skew(1deg); filter: brightness(1.1); }
        }

        /* ✍️ 타이포그래피: 사진을 뚫고 나오는 입체 배치 */
        .text-motion-zone {
            position: relative;
            z-index: 20;
            margin-left: 5%;
        }

        .mega-kinetic-txt {
            font-size: 14rem; font-weight: 900; color: #1a1a1a;
            letter-spacing: -12px; line-height: 0.8;
            text-transform: uppercase; margin: 0;
            /* ✨ 효과 3: 글자 뒷부분에 반짝이는 크롬 광택 */
            background: linear-gradient(to bottom, #1a1a1a 40%, #8ea8c9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: textFloat 3s infinite alternate ease-in-out;
        }

        @keyframes textFloat {
            from { transform: translateX(-20px); opacity: 0.8; }
            to { transform: translateX(0); opacity: 1; }
        }

        .sub-motion-label {
            font-size: 5rem; font-weight: 100; color: #8ea8c9;
            letter-spacing: 20px; text-transform: uppercase;
            margin-top: 10px;
            animation: blink 2s infinite;
        }

        @keyframes blink {
            50% { opacity: 0.3; }
        }
        
        /* 🎬 버튼: 마우스 올리면 좌우로 늘어나는 인터랙티브 디자인 */
        .enter-btn-motion { 
            display: inline-flex;
            text-decoration: none; width: 300px; height: 70px; 
            background: #1a1a1a; color: #fff;
            align-items: center; justify-content: center; 
            font-weight: 900; font-size: 1.2rem; letter-spacing: 15px;
            margin-top: 80px; transition: 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        
        .enter-btn-motion:hover { 
            width: 450px;
            background: #8ea8c9;
            letter-spacing: 25px;
        }

        @media (max-width: 1200px) {
            .mega-kinetic-txt { font-size: 7rem; }
            .photo-motion-box { width: 100%; opacity: 0.3; }
        }
    </style>
</head>
<body>
    
    <div class="liquid-bg"></div>

    <div class="motion-wrapper">
        <div class="text-motion-zone">
            <h1 class="mega-kinetic-txt">FLOW<br>SPACE</h1>
            <h2 class="sub-motion-label">HAN JI WOO</h2>
            <a href="menu.html" class="enter-btn-motion">ENTER</a>
        </div>

        <div class="photo-motion-box">
            <img src="jiwoo_profile2.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
