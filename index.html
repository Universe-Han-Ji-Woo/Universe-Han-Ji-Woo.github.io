<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #eef2f6; /* 배경색 유지 */
            min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            font-family: 'Apple SD Gothic Neo', sans-serif; overflow-x: hidden;
        }

        /* ✨ 초강력 블러 마스크 효과 */
        .profile-stage {
            margin-top: 50px;
            margin-bottom: 30px;
            position: relative;
            display: inline-block;
            
            /* 중심부(40%)는 선명하게, 
               그 이후부터 서서히 흐려져서 85% 지점부터는 아예 투명하게 날려버립니다.
            */
            -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,1) 30%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0) 85%);
            mask-image: radial-gradient(circle, rgba(0,0,0,1) 30%, rgba(0,0,0,0.5) 60%, rgba(0,0,0,0) 85%);
        }

        .main-image-container {
            width: 350px; /* 블러가 퍼질 공간을 위해 크기를 살짝 키움 */
            height: 350px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .main-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 이미지 자체에도 미세한 블러를 가장자리에만 줘서 
               배경색(#eef2f6)과 더 찰떡같이 붙게 만듭니다. 
            */
            filter: drop-shadow(0 0 10px #eef2f6); 
        }

        .main-title {
            font-size: 2.2rem; font-weight: 200; color: #8ea8c9;
            letter-spacing: 12px; margin-bottom: 30px;
            text-transform: uppercase; text-align: center;
        }

        .bgm-player { text-align: center; margin-bottom: 40px; }
        
        .enter-btn { 
            text-decoration: none; width: 220px; height: 75px; 
            background: #eef2f6; border-radius: 40px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; color: #8ea8c9; letter-spacing: 5px;
            box-shadow: 15px 15px 30px #d1d9e6, -15px -15px 30px #ffffff; 
            transition: all 0.3s ease;
        }
    </style>
</head>
<body>
    
    <div class="profile-stage">
        <div class="main-image-container">
            <img src="jiwoo_profile.png" alt="한지우" class="main-image">
        </div>
    </div>

    <h1 class="main-title">UNIVERSE<br><span style="font-size: 1.2rem; letter-spacing: 8px;">HAN JI WOO</span></h1>

    <div class="bgm-player">
        <iframe width="280" height="157" src="https://www.youtube.com/embed/RuRT3B4u5bk" frameborder="0" style="border-radius: 20px;"></iframe>
    </div>
    
    <a href="menu.html" class="enter-btn">ENTER</a>

</body>
</html>
