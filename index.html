<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #ffffff; 
            min-height: 100vh;
            font-family: 'Arial Black', sans-serif;
            overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }

        /* 🎬 효과 1: 배경 전체를 흐르는 무한 루프 타이포그래피 (Marquee) */
        .bg-marquee-container {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex; flex-direction: column;
            justify-content: space-around;
            opacity: 0.04; /* 아주 은은하게 */
            pointer-events: none;
            z-index: 1;
        }

        .marquee-line {
            font-size: 15rem; white-space: nowrap;
            animation: marqueeMove 20s linear infinite;
        }
        .line-reverse { animation: marqueeMove 25s linear infinite reverse; }

        @keyframes marqueeMove {
            from { transform: translateX(0); }
            to { transform: translateX(-50%); }
        }

        .kinetic-wrapper {
            position: relative;
            width: 100%; max-width: 1600px;
            height: 100vh;
            display: flex; align-items: center; justify-content: center;
        }

        /* 🎬 비주얼: 중앙에 가장 고화질로 배치 (효과 최소화) */
        .photo-prime-box {
            position: relative;
            width: 750px;
            z-index: 10;
            filter: drop-shadow(0 30px 60px rgba(0,0,0,0.1));
        }

        .main-img {
            width: 100%; height: auto; display: block;
            /* ✨ 화질 우선: 필터나 마스크를 최소화하여 선명도 유지 */
            border-radius: 10px;
            animation: primeFloat 4s infinite alternate ease-in-out;
        }

        @keyframes primeFloat {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }

        /* ✍️ 타이포그래피: 사진과 겹치는 레이어드 디자인 */
        .front-text-overlay {
            position: absolute;
            bottom: 15%; left: 5%;
            z-index: 20;
        }

        .bold-main-title {
            font-size: 14rem; font-weight: 900; color: #1a1a1a;
            letter-spacing: -10px; line-height: 0.8;
            text-transform: uppercase; margin: 0;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff, 1px 1px 0 #fff; /* 사진 위에서도 잘 보이게 외곽선 */
        }

        .side-label {
            position: absolute;
            top: 20%; right: 5%;
            writing-mode: vertical-rl; /* 세로 쓰기 */
            font-size: 1.5rem; letter-spacing: 15px; color: #8ea8c9;
            font-weight: 900; border-left: 2px solid #8ea8c9; padding-left: 10px;
        }
        
        /* 🎬 버튼: 볼드하고 직관적인 디자인 */
        .enter-btn-bold { 
            display: inline-flex;
            text-decoration: none; width: 400px; height: 80px; 
            background: #1a1a1a; color: #fff;
            align-items: center; justify-content: center; 
            font-weight: 900; font-size: 1.4rem; letter-spacing: 12px;
            margin-top: 50px; transition: 0.4s;
            border: 2px solid #1a1a1a;
        }
        
        .enter-btn-bold:hover { 
            background: transparent; color: #1a1a1a;
            transform: scale(1.05);
        }

        @media (max-width: 1200px) {
            .bold-main-title { font-size: 7rem; }
            .photo-prime-box { width: 90%; }
            .side-label { display: none; }
        }
    </style>
</head>
<body>
    
    <div class="bg-marquee-container">
        <div class="marquee-line">HAN JI WOO UNIVERSE HAN JI WOO UNIVERSE</div>
        <div class="marquee-line line-reverse">JIWOO ARCHIVE 2026 JIWOO ARCHIVE 2026</div>
        <div class="marquee-line">HAN JI WOO UNIVERSE HAN JI WOO UNIVERSE</div>
    </div>

    <div class="kinetic-wrapper">
        <div class="side-label">EST. 2026 / FAN PAGE</div>

        <div class="front-text-overlay">
            <h1 class="bold-main-title">TRUE<br>ICON</h1>
            <a href="menu.html" class="enter-btn-bold">VIEW GALLERY</a>
        </div>

        <div class="photo-prime-box">
            <img src="jiwoo_profile2.png" alt="한지우" class="main-img">
        </div>
    </div>

</body>
</html>
