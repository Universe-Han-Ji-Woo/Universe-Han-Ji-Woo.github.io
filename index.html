<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #eef2f6; 
            min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            font-family: 'Apple SD Gothic Neo', sans-serif;
        }

        .ghost-stage {
            position: relative;
            width: 100%;
            max-width: 800px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ✨ 상하 안개 레이어: 얼굴에 닿지 않게 범위를 조절했습니다 */
        .ghost-stage::before, .ghost-stage::after {
            content: '';
            position: absolute;
            left: 0; right: 0;
            /* 안개 두께를 150px에서 100px로 줄여 얼굴 침범 방지 */
            height: 100px; 
            z-index: 10;
            pointer-events: none;
        }

        /* 상단: 위쪽 테두리 선만 딱 가리고 앞머리 직전에 투명해짐 */
        .ghost-stage::before {
            top: 0;
            background: linear-gradient(to bottom, #eef2f6 5%, rgba(238, 242, 246, 0.8) 15%, transparent 100%);
        }

        /* 하단: 아래쪽 테두리 선만 딱 가리고 턱 라인 아래에서 투명해짐 */
        .ghost-stage::after {
            bottom: 0;
            background: linear-gradient(to top, #eef2f6 5%, rgba(238, 242, 246, 0.8) 15%, transparent 100%);
        }

        .main-image {
            width: 550px; /* PC 황금 사이즈 */
            height: auto;
            display: block;
            
            /* 마스크 수치를 조정해 얼굴 부분은 100% 선명하게 노출 */
            -webkit-mask-image: linear-gradient(
                to bottom, 
                transparent 0%, 
                black 12%,   /* 12% 지점부터 선명 (상단 선 삭제) */
                black 88%,   /* 88% 지점까지 선명 (하단 선 삭제) */
                transparent 100%
            );
            mask-image: linear-gradient(
                to bottom, 
                transparent 0%, 
                black 12%, 
                black 88%, 
                transparent 100%
            );
            
            filter: contrast(1.02) brightness(1.01);
        }

        .main-title {
            font-size: 2.5rem; font-weight: 200; color: #8ea8c9;
            letter-spacing: 15px; margin-top: 30px;
            text-transform: uppercase; text-align: center;
        }
        
        .enter-btn { 
            text-decoration: none; width: 220px; height: 75px; 
            background: white; border-radius: 50px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; color: #8ea8c9; letter-spacing: 5px;
            box-shadow: 20px 20px 40px #d1d9e6, -20px -20px 40px #ffffff; 
            margin-top: 50px; transition: 0.3s;
        }

        @media (max-width: 768px) {
            .main-image { width: 320px; }
            .ghost-stage::before, .ghost-stage::after { height: 60px; }
        }
    </style>
</head>
<body>
    
    <div class="ghost-stage">
        <img src="jiwoo_profile.png" alt="한지우" class="main-image">
    </div>

    <h1 class="main-title">UNIVERSE<br><span style="font-size: 1.1rem; letter-spacing: 10px; font-weight: 600;">HAN JI WOO</span></h1>

    <a href="menu.html" class="enter-btn">ENTER</a>

</body>
</html>
