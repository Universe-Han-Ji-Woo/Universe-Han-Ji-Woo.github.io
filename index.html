<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            /* ✨ 배경색: 깊고 묵직한 다크 차콜 (고급스러운 무게감) */
            background: #1a1c1e; 
            min-height: 100vh;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
        }

        /* 🎬 시네마틱 무대 */
        .cinema-stage {
            position: relative;
            width: 100%;
            max-width: 1000px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ✨ 사진 뒤에서 은은하게 퍼지는 후광 (경계선 소멸 장치) */
        .cinema-stage::before {
            content: '';
            position: absolute;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(142, 168, 201, 0.15) 0%, transparent 70%);
            z-index: 0;
        }

        .photo-frame {
            position: relative;
            z-index: 1;
            /* 위아래 경계선을 어둠 속으로 녹여버리는 강력한 마스크 */
            -webkit-mask-image: linear-gradient(
                to bottom, 
                transparent 0%, 
                black 25%, 
                black 75%, 
                transparent 100%
            );
            mask-image: linear-gradient(
                to bottom, 
                transparent 0%, 
                black 25%, 
                black 75%, 
                transparent 100%
            );
        }

        .main-image {
            width: 600px; /* 이번엔 중앙에서 압도적인 크기로 */
            height: auto;
            display: block;
            /* 다크 무드에 맞춘 대비/밝기 조정 */
            filter: contrast(1.1) brightness(0.95) saturate(1.1);
        }

        /* ✍️ 타이포: 어둠 속에서 빛나는 메탈릭 실버 톤 */
        .text-overlay {
            position: absolute;
            width: 100%;
            text-align: center;
            bottom: -60px; /* 사진 하단 경계선 위치에 배치 */
            z-index: 10;
        }

        .main-title {
            font-size: 3.5rem; font-weight: 100; color: #d1d9e6;
            letter-spacing: 25px; text-transform: uppercase;
            text-shadow: 0 0 20px rgba(255,255,255,0.2);
            margin: 0;
        }

        .enter-btn { 
            display: inline-flex;
            text-decoration: none; width: 240px; height: 1px; /* 선 하나로 시작하는 미니멀리즘 */
            background: #4a4d52; 
            margin-top: 80px;
            position: relative;
            transition: 0.5s;
        }
        
        /* 버튼 텍스트 */
        .enter-btn::after {
            content: 'ENTER PROJECT';
            position: absolute;
            top: -30px; left: 50%;
            transform: translateX(-50%);
            color: #8ea8c9; font-size: 0.8rem; letter-spacing: 8px; font-weight: 600;
            white-space: nowrap;
        }

        .enter-btn:hover { background: #8ea8c9; box-shadow: 0 0 20px rgba(142, 168, 201, 0.5); }

        @media (max-width: 768px) {
            .main-image { width: 320px; }
            .main-title { font-size: 1.8rem; letter-spacing: 12px; }
        }
    </style>
</head>
<body>
    
    <div class="cinema-stage">
        <div class="photo-frame">
            <img src="jiwoo_profile.png" alt="한지우" class="main-image">
        </div>

        <div class="text-overlay">
            <h1 class="main-title">UNIVERSE</h1>
        </div>
    </div>

    <a href="menu.html" class="enter-btn"></a>

</body>
</html>
