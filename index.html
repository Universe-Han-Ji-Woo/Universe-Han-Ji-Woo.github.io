<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; background: #eef2f6; 
            min-height: 100vh; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; 
            font-family: 'Apple SD Gothic Neo', sans-serif; overflow-x: hidden;
        }

        /* 3D 입체 원형 프로필 컨테이너 */
        .profile-stage {
            perspective: 1000px; /* 3D 효과를 위한 원근감 설정 */
            margin-top: 60px;
            margin-bottom: 40px;
        }

        .main-image-container {
            width: 350px; /* 원의 크기 */
            height: 350px;
            border-radius: 50%; /* 완벽한 원형 */
            overflow: hidden; /* 원 밖으로 나가는 사진 자르기 */
            
            /* 입체감을 주는 여러 겹의 그림자 (Neumorphism + Drop Shadow) */
            box-shadow: 
                /* 바깥쪽 부드러운 그림자 */
                20px 20px 60px #d1d9e6, 
                -20px -20px 60px #ffffff,
                /* 안쪽으로 살짝 파인 듯한 입체감 */
                inset 10px 10px 20px rgba(0,0,0,0.05),
                inset -10px -10px 20px rgba(255,255,255,0.5);
                
            border: 15px solid #eef2f6; /* 배경과 같은 색의 두꺼운 테두리로 융합 효과 */
            transition: transform 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* 마우스 올렸을 때 살짝 기울어지는 3D 효과 */
        .profile-stage:hover .main-image-container {
            transform: rotateX(10deg) rotateY(10deg);
        }

        /* 실제 이미지 스타일 */
        .main-image {
            width: 110%; /* 원을 꽉 채우기 위해 살짝 크게 */
            height: auto;
            transform: scale(1.1); /* 약간 확대해서 여백 없앰 */
            object-fit: cover; /* 비율 유지하며 채움 */
        }

        /* 메인 타이틀 */
        .main-title {
            font-size: 2.2rem; font-weight: 200; color: #8ea8c9;
            letter-spacing: 12px; margin-bottom: 30px;
            text-transform: uppercase;
            text-align: center;
        }

        /* BGM 섹션 스타일 */
        .bgm-player {
            text-align: center;
            margin-bottom: 40px;
        }
        .bgm-player p {
            font-size: 13px; color: #a5b8d0; 
            letter-spacing: 2px; margin-bottom: 15px;
        }

        /* ENTER 버튼 */
        .enter-btn { 
            text-decoration: none; 
            width: 220px; height: 80px; 
            background: #eef2f6; border-radius: 40px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; color: #8ea8c9; letter-spacing: 5px;
            box-shadow: 15px 15px 30px #d1d9e6, -15px -15px 30px #ffffff; 
            transition: all 0.3s ease; 
            margin-bottom: 40px;
        }

        .enter-btn:hover { 
            box-shadow: inset 8px 8px 16px #d1d9e6, inset -8px -8px 16px #ffffff; 
            transform: scale(0.98); 
        }

        /* 모바일 최적화 (768px 이하) */
        @media (max-width: 768px) {
            body { justify-content: flex-start; } 
            
            .main-image-container { 
                width: 250px; /* 모바일에서는 원 크기를 줄임 */
                height: 250px;
                margin-top: 40px; 
                border: 10px solid #eef2f6;
            }
            
            .main-title { 
                font-size: 1.4rem; 
                letter-spacing: 6px; 
                margin-bottom: 25px; 
            }

            .bgm-player iframe {
                width: 240px; 
                height: 135px;
            }

            .enter-btn {
                width: 180px;
                height: 65px;
                font-size: 0.9rem;
            }
        }
    </style>
</head>
<body>
    
    <div class="profile-stage">
        <div class="main-image-container">
            <img src="jiwoo_profile.png" alt="한지우 입체 프로필 사진" class="main-image">
        </div>
    </div>

    <h1 class="main-title">UNIVERSE<br><span style="font-size: 1.2rem; letter-spacing: 8px;">HAN JI WOO</span></h1>

    <div class="bgm-player">
        <p>NOW PLAYING 🎵</p>
        <iframe width="280" height="157" 
            src="https://www.youtube.com/embed/RuRT3B4u5bk" 
            frameborder="0" 
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
            style="border-radius: 20px; box-shadow: 0 10px 30px rgba(165, 184, 208, 0.1);">
        </iframe>
    </div>
    
    <a href="menu.html" class="enter-btn">ENTER</a>
</body>
</html>
