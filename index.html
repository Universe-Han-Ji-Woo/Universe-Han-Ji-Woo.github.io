<!DOCTYPE html>
<html lang="ko">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta charset="UTF-8">
    <title>Universe | 배우 한지우 팬페이지</title>
    <style>
        body { 
            margin: 0; padding: 0; 
            background: #eef2f6; 
            min-height: 200vh; /* 스크롤 느낌을 위해 높이 확보 */
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow-x: hidden;
        }

        /* 🎬 메이저 홈마들의 시그니처: 화면 중앙 고정 스테이지 */
        .main-stage {
            position: fixed; /* 사진을 화면에 고정 */
            top: 50%; left: 50%;
            transform: translate(-50%, -55%);
            width: 100%;
            max-width: 900px;
            z-index: 1;
        }

        .main-image {
            width: 550px; /* 쫌좀님이 말씀하신 그 크기 */
            display: block;
            margin: 0 auto;
            
            /* ✨ 핵심: 이중 마스크 페더링
               얼굴과 앞머리는 건드리지 않고(20%~80%), 
               상단과 하단 끝자락만 0% 투명도로 완전히 날려버립니다.
            */
            -webkit-mask-image: linear-gradient(
                to bottom, 
                transparent 0%, 
                black 20%, 
                black 80%, 
                transparent 100%
            );
            mask-image: linear-gradient(
                to bottom, 
                transparent 0%, 
                black 20%, 
                black 80%, 
                transparent 100%
            );
            
            filter: contrast(1.03) brightness(1.02);
        }

        /* 텍스트 및 버튼 섹션 (스크롤과 함께 올라오는 느낌) */
        .content-overlay {
            position: relative;
            z-index: 10;
            padding-top: 70vh; /* 사진 아래쪽에서 텍스트 시작 */
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .main-title {
            font-size: 2.5rem; font-weight: 200; color: #8ea8c9;
            letter-spacing: 15px; text-transform: uppercase;
            text-align: center; margin-bottom: 50px;
            text-shadow: 0 0 20px rgba(255,255,255,0.8);
        }
        
        .enter-btn { 
            text-decoration: none; width: 220px; height: 75px; 
            background: white; border-radius: 50px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: 800; color: #8ea8c9; letter-spacing: 5px;
            box-shadow: 20px 20px 40px #d1d9e6, -20px -20px 40px #ffffff; 
            transition: 0.4s; margin-bottom: 100px;
        }

        @media (max-width: 768px) {
            .main-image { width: 320px; }
            .main-stage { transform: translate(-50%, -50%); }
        }
    </style>
</head>
<body>
    
    <div class="main-stage">
        <img src="jiwoo_profile.png" alt="한지우" class="main-image">
    </div>

    <div class="content-overlay">
        <h1 class="main-title">UNIVERSE<br><span style="font-size: 1.1rem; letter-spacing: 10px; font-weight: 600;">HAN JI WOO</span></h1>
        <a href="menu.html" class="enter-btn">ENTER</a>
    </div>

</body>
</html>
