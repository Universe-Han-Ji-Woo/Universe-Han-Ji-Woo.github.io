<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe | Free Board</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        // 관리자님의 Firebase 설정 (그대로 유지)
        const firebaseConfig = {
            apiKey: "AIzaSyCD0OaaN1E5uT950X5hkzCBdqT87JQRXrg",
            authDomain: "jiwoo-fanpage.firebaseapp.com",
            databaseURL: "https://jiwoo-fanpage-default-rtdb.firebaseio.com", 
            projectId: "jiwoo-fanpage",
            storageBucket: "jiwoo-fanpage.firebasestorage.app",
            messagingSenderId: "928634858988",
            appId: "1:928634858988:web:34ae1adf6bab3ad654e4c9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allPosts = [];

        function showView(viewName) {
            document.querySelectorAll('.view-section').forEach(v => v.style.display = 'none');
            document.getElementById(viewName + 'View').style.display = 'block';
            window.scrollTo(0,0);
        }

        // 1. 목록 불러오기 (번호순 정렬)
        function loadList() {
            db.ref('posts_v2').orderByChild('timestamp').on('value', (snapshot) => {
                allPosts = [];
                snapshot.forEach((child) => {
                    allPosts.push({ key: child.key, ...child.val() });
                });
                allPosts.reverse(); // 최신글이 위로 (번호가 크게)
                renderTable(allPosts);
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('postTableBody');
            tbody.innerHTML = '';
            const total = data.length;
            data.forEach((post, index) => {
                const postNo = total - index;
                tbody.innerHTML += `
                    <tr onclick="showDetail('${post.key}')">
                        <td>${postNo}</td>
                        <td style="text-align:left; padding-left:15px;">${post.title} ${post.imageUrl ? '🖼️' : ''}</td>
                        <td>${post.nickname}</td>
                        <td>${post.date}</td>
                        <td>${post.views || 0}</td>
                    </tr>
                `;
            });
        }

        // 2. 검색
        function searchPosts() {
            const kw = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allPosts.filter(p => p.title.toLowerCase().includes(kw) || p.content.toLowerCase().includes(kw));
            renderTable(filtered);
        }

        // 3. 등록
        async function submitPost() {
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            const imageUrl = document.getElementById('postImgUrl').value;
            const nick = sessionStorage.getItem('userNick') || '관리자';

            if(!title || !content) return alert("내용을 입력해주세요!");

            await db.ref('posts_v2').push({
                title, content, nickname: nick, imageUrl,
                date: new Date().toISOString().split('T')[0],
                views: 0, likes: 0, timestamp: Date.now()
            });
            alert("등록완료!");
            location.reload();
        }

        // 4. 상세보기 (요청하신 레이아웃 적용)
        function showDetail(key) {
            db.ref('posts_v2/' + key).once('value', (snapshot) => {
                const post = snapshot.val();
                db.ref('posts_v2/' + key).update({ views: (post.views || 0) + 1 });
                
                document.getElementById('detailTitle').innerText = post.title;
                document.getElementById('detailInfo').innerText = `${post.nickname} | ${post.date} | 조회 ${post.views + 1}`;
                document.getElementById('detailContent').innerText = post.content;
                
                const imgArea = document.getElementById('detailImage');
                imgArea.innerHTML = post.imageUrl ? `<img src="${post.imageUrl}" style="max-width:100%; display:block; margin:20px 0; border-radius:10px;">` : '';
                
                document.getElementById('likeCount').innerText = post.likes || 0;
                document.getElementById('likeBtn').onclick = () => {
                    db.ref('posts_v2/' + key).transaction(p => { if(p) p.likes = (p.likes || 0) + 1; return p; });
                };
                showView('detail');
            });
        }

        window.onload = loadList;
    </script>

    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; margin: 0; padding: 0; background: #fff; color: #333; }
        .nav { background: #000; color: #fff; padding: 15px; text-align: center; font-weight: bold; letter-spacing: 1px; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }

        /* 테이블 공통 */
        table { width: 100%; border-collapse: collapse; border-top: 2px solid #000; margin-top: 10px; }
        th { background: #f9f9f9; padding: 12px; font-size: 0.85rem; border-bottom: 1px solid #ddd; }
        td { padding: 15px 5px; text-align: center; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.95rem; }

        /* 글쓰기 버튼 */
        .btn-write-trigger { float: right; background: #e91e63; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-bottom: 10px; }

        /* 검색/페이징 구역 */
        .footer-area { margin-top: 20px; text-align: center; }
        .btn-page { padding: 8px 15px; border: 1px solid #ddd; background: #fff; cursor: pointer; margin: 0 5px; border-radius: 4px; }
        .search-box { margin-top: 20px; display: flex; justify-content: center; gap: 5px; }
        .search-box input { padding: 10px; border: 1px solid #ddd; border-radius: 4px; width: 250px; }
        .btn-search { padding: 10px 20px; background: #fff; border: 1px solid #ddd; cursor: pointer; }

        /* 글쓰기 폼 넓게 */
        .input-box { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; font-size: 1rem; }
        textarea.input-box { height: 400px; resize: none; }
        .btn-submit { width: 100%; padding: 18px; background: #000; color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; cursor: pointer; }

        /* 상세보기 (핵심!) */
        .detail-wrap { border-top: 2px solid #000; margin-top: 20px; padding-top: 20px; }
        .detail-title { font-size: 1.8rem; font-weight: bold; margin-bottom: 10px; }
        .detail-info { color: #888; font-size: 0.9rem; padding-bottom: 20px; border-bottom: 1px solid #eee; margin-bottom: 20px; }
        .detail-content { min-height: 300px; line-height: 1.8; font-size: 1.05rem; white-space: pre-wrap; }
        
        /* 버튼 배치: 좋아요는 왼쪽, 목록은 오른쪽 */
        .detail-btns { display: flex; justify-content: space-between; align-items: center; padding: 40px 0; border-top: 1px solid #eee; }
        .btn-like { background: #fff; border: 1px solid #ddd; padding: 10px 25px; border-radius: 30px; cursor: pointer; display: flex; align-items: center; gap: 5px; font-weight: bold; }
        .btn-list-view { background: #f8f8f8; border: 1px solid #ddd; padding: 10px 25px; border-radius: 5px; cursor: pointer; color: #333; }

        @media (max-width:600px) { th:nth-child(3), td:nth-child(3), th:nth-child(4), td:nth-child(4) { display: none; } }
    </style>
</head>
<body>
    <div class="nav">UNIVERSE : FREE BOARD</div>
    <div class="container">
        
        <div id="listView" class="view-section">
            <button class="btn-write-trigger" onclick="showView('write')">글쓰기</button>
            <table>
                <thead>
                    <tr><th width="60">번호</th><th>제목</th><th width="100">작성자</th><th width="100">날짜</th><th width="60">조회</th></tr>
                </thead>
                <tbody id="postTableBody"></tbody>
            </table>
            <div class="footer-area">
                <button class="btn-page">이전</button> <button class="btn-page">다음</button>
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="검색어를 입력하세요">
                    <button class="btn-search" onclick="searchPosts()">검색</button>
                </div>
            </div>
        </div>

        <div id="writeView" class="view-section" style="display:none;">
            <h3>게시글 작성</h3>
            <input type="text" id="postTitle" class="input-box" placeholder="제목을 입력하세요">
            <textarea id="postContent" class="input-box" placeholder="내용을 자유롭게 입력하세요 (공간이 넓습니다)"></textarea>
            <input type="text" id="postImgUrl" class="input-box" placeholder="이미지 주소 URL (선택사항)">
            <button class="btn-submit" onclick="submitPost()">등록하기</button>
            <button class="btn-list-view" style="width:100%; margin-top:10px;" onclick="showView('list')">취소</button>
        </div>

        <div id="detailView" class="view-section" style="display:none;">
            <div class="detail-wrap">
                <div class="detail-title" id="detailTitle"></div>
                <div class="detail-info" id="detailInfo"></div>
                <div id="detailImage"></div>
                <div class="detail-content" id="detailContent"></div>
                
                <div class="detail-btns">
                    <button class="btn-like" id="likeBtn">❤️ 좋아요 <span id="likeCount">0</span></button>
                    <button class="btn-list-view" onclick="showView('list')">목록보기</button>
                </div>
            </div>
        </div>

    </div>
</body>
</html>
