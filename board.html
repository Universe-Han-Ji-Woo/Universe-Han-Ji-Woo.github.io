<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe | Free Board</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCD0OaaN1E5uT950X5hkzCBdqT87JQRXrg",
            authDomain: "jiwoo-fanpage.firebaseapp.com",
            databaseURL: "https://jiwoo-fanpage-default-rtdb.firebaseio.com", 
            projectId: "jiwoo-fanpage",
            storageBucket: "jiwoo-fanpage.firebasestorage.app",
            messagingSenderId: "928634858988",
            appId: "1:928634858988:web:34ae1adf6bab3ad654e4c9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function writePost() {
            const nick = sessionStorage.getItem('userNick') || '익명팬';
            const content = document.getElementById('postContent').value;
            if(!content) return alert("내용을 입력해주세요!");

            db.ref('posts').push({
                nickname: nick,
                content: content,
                timestamp: Date.now()
            }).then(() => {
                document.getElementById('postContent').value = '';
                alert("한지우 유니버스에 기록되었습니다.");
            });
        }

        function loadPosts() {
            db.ref('posts').on('value', (snapshot) => {
                const board = document.getElementById('boardList');
                board.innerHTML = '';
                const data = snapshot.val();
                if(data) {
                    Object.values(data).reverse().forEach(post => {
                        const date = new Date(post.timestamp).toLocaleString();
                        board.innerHTML += `
                            <div class="post-card">
                                <div class="post-info"><b>${post.nickname}</b> <span>${date}</span></div>
                                <div class="post-text">${post.content}</div>
                            </div>
                        `;
                    });
                }
            });
        }
        window.onload = loadPosts;
    </script>

    <style>
        /* 🎨 핑크 제거! 한지우 전용 블랙 & 네이비 스타일 */
        body { margin: 0; background: #ffffff; font-family: 'Apple SD Gothic Neo', sans-serif; }
        .nav { padding: 20px; background: #1a1a1a; color: #fff; text-align: center; font-weight: 900; letter-spacing: 3px; text-transform: uppercase; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px; }
        
        /* 글쓰기 구역 */
        .write-zone { background: #f4f7fa; padding: 20px; border-radius: 15px; margin-bottom: 25px; border: 1px solid #eee; }
        textarea { width: 100%; height: 90px; border: 1px solid #ddd; border-radius: 10px; padding: 15px; box-sizing: border-box; resize: none; font-size: 1rem; outline: none; }
        .btn-post { width: 100%; padding: 15px; background: #1a1a1a; color: #fff; border: none; border-radius: 10px; margin-top: 10px; font-weight: 900; cursor: pointer; letter-spacing: 5px; }

        /* 게시글 리스트 */
        .post-card { background: #fff; padding: 20px; border-radius: 15px; margin-bottom: 12px; border: 1px solid #f0f0f0; border-left: 5px solid #1a1a1a; box-shadow: 0 4px 10px rgba(0,0,0,0.02); }
        .post-info { font-size: 0.8rem; color: #999; margin-bottom: 10px; display: flex; justify-content: space-between; }
        .post-info b { color: #1a1a1a; }
        .post-text { font-size: 1rem; line-height: 1.6; color: #333; word-break: break-all; }
    </style>
</head>
<body>
    <div class="nav">UNIVERSE : FREE BOARD</div>
    <div class="container">
        <div class="write-zone">
            <textarea id="postContent" placeholder="지우 배우님께 따뜻한 한마디를 남겨주세요."></textarea>
            <button class="btn-post" onclick="writePost()">POST</button>
        </div>
        <div id="boardList"></div>
    </div>
</body>
</html>
