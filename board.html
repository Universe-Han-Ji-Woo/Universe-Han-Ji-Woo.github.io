<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe | Free Board</title>
    <style>
        /* [기존 디자인 스타일 유지] */
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050a10; color: #fff; font-family: 'Apple SD Gothic Neo', sans-serif; }
        .universe-bg { position: fixed; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a2a3a 0%, #050a10 80%); z-index: -1; }
        .container { max-width: 1000px; margin: 0 auto; padding: 50px 20px; position: relative; z-index: 10; }
        .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #8ea8c9; padding-bottom: 15px; }
        .btn-write-trigger { background: #ff2d55; color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .board-table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.02); }
        .board-table th { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.2); color: #8ea8c9; font-size: 0.9rem; background: rgba(142,168,204,0.05); }
        .board-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; font-size: 0.85rem; }
        .td-title { text-align: left !important; padding-left: 20px !important; color: #e0e0e0; cursor: pointer; }
        .tag { font-weight: bold; margin-right: 6px; }
        .tag-공지 { color: #ff5252; } .tag-수다 { color: #8ea8c9; } .tag-정보 { color: #4caf50; }
        
        /* [작성 화면] */
        #writePage { display: none; background: rgba(255,255,255,0.05); padding: 40px; border-radius: 15px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .w-input { width: 100%; background: #fff; border: 1px solid #ddd; color: #333; padding: 12px; border-radius: 4px; box-sizing: border-box; outline: none; margin-bottom: 10px; }
        .w-textarea { height: 350px; resize: none; }
        .write-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; }
        .btn-group { display: flex; gap: 10px; }
        .btn-base { padding: 10px 25px; border-radius: 4px; cursor: pointer; border: none; font-weight: bold; }
        .btn-submit { background: #ff2d55; color: #fff; }
        
        .loading { text-align: center; padding: 20px; color: #8ea8c9; font-style: italic; }
        .back-btn { position: fixed; top: 30px; left: 30px; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; cursor: pointer; color: #fff; font-size: 0.7rem; background: rgba(0,0,0,0.3); z-index: 100; }
    </style>
</head>
<body>
    <div class="universe-bg"></div>
    <div class="back-btn" onclick="location.href='menu.html'+location.search">← HUB로 복귀</div>

    <div class="container">
        <div id="listPage">
            <div class="board-header">
                <h1>자유게시판</h1>
                <button class="btn-write-trigger" onclick="openWrite()">글쓰기</button>
            </div>
            <div id="loadingStatus" class="loading">데이터 수신 중...</div>
            <table class="board-table">
                <thead>
                    <tr>
                        <th width="60">번호</th>
                        <th>제목</th>
                        <th width="140">작성자</th>
                        <th width="120">작성일</th>
                        <th width="80">조회수</th>
                    </tr>
                </thead>
                <tbody id="boardBody"></tbody>
            </table>
        </div>

        <div id="writePage">
            <h2 style="color:#ff2d55;">글쓰기</h2>
            <select id="postTag" class="w-input" style="width: 120px;">
                <option value="수다">수다</option>
                <option value="정보">정보</option>
                <option value="공지">공지</option>
            </select>
            <input type="text" id="postTitle" class="w-input" placeholder="제목을 입력하세요">
            <textarea id="postContent" class="w-input w-textarea" placeholder="내용을 입력하세요"></textarea>
            <div class="write-footer">
                <div style="color:#ff2d55; font-weight:bold;">♥ 좋아요</div>
                <div class="btn-group">
                    <button class="btn-base" onclick="closeWrite()">취소</button>
                    <button id="submitBtn" class="btn-base btn-submit" onclick="submitPost()">등록하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 관리자님의 마법 통로 주소
        const API_URL = "https://script.google.com/macros/s/AKfycbxSdoLf-AO2gVxujjRZp_UKuZvBbIfQoQNA0gjOkfoAPkvK5DDYRpXbJWnCG6qR77zySw/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const currentUser = urlParams.get('user') || "Unknown";

        // 1. 목록 가져오기
        async function loadPosts() {
            document.getElementById('loadingStatus').style.display = 'block';
            try {
                const response = await fetch(API_URL);
                const data = await response.json();
                renderBoard(data);
            } catch (e) {
                console.error("데이터 로드 실패", e);
            } finally {
                document.getElementById('loadingStatus').style.display = 'none';
            }
        }

        function renderBoard(posts) {
            const tbody = document.getElementById('boardBody');
            tbody.innerHTML = posts.map((p, idx) => `
                <tr>
                    <td>${posts.length - idx}</td>
                    <td class="td-title"><span class="tag tag-${p.Tag}">[${p.Tag}]</span> ${p.Title}</td>
                    <td>${p.User}</td>
                    <td>${p.Date}</td>
                    <td>${p.Views}</td>
                </tr>
            `).reverse().join(''); // 최신글이 위로 오도록
        }

        // 2. 글 등록하기
        async function submitPost() {
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            const tag = document.getElementById('postTag').value;

            if(!title || !content) return alert("내용을 채워주세요!");

            const btn = document.getElementById('submitBtn');
            btn.innerText = "전송 중...";
            btn.disabled = true;

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ title, content, tag, user: currentUser })
                });
                alert("등록 성공!");
                location.reload(); // 새로고침하여 목록 갱신
            } catch (e) {
                alert("등록 실패!");
                btn.disabled = false;
                btn.innerText = "등록하기";
            }
        }

        function openWrite() { document.getElementById('listPage').style.display = 'none'; document.getElementById('writePage').style.display = 'block'; }
        function closeWrite() { document.getElementById('writePage').style.display = 'block'; document.getElementById('writePage').style.display = 'none'; }

        window.onload = loadPosts;
    </script>
</body>
</html>
