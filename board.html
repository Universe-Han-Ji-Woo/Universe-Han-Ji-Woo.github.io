<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Universe Board</title>
    <style>
        body { background: #050a10; color: white; font-family: sans-serif; padding: 20px; }
        .btn { background: #ff2d55; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; margin-bottom: 20px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(255,255,255,0.05); }
        th { border-bottom: 2px solid #8ea8c9; padding: 12px; color: #8ea8c9; background: rgba(0,0,0,0.3); }
        td { border-bottom: 1px solid rgba(255,255,255,0.1); padding: 15px; text-align: center; }
        #writePage { display: none; background: rgba(255,255,255,0.1); padding: 30px; border-radius: 10px; border: 1px solid #444; }
        input, textarea { width: 100%; padding: 12px; margin-bottom: 15px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ddd; }
        .loading { text-align: center; padding: 50px; color: #8ea8c9; }
    </style>
</head>
<body>
    <div id="listPage">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h1>자유게시판</h1>
            <button class="btn" onclick="openWrite()">글쓰기</button>
        </div>
        <div id="loadingStatus" class="loading">데이터 로딩 중...</div>
        <table>
            <thead><tr><th width="80">번호</th><th>제목</th><th width="150">작성자</th></tr></thead>
            <tbody id="boardBody"></tbody>
        </table>
    </div>

    <div id="writePage">
        <h2>글쓰기</h2>
        <input type="text" id="t" placeholder="제목을 입력하세요">
        <textarea id="c" rows="10" placeholder="내용을 입력하세요"></textarea>
        <button class="btn" onclick="submit()">등록하기</button>
        <button class="btn" style="background:#555" onclick="location.reload()">취소</button>
    </div>

    <script>
        // 관리자님이 주신 최신 주소로 교체 완료!
        const API = "https://script.google.com/macros/s/AKfycbwgMzQi8ib58Qkld2aUED-cnuaQQ9wWwd8Z1b-ym96o3hfKRP59yes3GnwgC-7LQEkk7w/exec";

        async function load() {
            try {
                const res = await fetch(API);
                const data = await res.json();
                const tbody = document.getElementById('boardBody');
                
                if (data.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3">게시글이 없습니다. 첫 글을 써보세요!</td></tr>';
                } else {
                    tbody.innerHTML = data.map((item, i) => {
                        // 데이터가 어떤 이름으로 들어와도 제목을 찾아내는 마법
                        const title = item.Title || item.title || Object.values(item)[2] || "제목 없음";
                        const user = item.User || item.user || "익명";
                        return `<tr><td>${i + 1}</td><td style="text-align:left; padding-left:30px;">${title}</td><td>${user}</td></tr>`;
                    }).reverse().join('');
                }
            } catch (e) {
                document.getElementById('loadingStatus').innerText = "오류 발생! 시트 설정을 확인해주세요.";
            } finally {
                document.getElementById('loadingStatus').style.display = 'none';
            }
        }

        async function submit() {
            const title = document.getElementById('t').value;
            const content = document.getElementById('c').value;
            if(!title || !content) return alert("제목과 내용을 입력해주세요.");

            const btn = event.target;
            btn.innerText = "전송 중...";
            btn.disabled = true;

            try {
                await fetch(API, { 
                    method: 'POST', 
                    body: JSON.stringify({ title, content, tag: '수다', user: '관리자' }) 
                });
                alert('글이 성공적으로 등록되었습니다!');
                location.reload();
            } catch (e) {
                alert('전송 실패!');
                btn.disabled = false;
                btn.innerText = "등록하기";
            }
        }

        function openWrite() { document.getElementById('listPage').style.display='none'; document.getElementById('writePage').style.display='block'; }
        window.onload = load;
    </script>
</body>
</html>
