<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe | Free Board</title>
    
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCD0OaaN1E5uT950X5hkzCBdqT87JQRXrg",
            authDomain: "jiwoo-fanpage.firebaseapp.com",
            databaseURL: "https://jiwoo-fanpage-default-rtdb.firebaseio.com", 
            projectId: "jiwoo-fanpage",
            storageBucket: "jiwoo-fanpage.firebasestorage.app",
            messagingSenderId: "928634858988",
            appId: "1:928634858988:web:34ae1adf6bab3ad654e4c9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let allPosts = [];

        function showView(viewName) {
            document.querySelectorAll('.view-section').forEach(v => v.style.display = 'none');
            document.getElementById(viewName + 'View').style.display = 'block';
            window.scrollTo(0,0);
        }

        // 1. 목록 불러오기
        function loadList() {
            db.ref('posts_v2').orderByChild('timestamp').on('value', (snapshot) => {
                allPosts = [];
                snapshot.forEach((child) => {
                    allPosts.push({ key: child.key, ...child.val() });
                });
                allPosts.reverse();
                renderTable(allPosts);
            });
        }

        function renderTable(data) {
            const tbody = document.getElementById('postTableBody');
            tbody.innerHTML = '';
            const total = data.length;
            data.forEach((post, index) => {
                const postNo = total - index;
                // 목록에는 날짜만 (03. 11. 형식)
                const dateOnly = post.fullDate ? post.fullDate.split(' ')[0].substring(5).replace('-', '. ') + '.' : post.date;
                tbody.innerHTML += `
                    <tr onclick="showDetail('${post.key}')">
                        <td>${postNo}</td>
                        <td style="text-align:left; padding-left:15px;">${post.title} ${post.imageUrl ? '🖼️' : ''}</td>
                        <td>${post.nickname}</td>
                        <td>${dateOnly}</td>
                        <td>${post.views || 0}</td>
                    </tr>
                `;
            });
        }

        // 2. 글 등록/수정 (★오전/오후 로직 강화)
        async function submitPost() {
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            const imageUrl = document.getElementById('postImgUrl').value;
            const nick = sessionStorage.getItem('userNick') || '관리자';
            const editKey = document.getElementById('editKey').value;

            if(!title || !content) return alert("내용을 입력해주세요!");

            // 오전/오후 시간 문자열 생성
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const ampm = hours >= 12 ? '오후' : '오전';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // 0시를 12시로 표시
            const displayHours = String(hours).padStart(2, '0');

            // 최종 형태: 2026. 03. 11. 오전 10:30
            const fullDateString = `${year}. ${month}. ${day}. ${ampm} ${displayHours}:${minutes}`;

            const postData = {
                title, content, nickname: nick, imageUrl,
                fullDate: fullDateString, // 이 값이 상세페이지에 나옵니다
                date: `${month}. ${day}.`, // 목록용
                timestamp: Date.now()
            };

            if(editKey) {
                await db.ref('posts_v2/' + editKey).update(postData);
                alert("수정되었습니다!");
            } else {
                postData.views = 0; postData.likes = 0;
                await db.ref('posts_v2').push(postData);
                alert("등록완료!");
            }
            location.reload();
        }

        // 3. 상세보기 (★시간 출력 확정)
        function showDetail(key) {
            db.ref('posts_v2/' + key).once('value', (snapshot) => {
                const post = snapshot.val();
                db.ref('posts_v2/' + key).update({ views: (post.views || 0) + 1 });
                
                document.getElementById('detailTitle').innerText = post.title;
                
                // 데이터에 fullDate가 없으면(옛날글) 기본 date라도 표시
                const timeInfo = post.fullDate ? post.fullDate : post.date;
                document.getElementById('detailInfo').innerText = `${post.nickname}  ${timeInfo}  조회 ${post.views + 1}`;
                
                document.getElementById('detailContent').innerText = post.content;
                const imgArea = document.getElementById('detailImage');
                imgArea.innerHTML = post.imageUrl ? `<img src="${post.imageUrl}" style="max-width:100%; display:block; margin:20px 0; border-radius:10px;">` : '';
                
                document.getElementById('likeCount').innerText = post.likes || 0;
                document.getElementById('likeBtn').onclick = () => {
                    db.ref('posts_v2/' + key).transaction(p => { if(p) p.likes = (p.likes || 0) + 1; return p; });
                };

                document.getElementById('deleteBtn').onclick = () => deletePost(key);
                document.getElementById('editBtn').onclick = () => prepareEdit(key, post);

                showView('detail');
            });
        }

        function deletePost(key) {
            if(confirm("정말 삭제하시겠습니까?")) {
                db.ref('posts_v2/' + key).remove();
                alert("삭제되었습니다.");
                location.reload();
            }
        }

        function prepareEdit(key, post) {
            document.getElementById('editKey').value = key;
            document.getElementById('postTitle').value = post.title;
            document.getElementById('postContent').value = post.content;
            document.getElementById('postImgUrl').value = post.imageUrl || '';
            showView('write');
        }

        window.onload = loadList;
    </script>

    <style>
        body { font-family: 'Apple SD Gothic Neo', sans-serif; margin: 0; padding: 0; background: #fff; color: #333; }
        .nav { background: #000; color: #fff; padding: 15px; text-align: center; font-weight: bold; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }

        /* 목록 테이블 */
        table { width: 100%; border-collapse: collapse; border-top: 2px solid #000; margin-top: 10px; }
        th { background: #f9f9f9; padding: 12px; font-size: 0.85rem; border-bottom: 1px solid #ddd; color: #777; }
        td { padding: 15px 5px; text-align: center; border-bottom: 1px solid #eee; cursor: pointer; font-size: 0.95rem; }
        
        .btn-write-trigger { float: right; background: #e91e63; color: #fff; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; margin-bottom: 10px; font-weight: bold; }

        /* 글쓰기 */
        .input-box { width: 100%; padding: 15px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 15px; box-sizing: border-box; }
        textarea.input-box { height: 450px; resize: none; font-size: 1rem; }
        .btn-submit { width: 100%; padding: 18px; background: #000; color: #fff; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 1.1rem; }

        /* 상세보기 (수정/삭제 상단 우측) */
        .detail-header-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 5px; }
        .detail-title { font-size: 1.8rem; font-weight: bold; flex: 1; margin: 10px 0; }
        .top-admin-btns { display: flex; gap: 5px; margin-top: 10px; }
        .btn-small { background: #fff; border: 1px solid #ddd; padding: 5px 12px; border-radius: 4px; cursor: pointer; font-size: 0.85rem; color: #666; }

        .detail-info { color: #999; font-size: 0.85rem; padding-bottom: 15px; border-bottom: 1px solid #eee; margin-bottom: 25px; }
        .detail-content { min-height: 400px; line-height: 1.8; font-size: 1.05rem; white-space: pre-wrap; padding: 10px 0; }

        /* 하단 버튼 배치 */
        .detail-footer-btns { display: flex; justify-content: space-between; align-items: center; padding-top: 30px; border-top: 1px solid #eee; margin-top: 40px; }
        .btn-like { background: #fff; border: 1px solid #ddd; padding: 10px 25px; border-radius: 30px; cursor: pointer; font-weight: bold; display: flex; align-items: center; gap: 8px; }
        .btn-list-go { background: #f8f8f8; border: 1px solid #ddd; padding: 10px 25px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        @media (max-width:600px) { th:nth-child(3), td:nth-child(3), th:nth-child(4), td:nth-child(4) { display: none; } }
    </style>
</head>
<body>
    <div class="nav">UNIVERSE : FREE BOARD</div>
    <div class="container">
        
        <div id="listView" class="view-section">
            <button class="btn-write-trigger" onclick="document.getElementById('editKey').value=''; showView('write')">글쓰기</button>
            <table>
                <thead>
                    <tr><th width="60">번호</th><th>제목</th><th width="100">작성자</th><th width="100">날짜</th><th width="60">조회</th></tr>
                </thead>
                <tbody id="postTableBody"></tbody>
            </table>
        </div>

        <div id="writeView" class="view-section" style="display:none;">
            <input type="hidden" id="editKey">
            <h3>게시글 작성/수정</h3>
            <input type="text" id="postTitle" class="input-box" placeholder="제목">
            <textarea id="postContent" class="input-box" placeholder="내용을 입력하세요"></textarea>
            <input type="text" id="postImgUrl" class="input-box" placeholder="이미지 주소 URL (선택)">
            <button class="btn-submit" onclick="submitPost()">등록/수정하기</button>
            <button class="btn-list-go" style="width:100%; margin-top:10px;" onclick="showView('list')">취소</button>
        </div>

        <div id="detailView" class="view-section" style="display:none;">
            <div class="detail-header-row">
                <div class="detail-title" id="detailTitle"></div>
                <div class="top-admin-btns">
                    <button class="btn-small" id="editBtn">수정</button>
                    <button class="btn-small" id="deleteBtn">삭제</button>
                </div>
            </div>
            <div class="detail-info" id="detailInfo"></div>
            
            <div id="detailImage"></div>
            <div class="detail-content" id="detailContent"></div>
            
            <div class="detail-footer-btns">
                <button class="btn-like" id="likeBtn">❤️ 좋아요 <span id="likeCount">0</span></button>
                <button class="btn-list-go" onclick="showView('list')">목록보기</button>
            </div>
        </div>

    </div>
</body>
</html>
