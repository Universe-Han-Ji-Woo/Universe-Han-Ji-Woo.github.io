<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERSE | 자유게시판</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #0b111e; color: white; font-family: 'Noto Sans KR', sans-serif; overflow-x: hidden; }
        
        /* 🌌 깊은 우주 배경 */
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1a253a 0%, #0b111e 70%); z-index: -1; opacity: 0.6; }

        /* ♎ 천칭자리 우주정거장 관문 */
        .universe-path { width: 100%; padding: 40px 0 20px 0; display: flex; justify-content: center; align-items: center; }
        .constellation-tower { text-decoration: none; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.5s; position: relative; }
        
        /* 별자리 아이콘 (은은한 화이트) */
        .libra-icon { font-size: 30px; color: rgba(255, 255, 255, 0.7); position: relative; width: 55px; height: 55px; display: flex; justify-content: center; align-items: center; border-radius: 50%; background: rgba(255, 255, 255, 0.02); border: 1px solid rgba(255, 255, 255, 0.1); transition: 0.5s; z-index: 2; }
        .libra-symbol::before { content: '♎'; font-style: normal; }

        /* 🚩 변경된 문구: '우주정거장으로 귀환' */
        .tower-guide { font-size: 10px; color: rgba(255, 255, 255, 0.4); letter-spacing: 2px; margin-top: 10px; font-weight: 300; transition: 0.5s; }

        /* 하단 텍스트 */
        .logo-text { font-size: 11px; color: rgba(255, 255, 255, 0.5); letter-spacing: 4px; margin-top: 5px; text-transform: uppercase; font-weight: 300; transition: 0.3s; }

        /* ✨ 호버 애니메이션 (우주정거장이 빛나는 효과) */
        @keyframes starGlow { 
            0%, 100% { box-shadow: 0 0 15px rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.1); transform: scale(1); } 
            50% { box-shadow: 0 0 35px rgba(255, 255, 255, 0.4); border-color: rgba(255, 255, 255, 0.6); transform: scale(1.05); } 
        }
        
        .constellation-tower:hover .libra-icon { animation: starGlow 1.5s infinite ease-in-out; background: rgba(255, 255, 255, 0.08); color: #fff; }
        .constellation-tower:hover .tower-guide { color: #fff; text-shadow: 0 0 10px rgba(255, 255, 255, 1); }
        .constellation-tower:hover .logo-text { color: rgba(255, 255, 255, 0.9); }

        /* 게시판 스타일 */
        .board-container { max-width: 950px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
        .board-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; margin-bottom: 30px; }
        .header-title { font-size: 24px; font-weight: 700; letter-spacing: 1px; color: #fff; margin: 0; }
        .write-btn { background-color: #ff2d55; color: white; padding: 10px 25px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .write-btn:hover { background-color: #fff; color: #ff2d55; box-shadow: 0 0 20px #ff2d55; }
        
        table { width: 100%; border-collapse: collapse; background-color: rgba(22, 29, 42, 0.8); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.03); }
        th, td { padding: 18px 10px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
        th { color: #8a94a6; font-size: 13px; background-color: rgba(28, 37, 53, 0.9); }
        .category { color: #ff2d55; font-weight: bold; margin-right: 5px; }
        .title-cell { text-align: left; cursor: pointer; padding-left: 20px; }
        .title-cell:hover { color: #ff2d55; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="universe-path">
        <div class="constellation-tower" onclick="goBack()" title="우주정거장으로 이동"> 
            <div class="libra-icon">
                <i class="libra-symbol"></i>
            </div>
            <span class="tower-guide">우주정거장으로 귀환</span>
            <span class="logo-text">Space Station</span>
        </div>
    </div>

    <div class="board-container">
        <div class="board-header">
            <h2 class="header-title">자유게시판</h2>
            <button class="write-btn" id="writeBtn">글쓰기</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">번호</th>
                    <th>제목</th>
                    <th style="width: 120px;">작성자</th>
                    <th style="width: 140px;">날짜</th>
                    <th style="width: 80px;">조회수</th>
                </tr>
            </thead>
            <tbody id="boardContent"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCD0OaaN1E5uT950X5hkzCBdqT87JQRXrg",
            databaseURL: "https://jiwoo-fanpage-default-rtdb.firebaseio.com",
            projectId: "jiwoo-fanpage"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const postsRef = ref(db, 'posts_v2');

        onValue(postsRef, (snapshot) => {
            const boardContent = document.getElementById('boardContent');
            boardContent.innerHTML = "";
            const data = snapshot.val();
            if (data) {
                const items = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                items.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)); 
                let no = items.length;
                items.forEach((post) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${no--}</td>
                        <td class="title-cell">
                            <span class="category">[${post.category || '일반'}]</span> ${post.title || '제목 없음'}
                        </td>
                        <td>${post.writer || '익명'}</td>
                        <td style="color:#8a94a6; font-size:13px;">${post.date || '-'}</td>
                        <td>${post.views || 0}</td>
                    `;
                    row.querySelector('.title-cell').onclick = () => {
                        location.href = `view.html?id=${post.id}&user=${encodeURIComponent(getUserName())}`;
                    };
                    boardContent.appendChild(row);
                });
            }
        });

        document.getElementById('writeBtn').onclick = () => {
            location.href = `write.html?user=${encodeURIComponent(getUserName())}`;
        };

        window.getUserName = function() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('user') || "Unknown";
        };

        // 🛡️ [수정 완료] 대문이 아닌, 하위 페이지들의 중심 허브인 'menu.html'로 연결합니다.
        window.goBack = function() {
            location.href = `menu.html?user=${encodeURIComponent(getUserName())}`;
        };
    </script>
</body>
</html>
