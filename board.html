<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Universe | Free Board</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        // 파이어베이스 설정 (기존과 동일)
        const firebaseConfig = {
            apiKey: "AIzaSyCD0OaaN1E5uT950X5hkzCBdqT87JQRXrg",
            authDomain: "jiwoo-fanpage.firebaseapp.com",
            databaseURL: "https://jiwoo-fanpage-default-rtdb.firebaseio.com", 
            projectId: "jiwoo-fanpage",
            storageBucket: "jiwoo-fanpage.firebasestorage.app",
            messagingSenderId: "928634858988",
            appId: "1:928634858988:web:34ae1adf6bab3ad654e4c9"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // [이게 핵심] 주소에서 유저 이름을 가져옴 (없으면 비로그인)
        const user = new URLSearchParams(window.location.search).get('user');

        // 다른 페이지로 이동할 때 유저 정보를 계속 들고 감
        function go(url) {
            location.href = user ? `${url}?user=${encodeURIComponent(user)}` : url;
        }

        // 목록 불러오기
        function loadPosts() {
            db.ref('posts_v2').orderByChild('timestamp').on('value', (snapshot) => {
                let html = '';
                snapshot.forEach(child => {
                    const p = child.val();
                    html += `<tr onclick="showDetail('${child.key}')" style="cursor:pointer;">
                                <td>${p.title}</td><td>${p.nickname}</td>
                             </tr>`;
                });
                document.getElementById('listBody').innerHTML = html;
            });
        }

        function showDetail(key) {
            db.ref('posts_v2/' + key).once('value', s => {
                const p = s.val();
                document.getElementById('vTitle').innerText = p.title;
                document.getElementById('vContent').innerText = p.content;
                // 관리자일 때만 삭제 버튼 보이게
                document.getElementById('adminArea').style.display = user ? 'block' : 'none';
                document.getElementById('delBtn').onclick = () => { if(confirm("삭제하시겠습니까?")) { db.ref('posts_v2/'+key).remove(); location.reload(); } };
                document.getElementById('listView').style.display = 'none';
                document.getElementById('detailView').style.display = 'block';
            });
        }

        window.onload = loadPosts;
    </script>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f4f7f9; }
        .nav { background: #333; padding: 15px; color: white; display: flex; gap: 20px; }
        .nav a { color: white; cursor: pointer; text-decoration: none; font-size: 14px; }
        .container { max-width: 800px; margin: 20px auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 15px; border-bottom: 1px solid #eee; text-align: left; }
    </style>
</head>
<body>
    <div class="nav">
        <a onclick="go('index.html')">홈으로</a>
        <a onclick="go('menu.html')">메뉴선택</a>
    </div>
    <div class="container">
        <div id="listView">
            <h2>자유게시판</h2>
            <table><thead><tr><th>제목</th><th>작성자</th></tr></thead><tbody id="listBody"></tbody></table>
        </div>
        <div id="detailView" style="display:none;">
            <h2 id="vTitle"></h2>
            <div id="adminArea" style="display:none; margin-bottom: 10px;"><button id="delBtn" style="color:red;">게시글 삭제</button></div>
            <p id="vContent" style="white-space:pre-wrap; line-height:1.6;"></p>
            <button onclick="location.reload()">목록으로</button>
        </div>
    </div>
</body>
</html>
