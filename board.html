<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>유니버스 | 자유게시판</title>
    <style>
        :root { --main-red: #ff2d55; --bg-dark: #050a10; --text-gray: #8ea8c9; }
        body { margin: 0; background: var(--bg-dark); color: #fff; font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; -webkit-font-smoothing: antialiased; }
        .universe-bg { position: fixed; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a2a3a 0%, #050a10 80%); z-index: -1; }
        .container { max-width: 850px; margin: 0 auto; padding: 60px 20px; }
        
        .board-header { display: flex; justify-content: space-between; border-bottom: 2px solid var(--main-red); padding-bottom: 10px; margin-bottom: 20px; align-items: flex-end; }
        .btn { background: var(--main-red); color: #fff; border: none; padding: 10px 22px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-sub { background: #333; color: #ccc; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; }
        .btn-delete { background: #422; color: #f88; border: 1px solid #633; padding: 6px 15px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        
        table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.03); border-radius: 8px; overflow: hidden; table-layout: fixed; }
        th, td { padding: 15px 10px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; font-size: 0.85rem; }
        th { color: var(--text-gray); font-weight: normal; background: rgba(255,255,255,0.05); }
        .td-title { text-align: left; cursor: pointer; padding-left: 20px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 0.95rem; }
        .td-date { color: var(--text-gray); font-size: 0.8rem; }

        .content-box { display: none; background: rgba(0,0,0,0.4); padding: 40px; border-radius: 15px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(15px); }
        .view-header-flex { display: flex; justify-content: space-between; align-items: flex-start; }
        .view-title { font-size: 1.8rem; color: var(--main-red); font-weight: bold; margin: 0; }
        .view-info { margin-top: 12px; font-size: 0.85rem; color: var(--text-gray); border-bottom: 1px solid #333; padding-bottom: 15px; }
        .view-body { min-height: 300px; line-height: 1.9; white-space: pre-wrap; margin: 30px 0; font-size: 1.05rem; color: #ddd; }
        .bottom-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 20px; padding-top: 20px; border-top: 1px solid rgba(255,255,255,0.1); }
    </style>
</head>
<body>
    <div class="universe-bg"></div>
    <div class="container">
        <div id="listPage">
            <div class="board-header"><h1>자유게시판</h1><button class="btn" onclick="openWrite()">글쓰기</button></div>
            <table>
                <thead><tr><th width="50">번호</th><th>제목</th><th width="100">작성자</th><th width="130">작성시간</th><th width="60">조회</th></tr></thead>
                <tbody id="boardBody"></tbody>
            </table>
        </div>

        <div id="viewPage" class="content-box">
            <div class="view-header-flex">
                <div>
                    <h1 id="viewTitle" class="view-title"></h1>
                    <div id="viewInfo" class="view-info"></div>
                </div>
                <button id="delBtn" class="btn-delete" onclick="deletePost()">게시글 삭제</button>
            </div>
            <div id="viewBody" class="view-body"></div>
            <div class="bottom-actions">
                <button class="btn" id="likeBtn" onclick="handleLike()">❤️ 좋아요 <span id="likeCount">0</span></button>
                <button class="btn-sub" onclick="goList()">목록으로</button>
            </div>
        </div>

        <div id="writePage" class="content-box">
            <h2 style="color:var(--main-red); margin-top:0;">게시글 작성</h2>
            <input type="text" id="postTitle" style="width:100%; padding:15px; box-sizing:border-box; background:#000; border:1px solid #444; color:#fff; margin-bottom:15px; border-radius:5px;" placeholder="제목을 입력하세요">
            <textarea id="postContent" style="width:100%; height:400px; padding:15px; box-sizing:border-box; background:#000; border:1px solid #444; color:#fff; resize:none; border-radius:5px;" placeholder="내용을 입력하세요"></textarea>
            <div style="text-align:right; margin-top:20px;"><button class="btn-sub" onclick="goList()" style="margin-right:10px;">취소</button><button id="submitBtn" class="btn" onclick="submitPost()">등록 완료</button></div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxG8IheW8VBfWDfFqg-XR_djDoDFSyEpDXd8rczbe1oGgWhk3loc9jnvKaEMIGG0_Do/exec";
        let allPosts = [];
        let currentPostId = null;
        let isProcessing = false;

        // 시간 표시 로직 (정확한 실시간 변환)
        function formatTime(dateStr) {
            if(!dateStr || dateStr === "-") return "-";
            const now = new Date();
            const past = new Date(dateStr);
            if(isNaN(past)) return dateStr;

            const diff = Math.floor((now - past) / 1000);
            if (diff < 60) return "방금 전";
            if (diff < 3600) return Math.floor(diff / 60) + "분 전";
            if (diff < 86400) return Math.floor(diff / 3600) + "시간 전";
            return past.toLocaleDateString('ko-KR', { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
        }

        async function loadPosts() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                // 데이터 필드 매칭 (서버에서 소문자로 오므로 안전하게 처리)
                allPosts = data.map(p => ({
                    id: p.id,
                    title: p.title || "(제목 없음)",
                    content: p.content || "",
                    user: p.user || "관리자",
                    date: p.date,
                    likes: p.likes || 0,
                    views: p.views || 0
                }));
                renderBoard();
            } catch(e) { console.error("데이터 로드 중 오류 발생"); }
        }

        function renderBoard() {
            const tbody = document.getElementById('boardBody');
            tbody.innerHTML = allPosts.slice().reverse().map((p, i) => `
                <tr>
                    <td>${allPosts.length - i}</td>
                    <td class="td-title" onclick="viewPost('${p.id}')">${p.title}</td>
                    <td>${p.user}</td>
                    <td class="td-date">${formatTime(p.date)}</td>
                    <td>${p.views}</td>
                </tr>`).join('');
        }

        function viewPost(id) {
            const p = allPosts.find(x => String(x.id) === String(id));
            currentPostId = id;
            document.getElementById('listPage').style.display = 'none';
            document.getElementById('viewPage').style.display = 'block';
            document.getElementById('viewTitle').innerText = p.title;
            document.getElementById('viewInfo').innerText = `작성자: ${p.user} | ${new Date(p.date).toLocaleString()} | 조회수: ${p.views}`;
            document.getElementById('viewBody').innerText = p.content;
            document.getElementById('likeCount').innerText = p.likes;
            fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'view', id: id }) });
        }

        async function deletePost() {
            if(isProcessing || !confirm("정말 삭제하시겠습니까?")) return;
            isProcessing = true;
            document.getElementById('delBtn').innerText = "삭제 중...";
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'delete', id: currentPostId }) });
            location.reload();
        }

        async function submitPost() {
            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            if(!title || !content || isProcessing) return alert("내용을 입력해주세요.");
            isProcessing = true;
            document.getElementById('submitBtn').innerText = "등록 중...";
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'write', title, content, user: '관리자' }) });
            location.reload();
        }

        async function handleLike() {
            if(isProcessing) return;
            isProcessing = true;
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'like', id: currentPostId }) });
            document.getElementById('likeCount').innerText = Number(document.getElementById('likeCount').innerText) + 1;
            isProcessing = false;
        }

        function openWrite() { document.getElementById('listPage').style.display='none'; document.getElementById('writePage').style.display='block'; }
        function goList() { location.reload(); }
        window.onload = loadPosts;
    </script>
</body>
</html>
