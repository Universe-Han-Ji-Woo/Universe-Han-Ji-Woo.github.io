<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERSE | 자유게시판</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        /* [관리자님의 다크 모드 스타일 100% 유지] */
        body {
            margin: 0;
            padding: 0;
            background-color: #0b111e;
            color: white;
            font-family: 'Noto Sans KR', sans-serif;
        }

        /* 🌌 컨트롤 타워(menu.html)로 연결되는 전용 로고 길 */
        .universe-path {
            width: 100%;
            padding: 30px 0 10px 0;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .universe-logo {
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
        }

        /* 컨트롤 타워의 에너지를 형상화한 로고 아이콘 */
        .logo-icon {
            width: 50px;
            height: 50px;
            fill: none;
            stroke: #ff2d55; 
            stroke-width: 1.2;
            transition: 0.5s;
            filter: drop-shadow(0 0 8px rgba(255, 45, 85, 0.4));
        }

        /* 호버 시 컨트롤 타워로 복귀하는 빛의 효과 */
        .universe-logo:hover .logo-icon {
            transform: rotate(180deg) scale(1.1);
            stroke: #ffffff;
            filter: drop-shadow(0 0 20px rgba(255, 255, 255, 0.9));
        }

        .logo-text {
            font-size: 11px;
            color: #ff2d55;
            letter-spacing: 5px;
            margin-top: 12px;
            text-transform: uppercase;
            font-weight: 300;
            transition: 0.5s;
            opacity: 0.8;
        }

        .universe-logo:hover .logo-text {
            color: #ffffff;
            letter-spacing: 8px;
            opacity: 1;
        }

        /* [게시판 레이아웃 유지] */
        .board-container {
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
        }
        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #ff2d55;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }
        .write-btn {
            background-color: #ff2d55;
            color: white;
            padding: 8px 18px;
            border: none;
            border-radius: 20px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background-color: #161d2a;
            border-radius: 12px;
            overflow: hidden;
        }
        th, td {
            padding: 18px;
            text-align: center;
            border-bottom: 1px solid #242d3c;
        }
        th { color: #8a94a6; font-size: 14px; background-color: #1c2535; }
    </style>
</head>
<body>

    <div class="universe-path">
        <a id="backLink" href="#" class="universe-logo" onclick="goBack()"> 
            <svg class="logo-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke-dasharray="2 2" />
                <circle cx="12" cy="12" r="4" fill="#ff2d55" />
                <path d="M12 2L12 6M12 18L12 22M2 12L6 12M18 12L22 12" />
            </svg>
            <span class="logo-text">Back to Control Tower</span>
        </a>
    </div>

    <div class="board-container">
        <div class="board-header">
            <h2 style="font-weight: 400; letter-spacing: 2px;">자유게시판</h2>
            <button class="write-btn">글쓰기</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>NO</th>
                    <th>SUBJECT</th>
                    <th>WRITER</th>
                    <th>DATE</th>
                    <th>VIEW</th>
                </tr>
            </thead>
            <tbody id="boardContent">
                <tr>
                    <td>1</td>
                    <td style="text-align: left;">지우 유니버스 컨트롤 타워 연결 성공</td>
                    <td>관리자</td>
                    <td>2026.03.12</td>
                    <td>1</td>
                </tr>
            </tbody>
        </table>
    </div>

    <script>
        // 컨트롤 타워로 돌아갈 때 사용자 이름을 유지하기 위한 스크립트
        function goBack() {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            if (user) {
                location.href = `menu.html?user=${encodeURIComponent(user)}`;
            } else {
                location.href = "index.html";
            }
        }
    </script>
</body>
</html>
