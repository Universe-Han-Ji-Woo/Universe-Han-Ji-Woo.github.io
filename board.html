<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>UNIVERSE | 자유게시판</title>
    
    <script src="config.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        :root { --main-red: #ff2d55; --bg-dark: #0b111e; --row-bg: rgba(22, 29, 42, 0.8); }
        body { 
            margin: 0; padding: 0; background-color: var(--bg-dark); color: white; 
            font-family: 'Noto Sans KR', sans-serif; overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1a253a 0%, #0b111e 70%); z-index: -1; opacity: 0.6; }

        .universe-path { width: 100%; padding: 30px 0; display: flex; justify-content: center; align-items: center; }
        .constellation-tower { text-decoration: none; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .libra-svg-wrapper { position: relative; width: 60px; height: 60px; display: flex; justify-content: center; align-items: center; }
        .star-dot { position: absolute; background: #fff; border-radius: 50%; box-shadow: 0 0 8px 2px rgba(255, 255, 255, 0.8); }
        .s1 { top: 0%; left: 55%; width: 5px; height: 5px; }
        .s2 { top: 40%; left: 5%; width: 3px; height: 3px; }
        .s3 { top: 35%; right: 5%; width: 4px; height: 4px; }
        .s4 { top: 65%; right: 25%; width: 3px; height: 3px; }
        .s5 { bottom: 0%; left: 45%; width: 4px; height: 4px; }
        .libra-lines line { stroke: rgba(255, 255, 255, 0.25); stroke-width: 1.2; }
        .tower-guide { font-size: 10px; color: rgba(255, 255, 255, 0.4); letter-spacing: 2px; margin-top: 10px; font-weight: 300; }

        .board-container { max-width: 1000px; margin: 0 auto; padding: 0 20px 50px; position: relative; }
        .board-header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px; }
        .header-title { font-size: 22px; font-weight: 700; margin: 0; }
        .write-btn { background-color: var(--main-red); color: white; padding: 10px 20px; border: none; border-radius: 30px; font-weight: bold; cursor: pointer; font-size: 14px; transition: 0.3s; }
        .write-btn:hover { background-color: white; color: var(--main-red); }

        .board-table-wrapper { width: 100%; background: var(--row-bg); border-radius: 15px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.05); }
        table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        th { background: rgba(255, 255, 255, 0.05); color: #8a94a6; font-size: 13px; padding: 15px 10px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); }
        td { padding: 15px 10px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.03); font-size: 14px; }

        .col-no { width: 60px; }
        .col-title { width: auto; }
        .col-writer { width: 120px; }
        .col-date { width: 120px; }
        .col-views { width: 70px; }

        .title-cell { text-align: left; padding-left: 20px; cursor: pointer; }
        .category { color: var(--main-red); font-weight: bold; margin-right: 5px; font-size: 12px; }
        .title-text:hover { text-decoration: underline; color: var(--main-red); }

        /* 📱 모바일 반응형 핵심 수정 구역 */
        @media screen and (max-width: 768px) {
            .board-container { padding: 0 10px 30px; }
            .header-title { font-size: 18px; }
            .col-no, .col-date { display: none; } /* 번호와 날짜를 숨김 */
            .col-views { display: table-cell; width: 50px; } /* 조회수를 다시 보이게 설정 */
            .col-writer { width: 90px; }
            
            th, td { padding: 12px 5px; font-size: 13px; }
            .title-cell { padding-left: 10px; }
            
            /* 공지 글자가 제목 안으로 들어가지 않게 줄바꿈 처리 */
            .category { 
                display: block; 
                font-size: 10px; 
                margin-bottom: 4px; 
                line-height: 1;
            }
            .title-text {
                display: block;
                white-space: nowrap;
                overflow: hidden;
                text-overflow: ellipsis;
                font-size: 14px;
            }
        }

        @supports (padding: env(safe-area-inset-bottom)) {
            .board-container { padding-bottom: calc(30px + env(safe-area-inset-bottom)); }
        }
    </style>
</head>
<body>

    <div class="universe-path">
        <div class="constellation-tower" onclick="Universe.navigateTo('menu')">
            <div class="libra-svg-wrapper">
                <div class="star-dot s1"></div>
                <div class="star-dot s2"></div>
                <div class="star-dot s3"></div>
                <div class="star-dot s4"></div>
                <div class="star-dot s5"></div>
                <svg class="libra-lines" viewBox="0 0 60 60" width="60" height="60">
                    <line x1="55%" y1="0%" x2="5%" y2="40%" />
                    <line x1="55%" y1="0%" x2="95%" y2="35%" />
                    <line x1="5%" y1="40%" x2="45%" y2="100%" />
                    <line x1="95%" y1="35%" x2="75%" y2="65%" />
                    <line x1="75%" y1="65%" x2="45%" y2="100%" />
                </svg>
            </div>
            <span class="tower-guide">RETURN TO STATION</span>
        </div>
    </div>

    <div class="board-container">
        <div class="board-header">
            <h2 class="header-title">자유게시판</h2>
            <button class="write-btn" onclick="location.href='write.html?user=' + encodeURIComponent(Universe.getUser())">새 글 작성</button>
        </div>

        <div class="board-table-wrapper">
            <table>
                <thead>
                    <tr>
                        <th class="col-no">No</th>
                        <th class="col-title">제목</th>
                        <th class="col-writer">작성자</th>
                        <th class="col-date">날짜</th>
                        <th class="col-views">조회</th>
                    </tr>
                </thead>
                <tbody id="boardContent">
                    <tr><td colspan="5" style="padding:100px; opacity:0.5;">데이터를 불러오는 중...</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const postsRef = ref(db, 'posts_v2');

        onValue(postsRef, (snapshot) => {
            const boardContent = document.getElementById('boardContent');
            boardContent.innerHTML = "";
            const data = snapshot.val();
            
            if (data) {
                const items = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                items.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                
                let no = items.length;
                items.forEach((post) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="col-no">${no--}</td>
                        <td class="title-cell">
                            <span class="category">${post.category || '일반'}</span>
                            <span class="title-text">${post.title || '제목 없음'}</span>
                        </td>
                        <td class="col-writer">${post.writer || '익명'}</td>
                        <td class="col-date date-text">${(post.date || '').split(' ')[0]}</td>
                        <td class="col-views">${post.views || 0}</td>
                    `;
                    row.onclick = () => {
                        location.href = `view.html?id=${post.id}&user=${encodeURIComponent(Universe.getUser())}`;
                    };
                    boardContent.appendChild(row);
                });
            } else {
                boardContent.innerHTML = "<tr><td colspan='5' style='padding:80px;'>첫 게시글을 남겨주세요!</td></tr>";
            }
        });
    </script>
</body>
</html>
