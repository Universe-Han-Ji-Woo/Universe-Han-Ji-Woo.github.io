<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERSE | 자유게시판</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #0b111e; color: white; font-family: 'Noto Sans KR', sans-serif; overflow-x: hidden; }
        
        /* 🌌 우주 배경 효과 */
        body::before { content: ''; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: radial-gradient(circle at center, #1a253a 0%, #0b111e 70%); z-index: -1; opacity: 0.6; }

        /* ♎ 천칭자리 우주정거장 관문 (이미지 레이아웃 재현) */
        .universe-path { width: 100%; padding: 45px 0 25px 0; display: flex; justify-content: center; align-items: center; }
        .constellation-tower { text-decoration: none; display: flex; flex-direction: column; align-items: center; cursor: pointer; transition: 0.5s; position: relative; }
        
        /* ✨ 이미지 모양을 그대로 본뜬 SVG 컨테이너 */
        .libra-svg-wrapper { position: relative; width: 80px; height: 80px; display: flex; justify-content: center; align-items: center; }
        
        /* 별빛 입자 (이미지의 별 위치 재현) */
        .star-dot { position: absolute; background: #fff; border-radius: 50%; box-shadow: 0 0 12px 3px rgba(255, 255, 255, 0.9); z-index: 3; transition: 0.4s; }
        .s1 { top: 0%; left: 55%; width: 6px; height: 6px; }   /* 상단 꼭대기 별 */
        .s2 { top: 40%; left: 5%; width: 4px; height: 4px; }   /* 왼쪽 끝 별 */
        .s3 { top: 35%; right: 5%; width: 5px; height: 5px; }  /* 오른쪽 높은 별 */
        .s4 { top: 65%; right: 25%; width: 4px; height: 4px; } /* 오른쪽 낮은 별 */
        .s5 { bottom: 0%; left: 45%; width: 5px; height: 5px; } /* 하단 중앙 별 */

        /* 별을 연결하는 세하얀 선 (이미지 곡선/직선 느낌 재현) */
        .libra-lines { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 2; overflow: visible; }
        .libra-lines line { stroke: rgba(255, 255, 255, 0.25); stroke-width: 1.2; transition: 0.5s; }

        /* 배경에 은은하게 흐르는 별가루 */
        .falling-stars { position: absolute; width: 140%; height: 140%; pointer-events: none; }
        .dust { position: absolute; background: #fff; border-radius: 50%; opacity: 0; animation: starFall 4s infinite linear; }
        @keyframes starFall {
            0% { transform: translateY(-20px) opacity: 0; }
            20% { opacity: 0.4; }
            100% { transform: translateY(60px) opacity: 0; }
        }

        /* 호버 상호작용 */
        .constellation-tower:hover .star-dot { box-shadow: 0 0 20px 8px rgba(255, 255, 255, 1); transform: scale(1.3); }
        .constellation-tower:hover .libra-lines line { stroke: rgba(255, 255, 255, 0.7); stroke-width: 1.5; }
        .constellation-tower:hover .tower-guide { color: #fff; text-shadow: 0 0 12px #fff; transform: translateY(-2px); }

        /* 문구 스타일 */
        .tower-guide { font-size: 11px; color: rgba(255, 255, 255, 0.4); letter-spacing: 3px; margin-top: 18px; font-weight: 300; transition: 0.5s; }
        .logo-text { font-size: 12px; color: rgba(255, 255, 255, 0.6); letter-spacing: 5px; margin-top: 5px; text-transform: uppercase; font-weight: 400; }

        /* 게시판 본체 스타일 */
        .board-container { max-width: 950px; margin: 0 auto; padding: 20px; position: relative; z-index: 1; }
        .board-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid rgba(255, 255, 255, 0.1); padding-bottom: 15px; margin-bottom: 30px; }
        .header-title { font-size: 24px; font-weight: 700; color: #fff; margin: 0; }
        .write-btn { background-color: #ff2d55; color: white; padding: 10px 25px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .write-btn:hover { background-color: #fff; color: #ff2d55; box-shadow: 0 0 20px #ff2d55; }
        
        table { width: 100%; border-collapse: collapse; background-color: rgba(22, 29, 42, 0.8); border-radius: 12px; overflow: hidden; border: 1px solid rgba(255, 255, 255, 0.03); }
        th, td { padding: 18px 10px; text-align: center; border-bottom: 1px solid rgba(255, 255, 255, 0.03); }
        th { color: #8a94a6; font-size: 13px; background-color: rgba(28, 37, 53, 0.9); }
        .category { color: #ff2d55; font-weight: bold; margin-right: 5px; }
        .title-cell { text-align: left; cursor: pointer; padding-left: 20px; }
        .title-cell:hover { color: #ff2d55; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="universe-path">
        <div class="constellation-tower" onclick="goBack()">
            <div class="libra-svg-wrapper">
                <div class="falling-stars">
                    <div class="dust" style="top:10%; left:10%; width:1px; height:1px; animation-delay:0.5s;"></div>
                    <div class="dust" style="top:40%; left:85%; width:2px; height:2px; animation-delay:1.5s;"></div>
                    <div class="dust" style="top:70%; left:25%; width:1px; height:1px; animation-delay:2.5s;"></div>
                </div>
                
                <div class="star-dot s1"></div>
                <div class="star-dot s2"></div>
                <div class="star-dot s3"></div>
                <div class="star-dot s4"></div>
                <div class="star-dot s5"></div>

                <svg class="libra-lines" viewBox="0 0 80 80">
                    <line x1="55%" y1="0%" x2="5%" y2="40%" />   <line x1="55%" y1="0%" x2="95%" y2="35%" />  <line x1="5%" y1="40%" x2="45%" y2="100%" /> <line x1="95%" y1="35%" x2="75%" y2="65%" /> <line x1="75%" y1="65%" x2="45%" y2="100%" /> </svg>
            </div>
            <span class="tower-guide">우주정거장으로 귀환</span>
            <span class="logo-text">Space Station</span>
        </div>
    </div>

    <div class="board-container">
        <div class="board-header">
            <h2 class="header-title">자유게시판</h2>
            <button class="write-btn" id="writeBtn">글쓰기</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">번호</th>
                    <th>제목</th>
                    <th style="width: 120px;">작성자</th>
                    <th style="width: 140px;">날짜</th>
                    <th style="width: 80px;">조회수</th>
                </tr>
            </thead>
            <tbody id="boardContent"></tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCD0OaaN1E5uT950X5hkzCBdqT87JQRXrg",
            databaseURL: "https://jiwoo-fanpage-default-rtdb.firebaseio.com",
            projectId: "jiwoo-fanpage"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const postsRef = ref(db, 'posts_v2');

        onValue(postsRef, (snapshot) => {
            const boardContent = document.getElementById('boardContent');
            boardContent.innerHTML = "";
            const data = snapshot.val();
            if (data) {
                const items = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                items.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));
                let no = items.length;
                items.forEach((post) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td>${no--}</td>
                        <td class="title-cell"><span class="category">[${post.category || '일반'}]</span> ${post.title || '제목 없음'}</td>
                        <td>${post.writer || '익명'}</td>
                        <td style="color:#8a94a6; font-size:13px;">${post.date || '-'}</td>
                        <td>${post.views || 0}</td>
                    `;
                    row.querySelector('.title-cell').onclick = () => {
                        location.href = `view.html?id=${post.id}&user=${encodeURIComponent(getUserName())}`;
                    };
                    boardContent.appendChild(row);
                });
            } else {
                boardContent.innerHTML = "<tr><td colspan='5' style='padding:50px; color:#8a94a6;'>게시글이 우주 어딘가에 있나 봅니다...</td></tr>";
            }
        });

        document.getElementById('writeBtn').onclick = () => {
            location.href = `write.html?user=${encodeURIComponent(getUserName())}`;
        };

        window.getUserName = function() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('user') || "Unknown";
        };

        window.goBack = function() {
            location.href = `menu.html?user=${encodeURIComponent(getUserName())}`;
        };
    </script>
</body>
</html>
