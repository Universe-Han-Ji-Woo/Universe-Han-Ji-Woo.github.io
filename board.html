<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe | Free Board</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #050a10; color: #fff;
            font-family: 'Apple SD Gothic Neo', sans-serif;
        }
        .universe-bg {
            position: fixed; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a2a3a 0%, #050a10 80%);
            z-index: -1;
        }
        .container { max-width: 1000px; margin: 0 auto; padding: 50px 20px; position: relative; z-index: 10; }
        
        /* 헤더 & 글쓰기 */
        .header { text-align: center; margin-bottom: 40px; }
        .write-section {
            background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(142, 168, 204, 0.3);
            padding: 20px; border-radius: 12px; margin-bottom: 40px; backdrop-filter: blur(15px);
        }
        .write-header { display: flex; gap: 10px; margin-bottom: 10px; }
        select, input, textarea {
            background: rgba(0,0,0,0.5); border: 1px solid #444; color: #fff; padding: 10px; border-radius: 5px; outline: none;
        }
        textarea { width: 100%; height: 80px; resize: none; box-sizing: border-box; }
        .btn-post { float: right; margin-top: 10px; padding: 10px 30px; background: #8ea8c9; color: #050a10; border: none; font-weight: bold; border-radius: 5px; cursor: pointer; }

        /* 게시판 테이블 */
        .board-table { width: 100%; border-collapse: collapse; margin-top: 20px; background: rgba(255,255,255,0.01); }
        .board-table th { border-top: 2px solid #8ea8c9; border-bottom: 1px solid rgba(255,255,255,0.1); padding: 15px; color: #8ea8c9; }
        .board-table td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .td-title { text-align: left !important; padding-left: 30px !important; }
        .tag { font-weight: bold; margin-right: 5px; }
        .tag-공지 { color: #ff5252; } .tag-수다 { color: #8ea8c9; } .tag-정보 { color: #4caf50; }

        /* --- 페이징 디자인 --- */
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 30px; }
        .page-num {
            width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
            border: 1px solid rgba(255,255,255,0.2); border-radius: 5px; cursor: pointer; font-size: 0.8rem;
        }
        .page-num.active { background: #8ea8c9; color: #050a10; font-weight: bold; }
        .page-num:hover:not(.active) { background: rgba(255,255,255,0.1); }

        /* --- 검색창 디자인 --- */
        .search-area { display: flex; justify-content: center; gap: 5px; margin-top: 40px; }
        .search-select { width: 100px; }
        .search-input { width: 250px; }
        .btn-search {
            padding: 0 20px; background: #2ecc71; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold;
        }

        .back-btn { position: fixed; top: 30px; left: 30px; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; cursor: pointer; color: #fff; font-size: 0.7rem; background: rgba(0,0,0,0.3); }
    </style>
</head>
<body>
    <div class="universe-bg"></div>
    <div class="back-btn" onclick="location.href='menu.html'+location.search">← HUB로 복귀</div>

    <div class="container">
        <div class="header">
            <h1>FREE BOARD</h1>
            <p style="color: #8ea8c9;">우주 통신망에 접속되었습니다.</p>
        </div>

        <div class="write-section">
            <div class="write-header">
                <select id="postTag">
                    <option value="수다">수다</option>
                    <option value="정보">정보</option>
                    <option value="공지">공지</option>
                </select>
                <input type="text" id="postTitle" placeholder="제목을 입력하세요" style="flex:1;">
            </div>
            <textarea id="postContent" placeholder="내용을 입력하세요"></textarea>
            <button class="btn-post" onclick="addPost()">등록 (POST)</button>
            <div style="clear:both;"></div>
        </div>

        <table class="board-table">
            <thead>
                <tr>
                    <th width="80">번호</th>
                    <th>제목</th>
                    <th width="150">작성자</th>
                    <th width="120">작성일</th>
                    <th width="80">조회수</th>
                </tr>
            </thead>
            <tbody id="boardList">
                </tbody>
        </table>

        <div class="pagination" id="pagination">
            <div class="page-num active">1</div>
        </div>

        <div class="search-area">
            <select class="search-select" id="searchType">
                <option value="title">제목만</option>
                <option value="author">작성자</option>
            </select>
            <input type="text" class="search-input" id="searchKeyword" placeholder="검색어를 입력해주세요">
            <button class="btn-search" onclick="searchPosts()">검색</button>
        </div>
    </div>

    <script>
        // 초기 데이터 (나중에 구글 시트 연동 전까지 브라우저에 임시 저장됨)
        let allPosts = JSON.parse(localStorage.getItem('universe_posts') || '[]');

        function renderBoard(postsToRender) {
            const list = document.getElementById('boardList');
            list.innerHTML = postsToRender.map((p, idx) => `
                <tr>
                    <td>${postsToRender.length - idx}</td>
                    <td class="td-title"><span class="tag tag-${p.tag}">[${p.tag}]</span> ${p.title}</td>
                    <td>${p.user}</td>
                    <td>${p.date}</td>
                    <td>${p.views || 0}</td>
                </tr>
            `).join('');
        }

        function addPost() {
            const tag = document.getElementById('postTag').value;
            const title = document.getElementById('postTitle').value;
            const user = new URLSearchParams(window.location.search).get('user') || "Unknown";
            const date = new Date().toLocaleDateString();

            if(!title.trim()) return alert("제목을 적어주세요!");

            const newPost = { tag, title, user, date, views: 0 };
            allPosts.unshift(newPost);
            localStorage.setItem('universe_posts', JSON.stringify(allPosts));
            
            document.getElementById('postTitle').value = "";
            document.getElementById('postContent').value = "";
            renderBoard(allPosts);
        }

        function searchPosts() {
            const type = document.getElementById('searchType').value;
            const keyword = document.getElementById('searchKeyword').value.toLowerCase();
            
            const filtered = allPosts.filter(p => {
                if(type === 'title') return p.title.toLowerCase().includes(keyword);
                if(type === 'author') return p.user.toLowerCase().includes(keyword);
            });
            renderBoard(filtered);
        }

        window.onload = () => {
            renderBoard(allPosts);
        };
    </script>
</body>
</html>
