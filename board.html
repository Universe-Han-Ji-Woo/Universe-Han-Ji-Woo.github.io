<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERSE | 자유게시판</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #0b111e; color: white; font-family: 'Noto Sans KR', sans-serif; }
        
        /* 🌌 컨트롤 타워 연결 로고 (관리자님의 다크 모드 감성 유지) */
        .universe-path { width: 100%; padding: 30px 0 10px 0; display: flex; justify-content: center; align-items: center; }
        .universe-logo { text-decoration: none; display: flex; flex-direction: column; align-items: center; transition: 0.5s; cursor: pointer; }
        .logo-icon { width: 45px; height: 45px; fill: none; stroke: #ff2d55; stroke-width: 1.2; transition: 0.5s; filter: drop-shadow(0 0 8px rgba(255, 45, 85, 0.4)); }
        .universe-logo:hover .logo-icon { transform: rotate(180deg) scale(1.1); stroke: #ffffff; filter: drop-shadow(0 0 15px #fff); }
        .logo-text { font-size: 10px; color: #ff2d55; letter-spacing: 4px; margin-top: 10px; text-transform: uppercase; transition: 0.5s; }
        .universe-logo:hover .logo-text { color: #fff; letter-spacing: 6px; }

        /* [기존 게시판 디자인] */
        .board-container { max-width: 950px; margin: 0 auto; padding: 20px; }
        .board-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff2d55; padding-bottom: 15px; margin-bottom: 30px; }
        .write-btn { background-color: #ff2d55; color: white; padding: 8px 20px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        
        table { width: 100%; border-collapse: collapse; background-color: #161d2a; border-radius: 12px; overflow: hidden; }
        th, td { padding: 18px 10px; text-align: center; border-bottom: 1px solid #242d3c; }
        th { color: #8a94a6; font-size: 13px; background-color: #1c2535; }
        
        .category { color: #ff2d55; font-weight: bold; margin-right: 5px; }
        .title-cell { text-align: left; cursor: pointer; padding-left: 20px; }
        .title-cell:hover { color: #ff2d55; text-decoration: underline; }
    </style>
</head>
<body>

    <div class="universe-path">
        <a href="#" class="universe-logo" onclick="goBack()"> 
            <svg class="logo-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke-dasharray="2 2" />
                <circle cx="12" cy="12" r="4" fill="#ff2d55" />
                <path d="M12 2L12 6M12 18L12 22M2 12L6 12M18 12L22 12" />
            </svg>
            <span class="logo-text">Control Tower</span>
        </a>
    </div>

    <div class="board-container">
        <div class="board-header">
            <h2 style="font-weight: 400; letter-spacing: 2px;">FREE BOARD</h2>
            <button class="write-btn" onclick="goToWrite()">글쓰기</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">번호</th>
                    <th>제목</th>
                    <th style="width: 120px;">작성자</th>
                    <th style="width: 140px;">날짜</th>
                    <th style="width: 80px;">조회수</th>
                </tr>
            </thead>
            <tbody id="boardContent">
                </tbody>
        </table>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, query, orderBy, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSy...", 
            authDomain: "universe-han-ji-woo.firebaseapp.com",
            projectId: "universe-han-ji-woo",
            storageBucket: "universe-han-ji-woo.appspot.com",
            messagingSenderId: "8472...",
            appId: "1:8472..."
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 🔥 실시간 목록 연동 (말머리, 좋아요 수 포함)
        const q = query(collection(db, "freeboard"), orderBy("timestamp", "desc"));
        onSnapshot(q, (querySnapshot) => {
            const boardContent = document.getElementById('boardContent');
            boardContent.innerHTML = "";
            let no = querySnapshot.size;

            querySnapshot.forEach((doc) => {
                const data = doc.data();
                let dateStr = "-";
                if (data.timestamp) {
                    const d = new Date(data.timestamp.seconds * 1000);
                    dateStr = `${d.getFullYear()}. ${String(d.getMonth() + 1).padStart(2, '0')}. ${String(d.getDate()).padStart(2, '0')}.`;
                }
                
                // 제목 옆에 좋아요 수 실시간 표시
                const likeTag = data.likes > 0 ? `<span style="color:#ff2d55; font-size:12px; margin-left:5px;">❤️ ${data.likes}</span>` : "";

                const row = `
                    <tr>
                        <td>${no--}</td>
                        <td class="title-cell" onclick="location.href='view.html?id=${doc.id}&user=${encodeURIComponent(getUserName())}'">
                            <span class="category">[${data.category || '일반'}]</span> ${data.title} ${likeTag}
                        </td>
                        <td>${data.writer}</td>
                        <td style="color:#8a94a6; font-size:13px;">${dateStr}</td>
                        <td>${data.views || 0}</td>
                    </tr>
                `;
                boardContent.innerHTML += row;
            });
        });
    </script>

    <script>
        function getUserName() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('user') || "Unknown";
        }
        function goBack() { location.href = `menu.html?user=${encodeURIComponent(getUserName())}`; }
        function goToWrite() { location.href = `write.html?user=${encodeURIComponent(getUserName())}`; }
    </script>
</body>
</html>
