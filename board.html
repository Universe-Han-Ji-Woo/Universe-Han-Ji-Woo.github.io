<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe | Free Board</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050a10; color: #fff; font-family: 'Apple SD Gothic Neo', sans-serif; }
        .universe-bg { position: fixed; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a2a3a 0%, #050a10 80%); z-index: -1; }
        .container { max-width: 1000px; margin: 0 auto; padding: 50px 20px; position: relative; z-index: 10; }

        /* --- 상단 헤더 영역 --- */
        .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #8ea8c9; padding-bottom: 15px; }
        .board-header h1 { margin: 0; font-size: 1.6rem; color: #fff; letter-spacing: 2px; }
        .btn-write-trigger { background: #ff2d55; color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }

        /* --- 게시판 목록 테이블 --- */
        .board-table { width: 100%; border-collapse: collapse; margin-top: 10px; background: rgba(255,255,255,0.02); }
        .board-table th { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.2); color: #8ea8c9; font-size: 0.9rem; background: rgba(142,168,204,0.05); }
        .board-table td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; font-size: 0.85rem; }
        .td-title { text-align: left !important; padding-left: 20px !important; color: #e0e0e0; }
        .tag { font-weight: bold; margin-right: 6px; }
        .tag-공지 { color: #ff5252; } .tag-수다 { color: #8ea8c9; } .tag-정보 { color: #4caf50; }

        /* --- 글쓰기 화면 영역 --- */
        #writePage { display: none; background: rgba(255,255,255,0.05); padding: 40px; border-radius: 15px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .write-label { display: block; margin-bottom: 10px; font-size: 1.2rem; font-weight: bold; color: #ff2d55; }
        .input-group { margin-bottom: 15px; }
        .w-input { width: 100%; background: #fff; border: 1px solid #ddd; color: #333; padding: 12px; border-radius: 4px; box-sizing: border-box; outline: none; font-size: 1rem; }
        .w-textarea { height: 350px; resize: none; }
        .w-readonly { background: #f5f5f5; color: #777; cursor: default; }

        .write-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 20px; }
        .like-btn { display: flex; align-items: center; gap: 8px; color: #ff2d55; font-size: 1.1rem; cursor: pointer; font-weight: bold; }
        .like-btn span { color: #fff; font-size: 0.9rem; }
        .btn-group { display: flex; gap: 10px; }
        .btn-base { padding: 10px 25px; border-radius: 4px; cursor: pointer; border: none; font-weight: bold; font-size: 0.9rem; }
        .btn-cancel { background: #fff; color: #333; border: 1px solid #ccc; }
        .btn-submit { background: #ff2d55; color: #fff; }

        /* --- 페이징 & 검색 --- */
        .paging-area { display: flex; justify-content: center; gap: 8px; margin: 30px 0; }
        .p-num { padding: 5px 12px; border: 1px solid #444; cursor: pointer; font-size: 0.8rem; border-radius: 3px; }
        .p-num.active { background: #8ea8c9; color: #050a10; border-color: #8ea8c9; }
        .search-bar { display: flex; justify-content: center; gap: 8px; }
        .search-bar input { background: #000; border: 1px solid #444; color: #fff; padding: 8px 15px; width: 250px; }

        .back-btn { position: fixed; top: 30px; left: 30px; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; cursor: pointer; color: #fff; font-size: 0.7rem; background: rgba(0,0,0,0.3); z-index: 100; }
    </style>
</head>
<body>
    <div class="universe-bg"></div>
    <div class="back-btn" onclick="location.href='menu.html'+location.search">← HUB로 복귀</div>

    <div class="container">
        <div id="listPage">
            <div class="board-header">
                <h1>자유게시판</h1>
                <button class="btn-write-trigger" onclick="openWrite()">글쓰기</button>
            </div>
            <table class="board-table">
                <thead>
                    <tr>
                        <th width="60">번호</th>
                        <th>제목</th>
                        <th width="140">작성자</th>
                        <th width="120">작성일</th>
                        <th width="80">조회수</th>
                    </tr>
                </thead>
                <tbody id="boardBody">
                    <tr>
                        <td>필독</td>
                        <td class="td-title"><span class="tag tag-공지">[공지]</span> 유니버스 게시판 탐사 수칙 안내</td>
                        <td>관리자</td>
                        <td>2026.03.11</td>
                        <td>254</td>
                    </tr>
                </tbody>
            </table>
            
            <div class="paging-area">
                <div class="p-num active">1</div><div class="p-num">2</div><div class="p-num">3</div><div class="p-num">></div>
            </div>

            <div class="search-bar">
                <select class="w-input" style="width:100px; padding:5px; height: 35px;"><option>제목만</option></select>
                <input type="text" placeholder="검색어를 입력해주세요">
                <button class="btn-base" style="background:#2ecc71; color:white; padding: 0 20px; height: 35px;">검색</button>
            </div>
        </div>

        <div id="writePage">
            <span class="write-label">자유게시판 글쓰기</span>
            <div class="input-group">
                <select id="postTag" class="w-input" style="width: 150px; margin-bottom: 10px;">
                    <option value="수다">수다</option>
                    <option value="정보">정보</option>
                    <option value="공지">공지</option>
                </select>
                <input type="text" id="postTitle" class="w-input" placeholder="제목을 입력하세요">
            </div>
            <div class="input-group">
                <input type="text" id="postUser" class="w-input w-readonly" readonly>
            </div>
            <div class="input-group">
                <textarea id="postContent" class="w-input w-textarea" placeholder="조윤 배우님께 전할 메시지나 팬들의 따뜻한 이야기를 들려주세요!"></textarea>
            </div>
            
            <div class="write-footer">
                <div class="like-btn">♥ <span>좋아요</span></div>
                <div class="btn-group">
                    <button class="btn-base btn-cancel" onclick="closeWrite()">취소</button>
                    <button class="btn-base btn-submit" onclick="submitPost()">등록하기</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentUser = urlParams.get('user') || "탐사대원";
        let postCount = 1;

        function openWrite() {
            document.getElementById('listPage').style.display = 'none';
            document.getElementById('writePage').style.display = 'block';
            document.getElementById('postUser').value = currentUser;
        }

        function closeWrite() {
            document.getElementById('writePage').style.display = 'none';
            document.getElementById('listPage').style.display = 'block';
        }

        function submitPost() {
            const tag = document.getElementById('postTag').value;
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            const date = new Date().toLocaleDateString();

            if(!title.trim() || !content.trim()) return alert("제목과 내용을 모두 입력해 주세요!");

            const table = document.getElementById('boardBody');
            const newRow = `
                <tr>
                    <td>${postCount++}</td>
                    <td class="td-title"><span class="tag tag-${tag}">[${tag}]</span> ${title}</td>
                    <td>${currentUser}</td>
                    <td>${date}</td>
                    <td>0</td>
                </tr>
            `;
            
            table.insertAdjacentHTML('afterbegin', newRow);
            alert("유니버스 통신망에 글이 등록되었습니다.");
            
            // 초기화 후 복귀
            document.getElementById('postTitle').value = "";
            document.getElementById('postContent').value = "";
            closeWrite();
        }
    </script>
</body>
</html>
