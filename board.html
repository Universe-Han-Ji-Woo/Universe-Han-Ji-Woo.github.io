<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe | Free Board</title>
    <style>
        :root { --main-red: #ff2d55; --bg-dark: #050a10; --text-gray: #8ea8c9; }
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: var(--bg-dark); color: #fff; font-family: 'Apple SD Gothic Neo', sans-serif; }
        .universe-bg { position: fixed; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a2a3a 0%, #050a10 80%); z-index: -1; }
        .container { max-width: 850px; margin: 0 auto; padding: 60px 20px; position: relative; z-index: 10; }
        
        .board-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 20px; border-bottom: 2px solid var(--main-red); padding-bottom: 10px; }
        .btn { background: var(--main-red); color: white; border: none; padding: 8px 18px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-sub { background: #333; color: #ccc; border: none; padding: 8px 18px; border-radius: 4px; cursor: pointer; }

        table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.03); border-radius: 8px; overflow: hidden; }
        th { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.1); color: var(--text-gray); font-size: 0.85rem; background: rgba(255,255,255,0.05); }
        td { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.03); text-align: center; font-size: 0.85rem; }
        .td-title { text-align: left; cursor: pointer; padding-left: 20px; font-size: 0.9rem; }

        .content-box { display: none; background: rgba(255, 255, 255, 0.05); padding: 35px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .view-title { font-size: 1.6rem; margin-bottom: 10px; color: var(--main-red); font-weight: bold; }
        .view-info { font-size: 0.85rem; color: var(--text-gray); border-bottom: 1px solid #333; padding-bottom: 15px; margin-bottom: 20px; }
        .view-body { min-height: 250px; line-height: 1.7; white-space: pre-wrap; font-size: 1rem; color: #ddd; }

        /* 좋아요 버튼 레이아웃 */
        .like-container { display: flex; align-items: center; gap: 8px; margin-top: 30px; }
        #likeBtn { display: none; background: none; border: 1px solid var(--main-red); color: var(--main-red); padding: 8px 18px; border-radius: 20px; cursor: pointer; font-weight: bold; align-items: center; gap: 5px; }
        #likeBtn.clicked { background: var(--main-red); color: white; }

        .pagination { display: flex; justify-content: center; gap: 8px; margin-top: 25px; }
        .page-btn { background: none; border: 1px solid #333; color: var(--text-gray); padding: 4px 10px; cursor: pointer; }
        .page-btn.active { background: var(--main-red); color: white; border-color: var(--main-red); }
        .w-input { width: 100%; background: #fff; color: #333; padding: 12px; border-radius: 4px; box-sizing: border-box; margin-bottom: 15px; border: 1px solid #ddd; }
        .w-textarea { height: 350px; resize: none; }
    </style>
</head>
<body>
    <div class="universe-bg"></div>
    <div class="container">
        
        <div id="listPage">
            <div class="board-header">
                <h1>FREE BOARD</h1>
                <button class="btn" onclick="openWrite()">글쓰기</button>
            </div>
            <table>
                <thead>
                    <tr><th width="50">NO</th><th>TITLE</th><th width="90">USER</th><th width="100">DATE</th><th width="60">VIEWS</th></tr>
                </thead>
                <tbody id="boardBody"></tbody>
            </table>
            <div class="pagination" id="pagination"></div>
        </div>

        <div id="viewPage" class="content-box">
            <div id="viewTitle" class="view-title"></div>
            <div id="viewInfo" class="view-info"></div>
            <div id="viewBody" class="view-body"></div>
            
            <div style="display: flex; justify-content: space-between; align-items: flex-end;">
                <div class="like-container">
                    <button id="likeBtn" onclick="handleLike()">
                        ❤️ 좋아요 <span id="likeCount">0</span>
                    </button>
                </div>
                <button class="btn-sub" onclick="closeView()">목록으로</button>
            </div>
        </div>

        <div id="writePage" class="content-box">
            <h2 style="margin-top:0;">WRITE</h2>
            <input type="text" id="postTitle" class="w-input" placeholder="제목">
            <textarea id="postContent" class="w-input w-textarea" placeholder="내용을 입력하세요"></textarea>
            <div style="text-align: right;">
                <button class="btn-sub" style="margin-right:8px;" onclick="closeWrite()">취소</button>
                <button id="submitBtn" class="btn" onclick="submitPost()">등록</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwgMzQi8ib58Qkld2aUED-cnuaQQ9wWwd8Z1b-ym96o3hfKRP59yes3GnwgC-7LQEkk7w/exec";
        const CURRENT_USER = "관리자"; // 현재 로그인한 사용자 이름 (예시)
        let allPosts = [];
        let currentPage = 1;
        let currentPostIdx = -1;
        const postsPerPage = 12;

        async function loadPosts() {
            const res = await fetch(API_URL);
            allPosts = await res.json();
            renderBoard();
        }

        function renderBoard() {
            const tbody = document.getElementById('boardBody');
            const start = (currentPage - 1) * postsPerPage;
            const currentPosts = allPosts.slice().reverse().slice(start, start + postsPerPage);

            tbody.innerHTML = currentPosts.map((p, i) => {
                const title = p.Title || p.title || "제목 없음";
                const user = p.User || p.user || "익명";
                const date = (p.Date || p.date || "").split('T')[0] || "-";
                const views = p.Views || p.views || 0;
                const realIndex = allPosts.length - 1 - (start + i);

                return `<tr>
                    <td>${allPosts.length - (start + i)}</td>
                    <td class="td-title" onclick="viewPost(${realIndex})">${title}</td>
                    <td>${user}</td>
                    <td style="color:#666;">${date}</td>
                    <td>${views}</td>
                </tr>`;
            }).join('');
            renderPagination();
        }

        function viewPost(idx) {
            currentPostIdx = idx;
            const p = allPosts[idx];
            const writer = p.User || p.user || "익명";
            
            document.getElementById('listPage').style.display = 'none';
            document.getElementById('viewPage').style.display = 'block';
            document.getElementById('viewTitle').innerText = p.Title || p.title;
            document.getElementById('viewInfo').innerText = `BY ${writer} | ${p.Date || ''} | 조회수 ${p.Views || 0}`;
            document.getElementById('viewBody').innerText = p.Content || p.content;
            document.getElementById('likeCount').innerText = p.Likes || p.likes || 0;

            // 핵심 기능: 작성자가 내가 아닐 때만 좋아요 버튼 표시
            const likeBtn = document.getElementById('likeBtn');
            if(writer !== CURRENT_USER) {
                likeBtn.style.display = 'flex';
                likeBtn.classList.remove('clicked');
            } else {
                likeBtn.style.display = 'none';
            }
        }

        async function handleLike() {
            const btn = document.getElementById('likeBtn');
            if(btn.classList.contains('clicked')) return alert("이미 좋아요를 눌렀습니다.");
            const countSpan = document.getElementById('likeCount');
            countSpan.innerText = parseInt(countSpan.innerText) + 1;
            btn.classList.add('clicked');
            try {
                await fetch(API_URL, { method: 'POST', body: JSON.stringify({ action: 'like', id: allPosts[currentPostIdx].ID || allPosts[currentPostIdx].id })});
            } catch(e) {}
        }

        function closeView() { document.getElementById('viewPage').style.display = 'none'; document.getElementById('listPage').style.display = 'block'; }
        function openWrite() { document.getElementById('listPage').style.display = 'none'; document.getElementById('writePage').style.display = 'block'; }
        function closeWrite() { location.reload(); }

        async function submitPost() {
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            if(!title || !content) return alert("빈칸을 채워주세요.");
            await fetch(API_URL, { method: 'POST', body: JSON.stringify({ title, content, tag: '수다', user: CURRENT_USER }) });
            location.reload();
        }

        function renderPagination() {
            const totalPages = Math.ceil(allPosts.length / postsPerPage);
            const container = document.getElementById('pagination');
            container.innerHTML = "";
            for(let i=1; i<=totalPages; i++) {
                container.innerHTML += `<button class="page-btn ${i===currentPage?'active':''}" onclick="currentPage=${i};renderBoard();">${i}</button>`;
            }
        }
        window.onload = loadPosts;
    </script>
</body>
</html>
