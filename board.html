<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERSE | 자유게시판</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; background-color: #0b111e; color: white; font-family: 'Noto Sans KR', sans-serif; }
        .universe-path { width: 100%; padding: 30px 0 10px 0; display: flex; justify-content: center; align-items: center; }
        .universe-logo { text-decoration: none; display: flex; flex-direction: column; align-items: center; cursor: pointer; }
        .logo-icon { width: 45px; height: 45px; fill: none; stroke: #ff2d55; stroke-width: 1.2; filter: drop-shadow(0 0 8px rgba(255, 45, 85, 0.4)); }
        .logo-text { font-size: 10px; color: #ff2d55; letter-spacing: 4px; margin-top: 10px; text-transform: uppercase; }

        .board-container { max-width: 950px; margin: 0 auto; padding: 20px; }
        .board-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff2d55; padding-bottom: 15px; margin-bottom: 30px; }
        .write-btn { background-color: #ff2d55; color: white; padding: 10px 25px; border: none; border-radius: 20px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .write-btn:hover { background-color: #fff; color: #ff2d55; box-shadow: 0 0 20px #ff2d55; }
        
        table { width: 100%; border-collapse: collapse; background-color: #161d2a; border-radius: 12px; overflow: hidden; }
        th, td { padding: 18px 10px; text-align: center; border-bottom: 1px solid #242d3c; }
        th { color: #8a94a6; font-size: 13px; background-color: #1c2535; }
        .category { color: #ff2d55; font-weight: bold; margin-right: 5px; }
        .title-cell { text-align: left; cursor: pointer; padding-left: 20px; }
        .title-cell:hover { color: #ff2d55; text-decoration: underline; }
        .no-data { padding: 50px; color: #8a94a6; font-size: 14px; }
    </style>
</head>
<body>

    <div class="universe-path">
        <div class="universe-logo" onclick="goBack()"> 
            <svg class="logo-icon" viewBox="0 0 24 24">
                <circle cx="12" cy="12" r="10" stroke-dasharray="2 2" /><circle cx="12" cy="12" r="4" fill="#ff2d55" /><path d="M12 2L12 6M12 18L12 22M2 12L6 12M18 12L22 12" />
            </svg>
            <span class="logo-text">Control Tower</span>
        </div>
    </div>

    <div class="board-container">
        <div class="board-header">
            <h2 style="font-weight: 400; letter-spacing: 2px;">FREE BOARD</h2>
            <button class="write-btn" id="writeBtn">글쓰기</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th style="width: 60px;">번호</th>
                    <th>제목</th>
                    <th style="width: 120px;">작성자</th>
                    <th style="width: 140px;">날짜</th>
                    <th style="width: 80px;">조회수</th>
                </tr>
            </thead>
            <tbody id="boardContent">
                <tr><td colspan="5" class="no-data">데이터를 불러오는 중입니다...</td></tr>
            </tbody>
        </table>
    </div>

    <script type="module">
        // ❌ 구글 클라우드(Firestore) 모듈을 싹 걷어내고 Realtime DB 전용으로 변경
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, off } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // ✅ 관리자님의 진짜 실시간 DB 설정값 (jiwoo-fanpage)
        const firebaseConfig = {
            apiKey: "AIzaSyCD0OaaN1E5uT950X5hkzCBdqT87JQRXrg",
            databaseURL: "https://jiwoo-fanpage-default-rtdb.firebaseio.com",
            projectId: "jiwoo-fanpage"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const postsRef = ref(db, 'posts_v2'); // 캡처에서 확인된 진짜 경로

        // ✅ 불필요한 리스너 중복 방지
        off(postsRef);

        // ✅ 실시간 데이터 로드 시작
        onValue(postsRef, (snapshot) => {
            const boardContent = document.getElementById('boardContent');
            boardContent.innerHTML = "";
            
            const data = snapshot.val();
            if (data) {
                // 데이터를 배열로 변환 후 최신순 정렬
                const items = Object.keys(data).map(key => ({ id: key, ...data[key] }));
                items.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0)); 

                let no = items.length;
                items.forEach((post) => {
                    const row = `
                        <tr>
                            <td>${no--}</td>
                            <td class="title-cell" onclick="location.href='view.html?id=${post.id}&user=${encodeURIComponent(getUserName())}'">
                                <span class="category">[${post.category || '일반'}]</span> ${post.title || '제목 없음'}
                            </td>
                            <td>${post.writer || post.author || '익명'}</td>
                            <td style="color:#8a94a6; font-size:13px;">${post.date || '-'}</td>
                            <td>${post.views || 0}</td>
                        </tr>
                    `;
                    boardContent.innerHTML += row;
                });
            } else {
                boardContent.innerHTML = "<tr><td colspan='5' class='no-data'>등록된 게시글이 없습니다.</td></tr>";
            }
        }, (error) => {
            console.error("연결 오류:", error);
            document.getElementById('boardContent').innerHTML = "<tr><td colspan='5' class='no-data'>서버 연결에 실패했습니다. (API 확인 필요)</td></tr>";
        });

        // ✅ 글쓰기 버튼 (파라미터 안전 전달)
        document.getElementById('writeBtn').addEventListener('click', () => {
            const user = getUserName();
            location.href = `write.html?user=${encodeURIComponent(user)}`;
        });
    </script>

    <script>
        function getUserName() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('user') || "Unknown";
        }
        function goBack() { 
            location.href = `menu.html?user=${encodeURIComponent(getUserName())}`; 
        }
    </script>
</body>
</html>
