<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe | Free Board</title>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #050a10; color: #fff; font-family: 'Apple SD Gothic Neo', sans-serif; overflow-x: hidden; }
        .universe-bg { position: fixed; width: 100%; height: 100%; background: radial-gradient(circle at 50% 50%, #1a2a3a 0%, #050a10 80%); z-index: -1; }
        .container { max-width: 1000px; margin: 0 auto; padding: 50px 20px; position: relative; z-index: 10; }
        .board-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #8ea8c9; padding-bottom: 15px; }
        .btn-write-trigger { background: #ff2d55; color: white; border: none; padding: 8px 20px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .board-table { width: 100%; border-collapse: collapse; background: rgba(255,255,255,0.02); }
        .board-table th { padding: 12px; border-bottom: 1px solid rgba(255,255,255,0.2); color: #8ea8c9; font-size: 0.9rem; background: rgba(142,168,204,0.05); }
        .board-table td { padding: 15px 12px; border-bottom: 1px solid rgba(255,255,255,0.05); text-align: center; font-size: 0.85rem; }
        .td-title { text-align: left !important; padding-left: 20px !important; color: #e0e0e0; cursor: pointer; }
        .tag { font-weight: bold; margin-right: 6px; padding: 2px 6px; border-radius: 3px; font-size: 0.75rem; }
        .tag-공지 { background: rgba(255, 82, 82, 0.2); color: #ff5252; }
        .tag-수다 { background: rgba(142, 168, 204, 0.2); color: #8ea8c9; }
        .tag-정보 { background: rgba(76, 175, 80, 0.2); color: #4caf50; }
        #writePage { display: none; background: rgba(255,255,255,0.05); padding: 40px; border-radius: 15px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .w-input { width: 100%; background: #fff; border: 1px solid #ddd; color: #333; padding: 12px; border-radius: 4px; box-sizing: border-box; outline: none; margin-bottom: 15px; }
        .w-textarea { height: 300px; resize: none; }
        .loading { text-align: center; padding: 40px; color: #8ea8c9; font-size: 1.1rem; }
        .back-btn { position: fixed; top: 30px; left: 30px; padding: 8px 16px; border: 1px solid rgba(255,255,255,0.2); border-radius: 20px; cursor: pointer; color: #fff; font-size: 0.75rem; background: rgba(0,0,0,0.3); z-index: 100; text-decoration: none; }
    </style>
</head>
<body>
    <div class="universe-bg"></div>
    <a href="menu.html" class="back-btn">← HUB로 복귀</a>

    <div class="container">
        <div id="listPage">
            <div class="board-header">
                <h1>자유게시판</h1>
                <button class="btn-write-trigger" onclick="openWrite()">글쓰기</button>
            </div>
            <div id="loadingStatus" class="loading">✨ 우주 데이터 수신 중...</div>
            <table class="board-table">
                <thead>
                    <tr>
                        <th width="60">번호</th>
                        <th>제목</th>
                        <th width="140">작성자</th>
                        <th width="120">작성일</th>
                        <th width="80">조회수</th>
                    </tr>
                </thead>
                <tbody id="boardBody"></tbody>
            </table>
        </div>

        <div id="writePage">
            <h2 style="color:#ff2d55;">글 작성하기</h2>
            <select id="postTag" class="w-input" style="width: 120px;">
                <option value="수다">수다</option>
                <option value="정보">정보</option>
                <option value="공지">공지</option>
            </select>
            <input type="text" id="postTitle" class="w-input" placeholder="제목을 입력하세요">
            <textarea id="postContent" class="w-input w-textarea" placeholder="내용을 입력하세요"></textarea>
            <div style="display: flex; justify-content: flex-end; gap: 10px;">
                <button class="btn-write-trigger" style="background:#555;" onclick="closeWrite()">취소</button>
                <button id="submitBtn" class="btn-write-trigger" onclick="submitPost()">등록하기</button>
            </div>
        </div>
    </div>

    <script>
        // 관리자님이 새로 주신 주소 적용
        const API_URL = "https://script.google.com/macros/s/AKfycbyrGuUugv38NIT_RTU-W8zvtIe_viNb46qpkhEVRlYt6ryxLdU06y_odo8T3ADF1YFn_g/exec";
        const urlParams = new URLSearchParams(window.location.search);
        const currentUser = urlParams.get('user') || "Admin";

        async function loadPosts() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                renderBoard(data);
            } catch (e) {
                document.getElementById('loadingStatus').innerText = "데이터 연결 실패! 시트 헤더를 확인해주세요.";
            } finally {
                document.getElementById('loadingStatus').style.display = 'none';
            }
        }

        function renderBoard(posts) {
            const tbody = document.getElementById('boardBody');
            if (posts.length === 0) {
                tbody.innerHTML = '<tr><td colspan="5" style="padding:50px;">첫 게시글을 남겨보세요!</td></tr>';
                return;
            }
            // 시트 헤더가 Title, Tag, User 등 대문자로 시작한다고 가정합니다.
            tbody.innerHTML = posts.map((p, idx) => `
                <tr>
                    <td>${idx + 1}</td>
                    <td class="td-title"><span class="tag tag-${p.Tag}">[${p.Tag}]</span> ${p.Title || '제목 없음'}</td>
                    <td>${p.User || '익명'}</td>
                    <td>${p.Date || '-'}</td>
                    <td>${p.Views || 0}</td>
                </tr>
            `).reverse().join('');
        }

        async function submitPost() {
            const title = document.getElementById('postTitle').value;
            const content = document.getElementById('postContent').value;
            const tag = document.getElementById('postTag').value;

            if(!title || !content) return alert("빈칸을 채워주세요!");

            const btn = document.getElementById('submitBtn');
            btn.innerText = "전송 중...";
            btn.disabled = true;

            try {
                await fetch(API_URL, {
                    method: 'POST',
                    body: JSON.stringify({ title, content, tag, user: currentUser })
                });
                alert("우주로 전송 완료!");
                location.reload();
            } catch (e) {
                alert("전송 실패!");
                btn.disabled = false;
                btn.innerText = "등록하기";
            }
        }

        function openWrite() { document.getElementById('listPage').style.display = 'none'; document.getElementById('writePage').style.display = 'block'; }
        function closeWrite() { document.getElementById('writePage').style.display = 'none'; document.getElementById('listPage').style.display = 'block'; }

        window.onload = loadPosts;
    </script>
</body>
</html>
