<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>JIWOO ARCHIVE</title>
    <style>
        body { margin: 0; background-color: #f8f9fa; font-family: 'Apple SD Gothic Neo', sans-serif; color: #333; }
        
        /* 상단 네비게이션 */
        .nav-bar { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding: 20px; 
            max-width: 1000px; 
            margin: 0 auto; 
        }
        .nav-left { display: flex; align-items: center; gap: 20px; }
        .home-icon { font-size: 1.5rem; text-decoration: none; cursor: pointer; }
        .menu-link { 
            text-decoration: none; 
            color: #a5b8d0; 
            font-size: 0.85rem; 
            font-weight: bold; 
            letter-spacing: 1px;
            transition: 0.3s;
        }
        .menu-link:hover { color: #1a1a1a; }

        /* 메인 컨테이너 */
        .archive-container { width: 92%; max-width: 1000px; margin: 20px auto; padding-bottom: 50px; }
        .archive-header { text-align: center; margin-bottom: 40px; }
        .archive-title { font-family: 'Arial Black', sans-serif; font-size: 2rem; letter-spacing: 8px; color: #1a1a1a; margin-bottom: 10px; }
        .archive-subtitle { font-size: 0.8rem; color: #a5b8d0; letter-spacing: 3px; font-weight: bold; }

        /* 영상 그리드 레이아웃 */
        .video-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); 
            gap: 25px; 
        }
        .video-card { 
            background: white; 
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.05); 
            transition: transform 0.3s ease;
        }
        .video-card:hover { transform: translateY(-8px); }
        
        /* 🎥 영상 플레이어 스타일 (포스터/썸네일 적용) */
        video {
            width: 100%;
            aspect-ratio: 16 / 9;
            background: #000;
            display: block;
            object-fit: cover;
        }
        
        .video-info { padding: 20px; border-top: 1px solid #f1f1f1; }
        .video-name { 
            font-size: 1rem; 
            font-weight: 800; 
            color: #222; 
            margin: 0; 
            line-height: 1.4;
            letter-spacing: -0.5px;
        }
        .video-desc {
            font-size: 0.75rem;
            color: #8ea8c9;
            margin-top: 8px;
            line-height: 1.5;
            font-weight: 500;
        }

        @media (max-width: 768px) {
            .video-grid { grid-template-columns: 1fr; }
            .archive-title { font-size: 1.5rem; }
        }
    </style>
</head>
<body>
    <div class="nav-bar">
        <div class="nav-left">
            <a href="index.html" class="home-icon">🏠</a>
            <a href="board.html" class="menu-link">QUEST BOOK</a>
        </div>
        <div class="user-info" style="font-size: 0.75rem; color: #8ea8c9; font-weight: bold;">
            ADMIN : <span id="displayNick">관리자</span>
        </div>
    </div>

    <div class="archive-container">
        <div class="archive-header">
            <h1 class="archive-title">ARCHIVE</h1>
            <p class="archive-subtitle">은하의 기록 : 배우 한지우의 모든 순간</p>
        </div>

        <div class="video-grid" id="videoGrid">
            <div class="video-card">
                <video controls poster="thumbnail1.png">
                    <source src="온앤오프3 홍보 티져.mp4" type="video/mp4">
                    브라우저가 영상을 지원하지 않습니다.
                </video>
                <div class="video-info">
                    <p class="video-name">ON & OFF SEASON 3 : <br>The Beginning of Universe</p>
                    <p class="video-desc">팬들의 진심을 담아 제작된 8초의 전율, <br>배우 한지우의 새로운 시작을 알리는 프로모션 티저입니다.</p>
                </div>
            </div>

            </div>
    </div>

    <script>
        // 🛡️ 보안 로직: 관리자 닉네임이 아니면 추방
        window.addEventListener('DOMContentLoaded', () => {
            const isLoggedIn = sessionStorage.getItem('isLoggedIn');
            const userNick = sessionStorage.getItem('userNick');

            if (isLoggedIn !== 'true' || userNick !== '관리자') {
                alert("은하의 접근 권한이 없습니다. 관리자로 로그인해 주세요.");
                location.href = "index.html";
            } else {
                document.getElementById('displayNick').innerText = userNick;
            }
        });
    </script>
</body>
</html>
