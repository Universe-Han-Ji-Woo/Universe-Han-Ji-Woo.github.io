<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERSE | 게시글 보기</title>
    <style>
        body { margin: 0; background-color: #f5f6f8; font-family: sans-serif; }
        .view-container { max-width: 850px; margin: 30px auto; background: white; padding: 40px; border: 1px solid #ddd; border-radius: 8px; position: relative; }
        .post-header { border-bottom: 1px solid #eee; padding-bottom: 20px; margin-bottom: 30px; }
        .post-title { font-size: 28px; margin-bottom: 15px; }
        .post-info { display: flex; align-items: center; font-size: 13px; color: #666; }
        .admin-btns { position: absolute; top: 40px; right: 40px; }
        .content-area { min-height: 300px; line-height: 1.8; font-size: 16px; margin-bottom: 50px; }
        .like-section { border-top: 1px solid #eee; padding-top: 20px; display: flex; align-items: center; gap: 10px; }
        .like-btn { cursor: pointer; border: 1px solid #eee; padding: 8px 15px; border-radius: 20px; background: white; display: flex; align-items: center; gap: 5px; }
        .btn-sm { font-size: 12px; padding: 5px 10px; cursor: pointer; background: none; border: 1px solid #ddd; margin-left: 5px; }
    </style>
</head>
<body>
    <div class="view-container">
        <div class="admin-btns">
            <button class="btn-sm" id="editBtn">수정</button>
            <button class="btn-sm" id="deleteBtn" style="color:red;">삭제</button>
        </div>
        <div class="post-header">
            <div class="post-title" id="postTitle">제목 로딩 중...</div>
            <div class="post-info">
                <span id="postWriter" style="font-weight:bold; color:#333; margin-right:15px;">작성자</span>
                <span id="postDate">0000.00.00</span>
                <span style="margin-left:15px;">조회 <span id="postViews">0</span></span>
            </div>
        </div>
        <div class="content-area" id="postContent">내용을 불러오고 있습니다...</div>
        <div class="like-section">
            <button class="like-btn" id="likeBtn">
                ❤️ <span id="likeCount">0</span>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get, update, remove } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = { databaseURL: "https://jiwoo-fanpage-default-rtdb.firebaseio.com", projectId: "jiwoo-fanpage" };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const user = urlParams.get('user');
        const postRef = ref(db, `posts_v2/${postId}`);

        // 데이터 로드
        get(postRef).then((snapshot) => {
            const data = snapshot.val();
            if(data) {
                document.getElementById('postTitle').innerText = data.title;
                document.getElementById('postWriter').innerText = data.writer;
                document.getElementById('postDate').innerText = data.date;
                document.getElementById('postContent').innerText = data.content;
                document.getElementById('postViews').innerText = (data.views || 0) + 1;
                document.getElementById('likeCount').innerText = data.likes || 0;
                
                // 조회수 업데이트
                update(postRef, { views: (data.views || 0) + 1 });
            }
        });

        // 좋아요 기능
        document.getElementById('likeBtn').onclick = async () => {
            const snapshot = await get(postRef);
            const currentLikes = snapshot.val().likes || 0;
            await update(postRef, { likes: currentLikes + 1 });
            document.getElementById('likeCount').innerText = currentLikes + 1;
        };

        // 삭제 기능
        document.getElementById('deleteBtn').onclick = async () => {
            if(confirm("정말 이 글을 삭제하시겠습니까?")) {
                await remove(postRef);
                alert("삭제되었습니다.");
                location.href = `board.html?user=${encodeURIComponent(user)}`;
            }
        };

        // 수정 페이지 이동 (edit.html 필요)
        document.getElementById('editBtn').onclick = () => {
            location.href = `edit.html?id=${postId}&user=${encodeURIComponent(user)}`;
        };
    </script>
</body>
</html>
