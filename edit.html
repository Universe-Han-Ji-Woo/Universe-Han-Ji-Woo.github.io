<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIVERSE | 글 수정하기</title>
    <style>
        body { margin: 0; background-color: #0b111e; color: white; font-family: sans-serif; }
        .edit-container { max-width: 850px; margin: 30px auto; background: #161d2a; padding: 40px; border-radius: 12px; border: 1px solid #242d3c; }
        .header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #ff2d55; padding-bottom: 15px; margin-bottom: 20px; }
        input[type="text"] { width: 100%; padding: 15px 0; border: none; border-bottom: 1px solid #242d3c; background: transparent; color: white; font-size: 24px; font-weight: bold; outline: none; margin-bottom: 20px; }
        textarea { width: 100%; min-height: 400px; border: none; background: transparent; color: #cbd5e0; font-size: 16px; line-height: 1.6; outline: none; resize: none; }
        .footer { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .btn { padding: 10px 25px; border-radius: 20px; cursor: pointer; font-weight: bold; border: none; }
        .btn-submit { background-color: #ff2d55; color: white; }
        .btn-cancel { background-color: #3d4655; color: white; }
    </style>
</head>
<body>
    <div class="edit-container">
        <div class="header">
            <h2 style="margin:0; font-weight: 400;">글 수정하기</h2>
            <div class="footer">
                <button class="btn btn-cancel" onclick="history.back()">취소</button>
                <button class="btn btn-submit" id="updateBtn">수정완료</button>
            </div>
        </div>
        <input type="text" id="title" placeholder="제목">
        <textarea id="content" placeholder="내용을 입력하세요"></textarea>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        const firebaseConfig = {
            databaseURL: "https://jiwoo-fanpage-default-rtdb.firebaseio.com",
            projectId: "jiwoo-fanpage"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const postId = urlParams.get('id');
        const user = urlParams.get('user');
        const postRef = ref(db, `posts_v2/${postId}`);

        // 기존 데이터 불러오기
        get(postRef).then((snapshot) => {
            const data = snapshot.val();
            if(data) {
                document.getElementById('title').value = data.title;
                document.getElementById('content').value = data.content;
            }
        });

        // 수정 완료 버튼
        document.getElementById('updateBtn').onclick = async () => {
            const newTitle = document.getElementById('title').value;
            const newContent = document.getElementById('content').value;

            if(!newTitle || !newContent) return alert("내용을 입력해주세요.");

            await update(postRef, {
                title: newTitle,
                content: newContent,
                editDate: new Date().toLocaleDateString() // 수정일 표시용
            });

            alert("수정되었습니다.");
            location.href = `view.html?id=${postId}&user=${encodeURIComponent(user)}`;
        };
    </script>
</body>
</html>
