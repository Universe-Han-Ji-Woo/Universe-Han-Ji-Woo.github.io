<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe | Control Tower</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #050a10; color: #fff;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            display: flex; flex-direction: column; align-items: center;
            overflow: hidden;
        }

        /* 컨트롤 타워 배경 */
        .tower-bg {
            position: fixed; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1b2735 0%, #090a0f 100%);
            z-index: -1;
        }

        /* 상단 환영 섹션 */
        .welcome-section {
            margin-top: 10vh; text-align: center;
            animation: fadeInDown 1s ease-out;
        }
        .welcome-msg {
            font-size: 1.8rem; font-weight: bold; letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255,255,255,0.5);
        }
        .status-msg {
            color: #8ea8c9; font-size: 0.9rem; margin-top: 15px;
            letter-spacing: 4px; text-transform: uppercase;
        }

        /* 메뉴 카드 컨테이너 */
        .hub-container {
            display: flex; gap: 40px; margin-top: 10vh;
        }
        .hub-card {
            width: 200px; height: 300px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 15px;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            cursor: pointer; transition: 0.4s;
            backdrop-filter: blur(10px);
        }
        .hub-card:hover {
            transform: translateY(-20px);
            background: rgba(255,255,255,0.1);
            border-color: #fff;
            box-shadow: 0 0 30px rgba(255,255,255,0.2);
        }
        .hub-card i { font-size: 3rem; margin-bottom: 20px; }
        .hub-card span { font-size: 1rem; letter-spacing: 2px; }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-30px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
    <script>
        // URL에서 사용자 이름을 가져오는 함수
        const urlParams = new URLSearchParams(window.location.search);
        const userName = urlParams.get('user') || 'Explorer';

        function navigateTo(page) {
            location.href = `${page}.html?user=${encodeURIComponent(userName)}`;
        }

        window.onload = () => {
            // HTML 요소에 사용자 이름 주입
            document.getElementById('user-display').innerText = userName;
        };
    </script>
</head>
<body>
    <div class="tower-bg"></div>

    <div class="welcome-section">
        <div class="welcome-msg">Welcome back, <span id="user-display"></span>!</div>
        <div class="status-msg">현재 우주의 상태는 평온합니다</div>
    </div>

    <div class="hub-container">
        <div class="hub-card" onclick="navigateTo('gallery')">
            <div style="font-size: 40px; margin-bottom: 15px;">🌌</div>
            <span>GALLERY</span>
        </div>

        <div class="hub-card" onclick="alert('준비 중인 구역입니다.')">
            <div style="font-size: 40px; margin-bottom: 15px;">👤</div>
            <span>PROFILE</span>
        </div>

        <div class="hub-card" onclick="alert('준비 중인 구역입니다.')">
            <div style="font-size: 40px; margin-bottom: 15px;">🎬</div>
            <span>VIDEO</span>
        </div>
    </div>
</body>
</html>
