<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe | Control Tower</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #050a10;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            display: flex; align-items: center; justify-content: center;
        }

        .universe-bg {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a2a3a 0%, #050a10 80%);
            z-index: 1;
        }

        .control-tower {
            position: relative; z-index: 10;
            width: 500px; height: 500px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.8);
        }

        .core-identity { text-align: center; z-index: 20; }
        .univ-title {
            font-family: 'Arial Black', sans-serif;
            font-size: 2rem; color: #fff; letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(142, 168, 204, 0.8);
            margin: 0;
        }
        .user-welcome { color: #8ea8c9; font-size: 0.7rem; margin-top: 10px; letter-spacing: 3px; font-weight: bold; }

        /* 메인 아이콘들 */
        .icon-hub { position: absolute; width: 100%; height: 100%; z-index: 15; }
        .nav-item {
            position: absolute; width: 110px; height: 110px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; color: #fff; cursor: pointer;
            transition: all 0.4s ease;
        }
        .nav-item.top    { top: -15px; left: 50%; transform: translateX(-50%); }
        .nav-item.bottom { bottom: -15px; left: 50%; transform: translateX(-50%); }
        .nav-item.left   { left: -15px; top: 50%; transform: translateY(-50%); }
        .nav-item.right  { right: -15px; top: 50%; transform: translateY(-50%); }
        .nav-item:hover { background: rgba(142, 168, 204, 0.2); border-color: #8ea8c9; box-shadow: 0 0 20px rgba(142, 168, 204, 0.4); }

        .nav-label { font-size: 0.65rem; font-weight: 900; letter-spacing: 2px; }

        /* --- [관리자 오더] 방명록 위성 및 실선 --- */
        .guestbook-satellite {
            position: absolute;
            right: -180px; top: -50px; /* 메인 타워 옆으로 배치 */
            z-index: 25;
        }

        /* 하얀 실선 (The Link Line) */
        .link-line {
            position: absolute;
            width: 150px; height: 1px;
            background: linear-gradient(to right, rgba(255,255,255,0.8), transparent);
            top: 60px; right: 80px;
            transform: rotate(-25deg);
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* 방명록 위성 버튼 */
        .satellite-node {
            width: 80px; height: 80px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: 0.3s;
            box-shadow: 0 0 15px rgba(255,255,255,0.1);
        }
        .satellite-node:hover {
            background: #fff;
            box-shadow: 0 0 25px #fff;
        }
        .satellite-node:hover .node-label { color: #000; }
        
        .node-label {
            font-size: 0.55rem; color: #fff; font-weight: bold;
            letter-spacing: 1px; text-align: center;
        }
    </style>
    <script>
        function go(page) {
            const user = new URLSearchParams(window.location.search).get('user');
            if(user) location.href = `${page}?user=${encodeURIComponent(user)}`;
            else location.href = "index.html";
        }

        window.onload = () => {
            const user = new URLSearchParams(window.location.search).get('user');
            if (!user) { location.href = "index.html"; }
            else { document.getElementById('userName').innerText = user; }
        };
    </script>
</head>
<body>
    <div class="universe-bg"></div>

    <div class="control-tower">
        <div class="core-identity">
            <h1 class="univ-title">UNIVERSE</h1>
            <div class="user-welcome">ID: <span id="userName">---</span></div>
        </div>
        
        <div class="icon-hub">
            <div class="nav-item top" onclick="go('video.html')"><div class="nav-label">FILMOGRAPHY</div></div>
            <div class="nav-item right" onclick="go('board.html')"><div class="nav-label">FREE BOARD</div></div>
            <div class="nav-item bottom" onclick="go('index.html')"><div class="nav-label">GATE EXIT</div></div>
            <div class="nav-item left" onclick="go('#')"><div class="nav-label">ARCHIVE</div></div>
        </div>

        <div class="guestbook-satellite">
            <div class="link-line"></div> <div class="satellite-node" onclick="go('guestbook.html')">
                <div class="node-label">GUEST<br>BOOK</div>
            </div>
        </div>
    </div>
</body>
</html>
