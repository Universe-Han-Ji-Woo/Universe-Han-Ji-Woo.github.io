<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Universe | 컨트롤 타워</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #050a10;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex; align-items: center; justify-content: center;
        }

        /* 🌌 배경 설정 및 별들이 박힐 캔버스 영역 */
        .universe-bg {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a2a3a 0%, #050a10 80%);
            z-index: 1;
            overflow: hidden;
        }

        /* ✨ 이쑤시개로 콕콕 찌른 듯한 세하얀 별 스타일 */
        .star {
            position: absolute;
            background: #ffffff;
            border-radius: 50%;
            opacity: 0;
            pointer-events: none;
            animation: twinkle var(--duration) infinite ease-in-out;
            filter: drop-shadow(0 0 2px rgba(255, 255, 255, 0.8));
        }

        @keyframes twinkle {
            0%, 100% { opacity: var(--min-opacity); transform: scale(1); }
            50% { opacity: 1; transform: scale(1.2); }
        }

        /* 🛸 메인 컨트롤 타워 원형 (반응형 대응) */
        .control-tower {
            position: relative; z-index: 10;
            width: 500px; height: 500px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.8);
            animation: pulse 4s infinite ease-in-out;
            transition: transform 0.3s ease;
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 80px rgba(142, 168, 204, 0.1); }
            50% { box-shadow: 0 0 120px rgba(142, 168, 204, 0.3); }
        }

        .core-identity { text-align: center; z-index: 20; }
        .univ-title {
            font-family: 'Arial Black', sans-serif;
            font-size: 2.2rem; color: #fff; letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(142, 168, 204, 0.8);
            margin: 0;
        }
        .user-welcome { color: #8ea8c9; font-size: 0.8rem; margin-top: 10px; letter-spacing: 2px; font-weight: bold; }

        /* 메인 메뉴 스타일 */
        .icon-hub { position: absolute; width: 100%; height: 100%; z-index: 15; }
        .nav-item {
            position: absolute; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; color: #fff; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .nav-item:hover { 
            background: rgba(142, 168, 204, 0.2); 
            border-color: #8ea8c9; 
            box-shadow: 0 0 30px rgba(142, 168, 204, 0.6); 
            transform: scale(1.1);
        }

        /* 메뉴 위치 */
        .nav-item.top    { top: -25px; left: 50%; transform: translateX(-50%); }
        .nav-item.bottom { bottom: -25px; left: 50%; transform: translateX(-50%); }
        .nav-item.left   { left: -25px; top: 50%; transform: translateY(-50%); }
        .nav-item.right  { right: -25px; top: 50%; transform: translateY(-50%); }

        .nav-label-en { font-size: 0.6rem; color: #8ea8c9; letter-spacing: 1px; margin-bottom: 4px; }
        .nav-label-ko { font-size: 0.85rem; font-weight: bold; color: #fff; }

        /* 위성 공통 스타일 */
        .satellite-group { position: absolute; z-index: 25; }
        .guestbook-pos { right: -160px; top: -40px; }
        .line-right {
            position: absolute; width: 130px; height: 1px;
            background: linear-gradient(to right, rgba(142, 168, 204, 0.8), transparent);
            top: 55px; right: 75px; transform: rotate(-25deg);
        }
        .gallery-pos { left: -160px; top: -40px; }
        .line-left {
            position: absolute; width: 130px; height: 1px;
            background: linear-gradient(to left, rgba(142, 168, 204, 0.8), transparent);
            top: 55px; left: 75px; transform: rotate(25deg);
        }

        .satellite-node {
            width: 85px; height: 85px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; cursor: pointer; transition: 0.4s;
        }
        .satellite-node:hover { 
            background: #ffffff; 
            box-shadow: 0 0 30px #ffffff; 
            transform: translateY(-5px);
        }
        .node-en { font-size: 0.5rem; color: #8ea8c9; margin-bottom: 2px; }
        .node-ko { font-size: 0.75rem; color: #fff; font-weight: bold; }

        /* 📱 [반응형 핵심] 모바일/태블릿 대응 미디어 쿼리 */
        @media (max-width: 768px) {
            /* 1. 화면 폭에 맞춰 전체 크기 축소 */
            .control-tower {
                width: 320px;
                height: 320px;
            }
            .univ-title { font-size: 1.5rem; letter-spacing: 4px; }
            .user-welcome { font-size: 0.7rem; }

            /* 2. 중앙 메뉴 크기 축소 및 위치 조정 */
            .nav-item { width: 85px; height: 85px; }
            .nav-label-ko { font-size: 0.65rem; }
            .nav-label-en { display: none; } /* 모바일에서는 깔끔하게 한글만 표시 */

            .nav-item.top    { top: -15px; }
            .nav-item.bottom { bottom: -15px; }
            .nav-item.left   { left: -15px; }
            .nav-item.right  { right: -15px; }

            /* 3. 위성(갤러리, 방명록) 위치 모바일 최적화 */
            .guestbook-pos { right: -20px; top: -90px; }
            .gallery-pos { left: -20px; top: -90px; }
            
            .satellite-node { width: 65px; height: 65px; }
            .node-ko { font-size: 0.6rem; }
            .node-en { display: none; }

            .line-right, .line-left { display: none; } /* 모바일에서는 선 제거 (깔끔함 유지) */
        }

        /* 📱 아주 작은 스마트폰 (iPhone SE 등) 대응 */
        @media (max-width: 380px) {
            .control-tower {
                transform: scale(0.85); /* 화면을 넘칠 경우 전체 스케일 강제 축소 */
            }
        }
    </style>
    <script>
        function go(page) {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            if(user) location.href = `${page}?user=${encodeURIComponent(user)}`;
            else location.href = "index.html";
        }

        function createStars() {
            const bg = document.querySelector('.universe-bg');
            const starCount = window.innerWidth < 768 ? 80 : 150; // 모바일은 성능위해 별 개수 조절

            for (let i = 0; i < starCount; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = Math.random() * 1.5 + 1;
                const x = Math.random() * 100;
                const y = Math.random() * 100;
                const duration = Math.random() * 3 + 2; 
                const minOpacity = Math.random() * 0.3;

                star.style.width = `${size}px`;
                star.style.height = `${size}px`;
                star.style.left = `${x}%`;
                star.style.top = `${y}%`;
                star.style.setProperty('--duration', `${duration}s`);
                star.style.setProperty('--min-opacity', minOpacity);
                star.style.animationDelay = `${Math.random() * 5}s`;

                bg.appendChild(star);
            }
        }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            if (!user) { location.href = "index.html"; }
            else { 
                document.getElementById('userName').innerText = user; 
                createStars();
            }
        };
    </script>
</head>
<body>
    <div class="universe-bg"></div>

    <div class="control-tower">
        <div class="core-identity">
            <h1 class="univ-title">UNIVERSE</h1>
            <div class="user-welcome">탐사 대원: <span id="userName">---</span></div>
        </div>
        
        <div class="icon-hub">
            <div class="nav-item top" onclick="go('video.html')">
                <div class="nav-label-en">FILMOGRAPHY</div>
                <div class="nav-label-ko">작품 저장소</div>
            </div>
            <div class="nav-item right" onclick="go('board.html')">
                <div class="nav-label-en">FREE BOARD</div>
                <div class="nav-label-ko">자유 게시판</div>
            </div>
            <div class="nav-item bottom" onclick="go('index.html')">
                <div class="nav-label-en">EXIT GATE</div>
                <div class="nav-label-ko">처음으로</div>
            </div>
            <div class="nav-item left" onclick="go('#')">
                <div class="nav-label-en">ARCHIVE</div>
                <div class="nav-label-ko">기록 보관소</div>
            </div>
        </div>

        <div class="satellite-group gallery-pos">
            <div class="line-left"></div>
            <div class="satellite-node" onclick="go('gallery.html')">
                <div class="node-en">GALAXY</div>
                <div class="node-ko">갤러리</div>
            </div>
        </div>

        <div class="satellite-group guestbook-pos">
            <div class="line-right"></div>
            <div class="satellite-node" onclick="go('guestbook.html')">
                <div class="node-en">GUEST BOOK</div>
                <div class="node-ko">방명록</div>
            </div>
        </div>
    </div>
</body>
</html>
