<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe | 컨트롤 타워</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #050a10;
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            display: flex; align-items: center; justify-content: center;
        }

        .universe-bg {
            position: absolute; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1a2a3a 0%, #050a10 80%);
            z-index: 1;
        }

        /* [스타일 유지] 메인 컨트롤 타워 원형 */
        .control-tower {
            position: relative; z-index: 10;
            width: 500px; height: 500px;
            display: flex; align-items: center; justify-content: center;
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            box-shadow: 0 0 100px rgba(0, 0, 0, 0.8);
            animation: pulse 4s infinite ease-in-out; /* 은은한 박동 효과 추가 */
        }

        @keyframes pulse {
            0%, 100% { box-shadow: 0 0 80px rgba(142, 168, 204, 0.1); }
            50% { box-shadow: 0 0 120px rgba(142, 168, 204, 0.3); }
        }

        .core-identity { text-align: center; z-index: 20; }
        .univ-title {
            font-family: 'Arial Black', sans-serif;
            font-size: 2.2rem; color: #fff; letter-spacing: 8px;
            text-shadow: 0 0 20px rgba(142, 168, 204, 0.8);
            margin: 0;
        }
        .user-welcome { color: #8ea8c9; font-size: 0.8rem; margin-top: 10px; letter-spacing: 2px; font-weight: bold; }

        /* 메인 메뉴 스타일 */
        .icon-hub { position: absolute; width: 100%; height: 100%; z-index: 15; }
        .nav-item {
            position: absolute; width: 120px; height: 120px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; color: #fff; cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .nav-item:hover { 
            background: rgba(142, 168, 204, 0.2); 
            border-color: #8ea8c9; 
            box-shadow: 0 0 30px rgba(142, 168, 204, 0.6); 
            transform: scale(1.1);
        }

        /* 위치 설정 */
        .nav-item.top    { top: -25px; left: 50%; transform: translateX(-50%); }
        .nav-item.bottom { bottom: -25px; left: 50%; transform: translateX(-50%); }
        .nav-item.left   { left: -25px; top: 50%; transform: translateY(-50%); }
        .nav-item.right  { right: -25px; top: 50%; transform: translateY(-50%); }

        /* 글자 스타일 */
        .nav-label-en { font-size: 0.6rem; color: #8ea8c9; letter-spacing: 1px; margin-bottom: 4px; }
        .nav-label-ko { font-size: 0.85rem; font-weight: bold; color: #fff; }

        /* --- 위성 공통 스타일 (방명록 & 갤러리) --- */
        .satellite-group { position: absolute; z-index: 25; }
        
        /* [우측 상단] 방명록 위성 */
        .guestbook-pos { right: -160px; top: -40px; }
        .line-right {
            position: absolute; width: 130px; height: 1px;
            background: linear-gradient(to right, rgba(142, 168, 204, 0.8), transparent);
            top: 55px; right: 75px; transform: rotate(-25deg);
        }

        /* [좌측 상단] 갤러리 위성 */
        .gallery-pos { left: -160px; top: -40px; }
        .line-left {
            position: absolute; width: 130px; height: 1px;
            background: linear-gradient(to left, rgba(142, 168, 204, 0.8), transparent);
            top: 55px; left: 75px; transform: rotate(25deg);
        }

        .satellite-node {
            width: 85px; height: 85px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column; cursor: pointer; transition: 0.4s;
        }
        .satellite-node:hover { 
            background: #ffffff; 
            box-shadow: 0 0 30px #ffffff; 
            transform: translateY(-5px);
        }
        .satellite-node:hover .node-ko { color: #000; }
        .satellite-node:hover .node-en { color: #555; }
        
        .node-en { font-size: 0.5rem; color: #8ea8c9; margin-bottom: 2px; }
        .node-ko { font-size: 0.75rem; color: #fff; font-weight: bold; }
    </style>
    <script>
        function go(page) {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            // '자유 게시판' 클릭 시 board.html로 이동하도록 설계됨
            if(user) location.href = `${page}?user=${encodeURIComponent(user)}`;
            else location.href = "index.html";
        }

        window.onload = () => {
            const urlParams = new URLSearchParams(window.location.search);
            const user = urlParams.get('user');
            if (!user) { location.href = "index.html"; }
            else { document.getElementById('userName').innerText = user; }
        };
    </script>
</head>
<body>
    <div class="universe-bg"></div>

    <div class="control-tower">
        <div class="core-identity">
            <h1 class="univ-title">UNIVERSE</h1>
            <div class="user-welcome">탐사 대원: <span id="userName">---</span></div>
        </div>
        
        <div class="icon-hub">
            <div class="nav-item top" onclick="go('video.html')">
                <div class="nav-label-en">FILMOGRAPHY</div>
                <div class="nav-label-ko">작품 저장소</div>
            </div>
            <div class="nav-item right" onclick="go('board.html')">
                <div class="nav-label-en">FREE BOARD</div>
                <div class="nav-label-ko">자유 게시판</div>
            </div>
            <div class="nav-item bottom" onclick="go('index.html')">
                <div class="nav-label-en">EXIT GATE</div>
                <div class="nav-label-ko">처음으로</div>
            </div>
            <div class="nav-item left" onclick="go('#')">
                <div class="nav-label-en">ARCHIVE</div>
                <div class="nav-label-ko">기록 보관소</div>
            </div>
        </div>

        <div class="satellite-group gallery-pos">
            <div class="line-left"></div>
            <div class="satellite-node" onclick="go('gallery.html')">
                <div class="node-en">GALAXY</div>
                <div class="node-ko">갤러리</div>
            </div>
        </div>

        <div class="satellite-group guestbook-pos">
            <div class="line-right"></div>
            <div class="satellite-node" onclick="go('guestbook.html')">
                <div class="node-en">GUEST BOOK</div>
                <div class="node-ko">방명록</div>
            </div>
        </div>
    </div>
</body>
</html>
