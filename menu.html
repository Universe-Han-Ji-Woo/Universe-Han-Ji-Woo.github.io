<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universe | Planet Hub</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background: #000; color: #fff;
            font-family: 'Apple SD Gothic Neo', sans-serif;
            overflow: hidden;
            display: flex; flex-direction: column; align-items: center;
        }

        /* 1인칭 시점의 웅장한 우주 배경 */
        .space-bg {
            position: fixed; width: 100%; height: 100%;
            background: radial-gradient(circle at center, #1B2735 0%, #090A0F 100%);
            z-index: -1;
        }

        /* 별들이 쏟아지는 효과 */
        .stars {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://s3-us-west-2.amazonaws.com/s.cdpn.io/123163/stars.png') repeat;
            opacity: 0.4; animation: moveStars 120s linear infinite;
        }

        @keyframes moveStars {
            from { background-position: 0 0; }
            to { background-position: 10000px 5000px; }
        }

        /* 중앙 시스템 메시지 (사용자 이름 제거 버전) */
        .hub-header {
            margin-top: 10vh; text-align: center; z-index: 10;
        }
        .hub-title {
            font-size: 2.2rem; font-weight: 900; letter-spacing: 15px;
            text-shadow: 0 0 30px rgba(255,255,255,0.5);
            animation: fadeIn 3s ease-in;
            text-transform: uppercase;
        }
        .hub-status {
            color: #4facfe; font-size: 0.8rem; margin-top: 25px;
            letter-spacing: 8px; opacity: 0.7;
        }

        /* 행성들이 떠 있는 구역 */
        .planet-zone {
            display: flex; justify-content: center; align-items: center;
            gap: 80px; height: 60vh; width: 100%;
        }

        /* 행성 오브젝트 */
        .planet-obj {
            position: relative; width: 200px; height: 200px;
            border-radius: 50%; display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            cursor: pointer; transition: 0.8s cubic-bezier(0.165, 0.84, 0.44, 1);
            box-shadow: inset -25px -25px 60px rgba(0,0,0,0.7);
        }

        /* 행성별 고유 색상 및 광원 */
        .planet-gallery { background: radial-gradient(circle at 35% 35%, #5ee7ff, #0061ff); box-shadow: 0 0 50px rgba(0, 97, 255, 0.3); }
        .planet-profile { background: radial-gradient(circle at 35% 35%, #f6d365, #fda085); box-shadow: 0 0 50px rgba(253, 160, 133, 0.3); }
        .planet-video { background: radial-gradient(circle at 35% 35%, #ff0844, #ffb199); box-shadow: 0 0 50px rgba(255, 8, 68, 0.3); }

        .planet-obj:hover {
            transform: scale(1.25) rotate(5deg);
            box-shadow: 0 0 80px rgba(255, 255, 255, 0.4);
        }

        .planet-obj span {
            font-weight: bold; font-size: 1.2rem; letter-spacing: 4px;
            text-shadow: 0 4px 15px rgba(0,0,0,0.8);
            pointer-events: none;
        }

        /* 웅장한 둥실거림 애니메이션 */
        .float-1 { animation: drift 6s ease-in-out infinite; }
        .float-2 { animation: drift 7s ease-in-out infinite 1.5s; }
        .float-3 { animation: drift 6.5s ease-in-out infinite 0.7s; }

        @keyframes drift {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-30px) rotate(3deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; letter-spacing: 30px; }
            to { opacity: 1; letter-spacing: 15px; }
        }
    </style>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const userName = urlParams.get('user') || 'Explorer';

        function navigateTo(page) {
            location.href = `${page}.html?user=${encodeURIComponent(userName)}`;
        }
    </script>
</head>
<body>
    <div class="space-bg"></div>
    <div class="stars"></div>

    <div class="hub-header">
        <div class="hub-title">UNIVERSE HUB</div>
        <div class="hub-status">SYSTEM ONLINE : 현재 우주의 상태는 평온합니다</div>
    </div>

    <div class="planet-zone">
        <div class="planet-obj planet-gallery float-1" onclick="navigateTo('gallery')">
            <span style="font-size: 2.5rem; margin-bottom: 10px;">🌌</span>
            <span>GALLERY</span>
        </div>

        <div class="planet-obj planet-profile float-2" onclick="alert('ACCESS DENIED: 데이터 수신 중')">
            <span style="font-size: 2.5rem; margin-bottom: 10px;">👤</span>
            <span>PROFILE</span>
        </div>

        <div class="planet-obj planet-video float-3" onclick="alert('ACCESS DENIED: 경로 탐색 중')">
            <span style="font-size: 2.5rem; margin-bottom: 10px;">🎬</span>
            <span>VIDEO</span>
        </div>
    </div>
</body>
</html>
